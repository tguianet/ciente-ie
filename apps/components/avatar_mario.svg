  <ellipse cx="113" cy="103" rx="8" ry="9" fill="white"/>
  <circle cx="88" cy="104" r="5" fill="#1a0a00"/>
  <circle cx="114" cy="104" r="5" fill="#1a0a00"/>
  <circle cx="90" cy="102" r="2" fill="white"/>
  <circle cx="116" cy="102" r="2" fill="white"/>

  <!-- Nose -->
