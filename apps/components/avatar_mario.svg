  <!-- Smile -->
  <path d="M87 128 Q100 138 113 128" stroke="#c46050" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M87 128 Q100 140 113 128" stroke="none" fill="#f08080" opacity="0.3"/>
