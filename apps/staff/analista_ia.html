    ctx += `\nINSTRUÇÃO DE FORMATO: Siga a estrutura do SYSTEM_PROMPT exatamente. Para cada Caso Prioritário, mostre o fato (IGP + componente + tendência) separado da interpretação. Atenção Leve, Transição e Estáveis: lista compacta. No bloco Confiança, use a linha "Cobertura de indicadores" acima (Hooper/HRV/CMJ/NeuroScore) para classificar Alta/Moderada/Limitada. Finalize com a linha "Principal mensagem para a comissão técnica".\n`;
  }

  if (['aptidao_jogo','banco','titular_limite','minutagem_grupo'].includes(intent)) {
    const lista = await getAptidaoJogoGrupo(7);
    dados.push('getAptidaoJogoGrupo(7 dias)');
    ctx += `=== APTIDÃO PARA JOGO (${fmtDate(today)}) ===\n`;
    ctx += `Eixos analisados: (1) IGP atual, (2) Carga acumulada 7 dias, (3) Minutagem 7 dias\n\n`;

    const aptos     = lista.filter(a => a.score === 'Apto');
    const atencao   = lista.filter(a => a.score === 'Atenção');
    const risco     = lista.filter(a => a.score === 'Risco' || a.score === 'Afastado' || a.score === 'RTP');

    ctx += `APTOS:\n`;
    aptos.forEach(a => { ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp ?? '—'} | Carga 7d: ${a.carga7d} UA | Min 7d: ${a.min7d} min | Minutos seguros estimados: ${a.minSeguros ?? '—'}\n`; if(a.dor) ctx += `  ⚠ Tem queixa de dor ativa\n`; });
    ctx += `\nATENÇÃO:\n`;
    atencao.forEach(a => { ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp ?? '—'} | ${a.obs.join('; ')}\n`; if(a.dor) ctx += `  ⚠ Tem queixa de dor ativa\n`; });
    ctx += `\nRISCO / INDISPONÍVEL:\n`;
    risco.forEach(a => { ctx += `• ${a.nome} (${a.posicao}) | ${a.score} | ${a.obs.join('; ')}\n`; });

    if (intent === 'banco') { ctx += `\n(Para opções de banco, priorize atletas com score APTO e maior minSeguros)\n`; }
    if (intent === 'titular_limite') { ctx += `\nTITULARES COM CARGA ELEVADA (>300 UA ou >300 min na semana):\n`; aptos.concat(atencao).filter(a => a.carga7d > 300 || a.min7d > 300).forEach(a => ctx += `• ${a.nome} | Carga: ${a.carga7d} UA | Min: ${a.min7d} min\n`); }
    if (intent === 'minutagem_grupo') { ctx += `\nMINUTAGEM ESTIMADA SEGURA POR ATLETA (referência):\n`; lista.filter(a=>a.minSeguros!=null).sort((a,b)=>b.minSeguros-a.minSeguros).forEach(a => ctx += `• ${a.nome}: até ${a.minSeguros} min\n`); }

    // Alertas RTP e dor
    lista.filter(a => a.emRTP).forEach(a => alertas.push(`⚠ ALERTA: ${a.nome} está em fase RTP e aparece como ${a.score}.`));
    lista.filter(a => a.dor && a.score === 'Apto' && a.pseHoje != null && a.pseHoje >= 5).forEach(a => alertas.push(`⚠ ALERTA: ${a.nome} tem queixa de dor ativa (PSE ${a.pseHoje}/10) e está classificado como Apto.`));
  }

  if (['adaptacao_carga','resumo_dia_carga'].includes(intent) || intent === 'adaptacao_carga') {
    // Determina início da semana (MD+1 ou segunda-feira)
    const semanaInfo = await getInicioSemana(today);
    const weekStart  = semanaInfo.inicio;
    const diasSemana = Math.round((new Date(today+'T12:00:00') - new Date(weekStart+'T12:00:00')) / 86400000) + 1;

    // Carrega métricas: semana atual + 7 dias (ISP) + últimas 4 semanas (histórico) + 8 semanas (gráfico)
    const hist4wStart = dateAgoISO(weekStart, 28);
    const hist8wStart = dateAgoISO(weekStart, 56);
    const [adaptWeek, adapt7d, metricsHist, metrics8w] = await Promise.all([
      getAdaptacaoCarga(weekStart),                        // carga/PSE/volume da semana atual
      getAdaptacaoCarga(7),                                // janela 7 dias p/ tendência ISP
      loadMetrics(hist4wStart, dateAgoISO(weekStart, 1)), // 4 semanas anteriores
      loadMetrics(hist8wStart, dateAgoISO(weekStart, 1)), // 8 semanas anteriores (gráfico)
    ]);
    dados.push('getAdaptacaoCarga(semana)', 'getAdaptacaoCarga(7d ISP)', 'loadMetrics(4 semanas históricas)');

    const fn_avg = arr => arr.length ? parseFloat((arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1)) : null;
    const fn_med = arr => { if (!arr.length) return null; const s=[...arr].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:parseFloat(((s[m-1]+s[m])/2).toFixed(1)); };

    // Mescla tendência ISP (janela 7d) com dados da semana atual
    const tendenciaMap = {};
    adapt7d.filter(a => !a.semDados).forEach(a => {
      tendenciaMap[a.id] = { tendencia: a.tendencia, alertaISPACWR: a.alertaISPACWR, igpHoje: a.igpHoje };
    });
    const comDados = adaptWeek.filter(a => !a.semDados).map(a => {
      const t = tendenciaMap[a.id] || {};
      return { ...a, tendencia: t.tendencia ?? a.tendencia, alertaISPACWR: t.alertaISPACWR ?? a.alertaISPACWR, igpHoje: t.igpHoje ?? a.igpHoje };
    });

    // ── HOJE ──────────────────────────────────────
    const pseHojeArr   = comDados.map(a=>a.pseHoje).filter(v=>v!=null);
    const cargaHojeArr = comDados.map(a=>a.cargaHoje).filter(v=>v!=null);
    const tempoHojeArr = comDados.map(a=>a.tempoHoje).filter(v=>v!=null);
    const qualHojeArr  = comDados.map(a=>a.qualHoje).filter(v=>v!=null);
    const pseMedianaHoje = fn_med(pseHojeArr);

    // ── SEMANA ATUAL — média POR SESSÃO (não por semana total) ────────────────
    const pseSemArr   = comDados.map(a=>a.pseMedia).filter(v=>v!=null);
    // cargaTotal / número de sessões com dados => carga média por sessão
    const cargaSemArr = comDados.map(a => {
      const nSessoes = a.sessoesDetalhes.filter(s => s.carga != null && s.carga > 0).length;
      return nSessoes > 0 ? parseFloat((a.cargaTotal / nSessoes).toFixed(1)) : null;
    }).filter(v=>v!=null);
    const tempoSemArr = comDados.map(a => {
      const nSessoes = a.sessoesDetalhes.filter(s => s.tempo != null && s.tempo > 0).length;
      return nSessoes > 0 ? parseFloat((a.tempoTotal / nSessoes).toFixed(1)) : null;
    }).filter(v=>v!=null);

    // ── HISTÓRICO 4 SEMANAS — média POR SESSÃO ────────────────────────────────
    function mediaHistPorSessao(athleteId, campo) {
      const vals = metricsHist.filter(m=>m.athleteId===athleteId && m.post?.[campo]!=null && m.post[campo]>0).map(m=>m.post[campo]);
      if (!vals.length) return null;
      return parseFloat((vals.reduce((a,b)=>a+b,0) / vals.length).toFixed(1));
    }
    const cargaHistArr = comDados.map(a=>mediaHistPorSessao(a.id,'carga')).filter(v=>v!=null);
    const tempoHistArr = comDados.map(a=>mediaHistPorSessao(a.id,'tempo')).filter(v=>v!=null);

    ctx += `=== CARGA DA SEMANA ===\n`;
    ctx += `Início da semana: ${fmtDate(weekStart)} (${semanaInfo.label}) | Dias treinados até hoje: ${diasSemana}\n`;
    ctx += `Atletas com dados: ${comDados.length}\n\n`;

    const cargaHojeMed = fn_avg(cargaHojeArr);
    const pseHojeMed   = fn_avg(pseHojeArr);
    ctx += `HOJE (${fmtDate(today)}):\n`;
    ctx += `• Carga média do dia: ${cargaHojeMed ?? '—'} UA${cargaHojeMed != null ? ` — ${classificaCarga(cargaHojeMed)}` : ''}\n`;
    ctx += `• PSE média do dia: ${pseHojeMed ?? '—'}/10${pseHojeMed != null ? ` — ${classificaPSE(pseHojeMed)}` : ''} | Mediana PSE: ${pseMedianaHoje ?? '—'}\n`;
    ctx += `• Volume médio do dia: ${fn_avg(tempoHojeArr) ?? '—'} min\n`;
    ctx += `• Qualidade média do dia: ${fn_avg(qualHojeArr) ?? '—'}/5\n\n`;

    ctx += `SEMANA (${fmtDate(weekStart)} → ${fmtDate(today)}):\n`;
    ctx += `• Carga média/sessão da semana: ${fn_avg(cargaSemArr) ?? '—'} UA${fn_avg(cargaSemArr) != null ? ` — ${classificaCarga(fn_avg(cargaSemArr))}` : ''} | Histórico 4 sem.: ${fn_avg(cargaHistArr) ?? '—'} UA/sessão\n`;
    ctx += `• Volume médio/sessão da semana: ${fn_avg(tempoSemArr) ?? '—'} min | Histórico 4 sem.: ${fn_avg(tempoHistArr) ?? '—'} min/sessão\n\n`;

    // PSE acima da mediana hoje (apenas 2+ pontos acima)
    ctx += `LEGENDA PSE: 1=Muito leve | 2=Leve | 3-4=Moderada | 5=Um pouco intensa | 6=Intensa | 7-8=Muito intensa | 9=Submáxima | 10=Máxima\n\n`;
    if (pseMedianaHoje != null) {
      const limiar = pseMedianaHoje + 2;
      const acimaMed = comDados.filter(a => a.pseHoje != null && a.pseHoje >= limiar);
      ctx += `ATLETAS COM PSE ≥ ${limiar} (mediana+2, mediana=${pseMedianaHoje}):\n`;
      if (acimaMed.length) {
        acimaMed.sort((a,b)=>b.pseHoje-a.pseHoje).forEach(a => ctx += `• ${a.nome} (${a.posicao}) — PSE ${a.pseHoje}/10 (${classificaPSE(a.pseHoje)}) | Carga ${a.cargaHoje??'—'} UA${a.cargaHoje!=null?` (${classificaCarga(a.cargaHoje)})`:''} | ${a.tempoHoje??'—'} min\n`);
      } else { ctx += `Nenhum com PSE ≥ ${limiar}.\n`; }
      ctx += '\n';
    }

    // ISP — tendência de queda
    const alertaISP = comDados.filter(a => a.alertaISPACWR);
    alertaISP.forEach(a => alertas.push(`⚠ RISCO SOBRECARGA: ${a.nome} — carga acumulada elevada + IGP em queda.`));
    const emQueda = comDados.filter(a => a.tendencia === 'Queda');
    ctx += `ATLETAS COM TENDÊNCIA DE QUEDA (ISP):\n`;
    if (emQueda.length) {
      emQueda.forEach(a => {
        const cargaPorSessao = a.sessoesDetalhes.filter(s=>s.carga!=null&&s.carga>0).length > 0 ? parseFloat((a.cargaTotal / a.sessoesDetalhes.filter(s=>s.carga!=null&&s.carga>0).length).toFixed(0)) : null;
        ctx += `• ${a.nome} (${a.posicao}) — IGP ${a.igpHoje ?? '—'} | PSE sem. ${a.pseMedia??'—'}/10${a.pseMedia!=null?` (${classificaPSE(a.pseMedia)})`:''} | Carga/sessão ${cargaPorSessao??'—'} UA${cargaPorSessao!=null?` (${classificaCarga(cargaPorSessao)})`:''}`;
        if (a.alertaISPACWR) ctx += ` ⚠ RISCO`;
        if (a.dorRegioes.length) ctx += ` | Dor: ${a.dorRegioes.join(', ')}`;
        ctx += '\n';
      });
    } else { ctx += `Nenhum atleta em queda.\n`; }
    ctx += '\n';

    // Dor coletiva
    const comDor = comDados.filter(a => a.dorRegioes.length > 0);
    ctx += `QUEIXAS DE DOR (semana):\n`;
    if (comDor.length) {
      comDor.forEach(a => ctx += `• ${a.nome} (${a.posicao}) — ${a.dorRegioes.join(', ')} — ${a.dorDias} dia(s)\n`);
    } else { ctx += `Nenhuma.\n`; }

    // ── BUILD CARD DATA ───────────────────────────────────────────────────────
    try {
      const _fn  = arr => arr.length ? parseFloat((arr.reduce((s,v)=>s+v,0)/arr.length).toFixed(1)) : null;
      const _rnd = v => v != null ? Math.round(v) : null;

      // Normaliza posição para grupo
      const _np = (pos) => {
        if (!pos) return 'Outro';
        const p = pos.toUpperCase().trim().replace(/-/g,'').replace(/\s+/g,' ');
        if (p==='GR'||p==='GOL'||p.includes('GOLEIRO')) return 'Goleiro';
        if (p.includes('ZAGUEIR')||p==='ZAG') return 'Zagueiro';
        if (p.includes('LATERAL')||p==='LAT') return 'Lateral';
        if (p.includes('VOLANTE')||p==='VOL') return 'Volante';
        if (p.includes('MEIA')||p==='MEI'||p.includes('ARMADOR')||p.includes('TREQU')) return 'Meia';
        if (p.includes('PONTA')||p.includes('EXTREMO')||p==='ALA') return 'Ponta';
        if (p.includes('CENTROAV')||p.includes('ATACANTE')||p==='ATA'||p==='CA'||p==='CENTRO AVANTE') return 'Centro-avante';
        return 'Outro';
      };

      // Grupos de posição
      const _GRUPOS = [
        { label: 'Zagueiros',   pos: ['Zagueiro'] },
        { label: 'Laterais',    pos: ['Lateral'] },
        { label: 'Volantes',    pos: ['Volante'] },
        { label: 'Meias',       pos: ['Meia'] },
        { label: 'Pontas',      pos: ['Ponta'] },
        { label: 'C. Avantes',  pos: ['Centro-avante'] },
      ];
      const porPosicao = _GRUPOS.map(grp => {
        const ats = comDados.filter(a => grp.pos.includes(_np(a.posicao)));
        if (!ats.length) return null;
        const athIds = new Set(ats.map(a => a.id));
        const hmets  = metricsHist.filter(m => athIds.has(m.athleteId));
        const cSem = _fn(ats.map(a => {
          const n = a.sessoesDetalhes.filter(s=>(s.carga??0)>0).length;
          return n > 0 ? a.cargaTotal / n : null;
        }).filter(v=>v!=null));
        return {
          label: grp.label, n: ats.length,
          sem:  { carga:_rnd(cSem), pse:_fn(ats.map(a=>a.pseMedia).filter(v=>v!=null)), vol:_rnd(_fn(ats.map(a=>a.tempoMedia).filter(v=>v!=null))), qual:_fn(ats.map(a=>a.qualMedia).filter(v=>v!=null)) },
          hist: { carga:_rnd(_fn(hmets.filter(m=>(m.post?.carga??0)>0).map(m=>m.post.carga))), pse:_fn(hmets.filter(m=>(m.post?.pse??0)>0).map(m=>m.post.pse)), vol:_rnd(_fn(hmets.filter(m=>(m.post?.tempo??0)>0).map(m=>m.post.tempo))), qual:_fn(hmets.filter(m=>(m.post?.qualidade??0)>0).map(m=>m.post.qualidade)) },
        };
      }).filter(Boolean);

      // ISP
      const isp = {
        melhorando: comDados.filter(a=>a.tendencia==='Melhora').map(a=>({nome:a.nome,pos:a.posicao,igp:a.igpHoje,acwr:a.acwr})),
        estavel:    comDados.filter(a=>a.tendencia==='Estável').map(a=>({nome:a.nome,pos:a.posicao,igp:a.igpHoje,acwr:a.acwr})),
        piorando:   comDados.filter(a=>a.tendencia==='Queda').map(a=>({nome:a.nome,pos:a.posicao,igp:a.igpHoje,acwr:a.acwr,alerta:a.alertaISPACWR})),
        insuf:      comDados.filter(a=>a.tendencia==='Insuficiente').length,
      };

      // Fadiga
      const fadiga = {
        residual:    comDados.filter(a=>a.tendencia==='Queda'&&!a.alertaISPACWR).map(a=>({nome:a.nome,pos:a.posicao,igp:a.igpHoje,acwr:a.acwr})),
        persistente: comDados.filter(a=>a.alertaISPACWR).map(a=>({nome:a.nome,pos:a.posicao,igp:a.igpHoje,acwr:a.acwr})),
      };

      // Gráfico 8 semanas
      const _getWk = (dateStr) => {
        const d = new Date(dateStr+'T12:00:00');
        const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
        t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
        const y1 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
        const wk = Math.ceil((((t-y1)/86400000)+1)/7);
        return `${t.getUTCFullYear()}-W${String(wk).padStart(2,'0')}`;
      };
      const wkMap = {};
      (metrics8w||metricsHist).forEach(m => {
        if (!(m.post?.carga>0)) return;
        const wk = _getWk(m.date);
        if (!wkMap[wk]) wkMap[wk] = {};
        wkMap[wk][m.athleteId] = (wkMap[wk][m.athleteId]||0) + m.post.carga;
      });
      const semanas8 = Object.entries(wkMap).map(([wk,aths]) => {
        const vals = Object.values(aths);
        return { wk, carga: Math.round(vals.reduce((s,v)=>s+v,0)/vals.length) };
      }).sort((a,b)=>a.wk.localeCompare(b.wk)).slice(-7);
      // Adiciona semana atual
      const wkCurrent = _getWk(today);
      const cWkTotais = comDados.map(a=>a.cargaTotal).filter(v=>v>0);
      if (cWkTotais.length) semanas8.push({ wk: wkCurrent, carga: Math.round(cWkTotais.reduce((s,v)=>s+v,0)/cWkTotais.length), current: true });

      // Microciclo: sessões coletivas da semana
      const matchDates = [...(semanaInfo?.matchDates || [])];
      // Complementa com jogo configurado no microciclo (localStorage) — fonte mais confiável
      const _mcCtx = _getMicrocicloCtx();
      if (_mcCtx?.jogoA && !matchDates.includes(_mcCtx.jogoA)) matchDates.push(_mcCtx.jogoA);
      if (_mcCtx?.jogoB && !matchDates.includes(_mcCtx.jogoB)) matchDates.push(_mcCtx.jogoB);
      const _getMDLabel = (dateStr) => {
        if (!matchDates.length) return null;
        let best = null, bestDist = Infinity;
        for (const m of matchDates) {
          const diff = Math.round((new Date(dateStr+'T12:00:00')-new Date(m+'T12:00:00'))/86400000);
          // Em caso de empate de distância, preferir jogo futuro (MD-X) sobre passado (MD+X)
          if (Math.abs(diff)<bestDist || (Math.abs(diff)===bestDist && diff<0)) {
            best=diff; bestDist=Math.abs(diff);
          }
        }
        if (best===null||bestDist>7) return null;
        if (best===0) return 'MD0';
        return best>0?`MD+${best}`:`MD${best}`;
      };
      const byDate = {};
      const totalCdAts = comDados.length||10;
      const minThresh = Math.max(3,Math.floor(totalCdAts*0.2));
      comDados.forEach(a => {
        a.sessoesDetalhes.forEach(s => {
          if (s.date<weekStart||s.date>today) return;
          if (!byDate[s.date]) byDate[s.date]={pses:[],cargas:[],vols:[],quals:[]};
          if (s.pse!=null) byDate[s.date].pses.push(s.pse);
          if ((s.carga??0)>0) byDate[s.date].cargas.push(s.carga);
          if ((s.tempo??0)>0) byDate[s.date].vols.push(s.tempo);
          if (s.qualidade!=null) byDate[s.date].quals.push(s.qualidade);
        });
      });
      // Hist por MD label
      const histByMD = {};
      if (matchDates.length) {
        metricsHist.forEach(m => {
          if (!(m.post?.carga>0)) return;
          const lbl = _getMDLabel(m.date);
          if (!lbl) return;
          if (!histByMD[lbl]) histByMD[lbl]=[];
          histByMD[lbl].push(m.post.carga);
        });
      }
      const dias7 = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
      const microciclo = Object.entries(byDate)
        .filter(([,data])=>data.pses.length>=minThresh)
        .sort(([a],[b])=>a.localeCompare(b))
        .map(([date,data])=>{
          const d = new Date(date+'T12:00:00');
          const mdLabel = _getMDLabel(date)||`${dias7[d.getDay()]} ${d.getDate()}`;
          const dateLabel = `${dias7[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
          const histArr = histByMD[mdLabel]||[];
          return {
            date, dateLabel, mdLabel,
            pse:  _fn(data.pses),
            carga:data.cargas.length?Math.round(_fn(data.cargas)):null,
            vol:  data.vols.length?Math.round(_fn(data.vols)):null,
            qual: _fn(data.quals),
            histCarga: histArr.length?Math.round(histArr.reduce((s,v)=>s+v,0)/histArr.length):null,
            n: data.pses.length,
          };
        });

      _cargaSemanaCache = { porPosicao, isp, fadiga, semanas8, microciclo, weekStart, today, semanaInfo };
    } catch(e) { console.warn('[_cargaSemanaCache]:', e.message); _cargaSemanaCache = null; }
  }

  if (intent === 'resumo_semana' || intent === 'melhora') {
    const sem = await getResumoSemanal();
    dados.push('getResumoSemanal(7 dias)');
    ctx += `=== RESUMO SEMANAL ===\n`;
    ctx += `IGP médio do grupo: ${sem.mediaGrupo ?? '—'}\n\n`;
    ctx += `EM MELHORA (IGP subiu >5 pts):\n`;
    sem.melhora.forEach(a => ctx += `• ${a.nome} | IGP médio ${a.mediaIGP} | ↑ ${a.delta} pts\n`);
    if (!sem.melhora.length) ctx += `Nenhum\n`;
    ctx += `\nEM QUEDA (IGP caiu >5 pts):\n`;
    sem.queda.forEach(a => ctx += `• ${a.nome} | IGP médio ${a.mediaIGP} | ↓ ${Math.abs(a.delta)} pts\n`);
    if (!sem.queda.length) ctx += `Nenhum\n`;
    if (intent !== 'melhora') {
      ctx += `\nTODOS OS ATLETAS (ordem por IGP médio):\n`;
      sem.atletas.forEach(a => ctx += `• ${a.nome} | IGP médio ${a.mediaIGP} | Variação: ${a.delta > 0 ? '+' : ''}${a.delta} | Carga total: ${a.cargaTotal} UA | Dias com coleta: ${a.dias}\n`);
    }
  }

  if (intent === 'dept_medico') {
    const rtp = await getStatusRTP();
    dados.push('getStatusRTP()');
    ctx += `=== DEPARTAMENTO MÉDICO (apenas atletas ativos no cadastro) ===\n`;
    ctx += `Data de referência: ${fmtDate(today)}\n`;
    ctx += `Afastados/Transição: ${rtp.totalFora}\n\n`;
    ctx += `AFASTADOS / EM TRANSIÇÃO:\n`;
    rtp.afastados.forEach(a => {
      ctx += `• ${a.nome} | Tipo de lesão: ${a.tipo} | Região: ${a.regiao} | Status: ${a.status} | Data de início: ${a.data} (${fmtDate(a.data)})\n`;
    });
    if (!rtp.afastados.length) ctx += `Nenhum\n`;
    ctx += `\nPROGRESSO RTP:\n`;
    rtp.rtpFases.forEach(r => ctx += `• ${r.nome} | F${r.fase} — ${r.label}\n`);
    if (!rtp.rtpFases.length) ctx += `Sem dados de RTP\n`;
    ctx += `\nHISTÓRICO DE LESÕES (atletas disponíveis com lesão anterior):\n`;
    rtp.historico.forEach(a => ctx += `• ${a.nome} | Tipo de lesão: ${a.tipo} | Região: ${a.regiao} | Data de início: ${a.data} | Alta: ${fmtDate(a.dataAlta)}\n`);
    if (!rtp.historico.length) ctx += `Nenhum registro de lesão anterior nos atletas disponíveis\n`;
    ctx += `\n(Para atletas afastados com tipo de lesão informado, calcule a janela estimada de retorno com base na literatura esportiva, usando a data de início como referência. Indique sempre que é estimativa.)\n`;
  }

  if (intent === 'queixas') {
    const q = await getQueixasMedicas(7);
    dados.push('getQueixasMedicas(7 dias)');
    ctx += `=== QUEIXAS DO ELENCO — ÚLTIMOS 7 DIAS ===\n`;
    ctx += `DORES RELATADAS (pré-coleta):\n`;
    q.queixas.forEach(a => { ctx += `• ${a.nome} | Regiões: ${a.regioes} | ${a.dias} dia(s)${a.recorrente ? ' — RECORRENTE ⚠' : ''}\n`; });
    if (!q.queixas.length) ctx += `Nenhuma queixa de dor registrada\n`;
    ctx += `\nATENDIMENTOS MÉDICOS:\n`;
    q.atendimentos.forEach(a => ctx += `• ${a.nome} (${fmtDate(a.data)}) | Queixa: ${a.queixa} | Conduta: ${a.conduta}\n`);
    if (!q.atendimentos.length) ctx += `Nenhum atendimento registrado\n`;
  }

  if (intent === 'resumo_treino' || intent === 'dia_treino') {
    const comPost = (await loadMetrics(today, today)).filter(m => m.post?.carga || m.post?.pse);
    const athletes = await loadAthletes();
    const athMap = {};
    athletes.forEach(a => { athMap[a.id] = a; });
    dados.push(`getMetricasPosTranseino(${today})`);
    ctx += `=== DIA DE TREINO — PÓS-SESSÃO (${fmtDate(today)}) ===\n`;
    if (!comPost.length) {
      ctx += 'Nenhum dado de pós-treino registrado hoje ainda.\n';
    } else {
      const avgPSE   = comPost.reduce((s,m)=>s+(m.post?.pse??0),0)/comPost.length;
      const cargaTot = comPost.reduce((s,m)=>s+(m.post?.carga??0),0);
      const avgQual  = comPost.reduce((s,m)=>s+(m.post?.qualidade??0),0)/comPost.length;
      const avgTempo = comPost.reduce((s,m)=>s+(m.post?.tempo??0),0)/comPost.length;
      ctx += `Atletas com registro: ${comPost.length}/${athletes.length}\n`;
      ctx += `PSE médio: ${avgPSE.toFixed(1)} | Carga total: ${cargaTot.toFixed(0)} UA | Qualidade média: ${avgQual.toFixed(1)}/5 | Duração média: ${avgTempo.toFixed(0)} min\n\n`;
      ctx += 'INDIVIDUAL:\n';
      comPost.forEach(m => {
        const a = athMap[m.athleteId];
        if (!a) return;
        const alertaTag = (m.post?.pse??0)>=8 ? ' ⚠ PSE alto' : (m.post?.qualidade??5)<=2 ? ' ⚠ Qualidade baixa' : '';
        ctx += `• ${a.nome} (${a.posicao}) | PSE ${m.post?.pse??'—'} | Carga ${m.post?.carga??'—'} UA | Qualidade ${m.post?.qualidade??'—'}/5 | ${m.post?.tempo??'—'} min${alertaTag}\n`;
      });
      const semPost = athletes.filter(a => !comPost.find(m=>m.athleteId===a.id));
      if (semPost.length) ctx += `\nSem registro pós-treino: ${semPost.map(a=>a.nome).join(', ')}\n`;
    }
  }

  if (intent === 'resumo_jogo') {
    const jogo = await getResumoJogo();
    dados.push('getResumoJogo()');
    if (!jogo) {
      ctx += `Nenhuma partida registrada no sistema de scout.\n`;
    } else {
      ctx += `=== JOGO: ${jogo.data} vs ${jogo.adversario} (${jogo.local}) — ${jogo.placar} ===\n`;
      if (jogo.confiancaBaixa) ctx += `⚠ Poucos eventos registrados (${jogo.fatorConfianca}) — interprete com cautela.\n`;
      ctx += `\n`;

      // Posse de bola
      ctx += `=== POSSE DE BOLA ===\n`;
      ctx += `Total: América ${jogo.posse.am}% × Adversário ${jogo.posse.adv}%\n`;
      if (jogo.posse.zona) {
        const z = jogo.posse.zona;
        ctx += `Distribuição da posse da equipe por zona: Defesa=${z.defesa}% Meio=${z.meio}% Ataque=${z.ataque}%\n`;
        // Interpretação
        if (z.ataque >= 40) ctx += `→ Posse predominantemente no campo adversário (zona de ataque).\n`;
        else if (z.defesa >= 40) ctx += `→ Posse concentrada no campo defensivo — possível pressão do adversário ou construção baixa.\n`;
        else ctx += `→ Posse equilibrada pelos setores.\n`;
      }

      // Ações por zona
      if (jogo.acoesZona) {
        const az = jogo.acoesZona;
        const totalAcoes = (az.defesa||0)+(az.meio||0)+(az.ataque||0)||1;
        ctx += `\n=== AÇÕES POR ZONA ===\n`;
        ctx += `Defesa: ${az.defesa||0} ações (${Math.round((az.defesa||0)/totalAcoes*100)}%) | Meio: ${az.meio||0} ações (${Math.round((az.meio||0)/totalAcoes*100)}%) | Ataque: ${az.ataque||0} ações (${Math.round((az.ataque||0)/totalAcoes*100)}%)\n`;
      }

      // Bolas paradas
      ctx += `\n=== BOLAS PARADAS ===\n`;
      const bp = jogo.bolasParadas;
      if (bp.totalEventos === 0) {
        ctx += `Sem eventos de bola parada registrados.\n`;
      } else {
        ctx += `Eventos em BP: ${bp.totalEventos} | Finalizações/chances (pró): ${bp.finPro} | Finalizações adversário em BP: ${bp.finAdv}\n`;
        ctx += `NOTA: dados de bola parada mostram finalizações registradas, não origem de gol.\n`;
      }

      // Duelos
      const d = jogo.duelos;
      const totalD = d.totalGanho + d.totalPerdido || 1;
      const pctGanho = Math.round(d.totalGanho / totalD * 100);
      ctx += `\n=== DUELOS ===\n`;
      ctx += `Total: ${d.totalGanho} ganhos × ${d.totalPerdido} perdidos (${pctGanho}% aproveitamento)\n`;
      ctx += `Por tipo: Alto — ganhos ${d.ganhoAlto} × perdidos ${d.perdidoAlto} | Chão — ganhos ${d.ganhoChao} × perdidos ${d.perdidoChao}\n`;
      const ds = d.porSetor;
      ctx += `Por setor:\n`;
      ctx += `  Defesa: ${ds.defesa.ganho}G × ${ds.defesa.perdido}P\n`;
      ctx += `  Meio: ${ds.meio.ganho}G × ${ds.meio.perdido}P\n`;
      ctx += `  Ataque: ${ds.ataque.ganho}G × ${ds.ataque.perdido}P\n`;
      if (d.totalGanho + d.totalPerdido === 0) ctx += `Sem duelos registrados.\n`;

      // Gols e assistências
      if (jogo.gols.length) {
        ctx += `\n=== GOLS ===\n`;
        ctx += `Marcadores: ${jogo.gols.join(', ')}\n`;
        if (jogo.assistencias.length) ctx += `Assistências: ${jogo.assistencias.join(', ')}\n`;
      }

      // Destaques individuais (breve)
      const comAcoes = jogo.destaques.filter(a => a.acoes >= 2);
      if (comAcoes.length) {
        ctx += `\n=== DESEMPENHO INDIVIDUAL (resumo) ===\n`;
        ctx += `TOP 3: `;
        ctx += comAcoes.slice(0,3).map(a => `${a.nome} (score ${a.score}: ${a.top})`).join(' | ') + '\n';
        if (comAcoes.length > 5) {
          ctx += `Menor desempenho: `;
          ctx += comAcoes.slice(-2).map(a => `${a.nome} (score ${a.score})`).join(', ') + '\n';
        }
      }

      ctx += `\nINSTRUÇÃO: Foque a análise em posse por zona, duelos (aproveitamento geral, por tipo alto/chão e por setor) e bolas paradas (finalizações, sem inventar origem de gol). Atletas: uma frase para destaques positivos e uma para os de menor desempenho. A última frase deve ser contexto geral do jogo (coletivo). NUNCA invente dados que não estejam explícitos no contexto acima.\n`;
    }
  }

  if (intent === 'desempenho_jogo') {
    const jogo = await getDesempenhoJogo();
    dados.push('getDesempenhoJogo()');
    if (!jogo) {
      ctx += `Nenhuma partida registrada no sistema.\n`;
    } else {
      ctx += `=== JOGO: ${jogo.data} vs ${jogo.adversario} (${jogo.local}) — ${jogo.placar} ===\n`;
      if (jogo.confiancaBaixa) ctx += `⚠ Poucos eventos com atleta identificado (${jogo.totalEventos} total) — interprete com cautela.\n`;

      // Posse
      ctx += `\nPOSSE DE BOLA: Equipe ${jogo.posse.am}% × Adversário ${jogo.posse.adv}%\n`;
      if (jogo.posse.zona) {
        const z = jogo.posse.zona;
        ctx += `Por zona (% do tempo da equipe): Defesa ${z.defesa}% | Meio ${z.meio}% | Ataque ${z.ataque}%\n`;
      }
      if (jogo.acoesZona) {
        const az = jogo.acoesZona;
        const tot = (az.defesa||0)+(az.meio||0)+(az.ataque||0)||1;
        ctx += `Ações por zona: Defesa ${az.defesa||0} (${Math.round((az.defesa||0)/tot*100)}%) | Meio ${az.meio||0} (${Math.round((az.meio||0)/tot*100)}%) | Ataque ${az.ataque||0} (${Math.round((az.ataque||0)/tot*100)}%)\n`;
      }

      // Duelos
      const d = jogo.duelos;
      const totD = d.g + d.p || 1;
      ctx += `\nDUELOS: ${d.g} ganhos × ${d.p} perdidos (${Math.round(d.g/totD*100)}% aproveitamento)\n`;
      ctx += `Por tipo: Alto ${d.gAlto}G / ${d.pAlto}P | Chão ${d.gChao}G / ${d.pChao}P\n`;
      const ds = d.porSetor;
      ctx += `Por setor: Defesa ${ds.defesa.g}G/${ds.defesa.p}P | Meio ${ds.meio.g}G/${ds.meio.p}P | Ataque ${ds.ataque.g}G/${ds.ataque.p}P\n`;
      if (d.comTiming > 0) {
        ctx += `Por período (duelos com timing: ${d.comTiming} de ${d.g+d.p}):\n`;
        d.periodo.forEach(per => { if (per.g+per.p > 0) ctx += `  ${per.lbl}min: ${per.g}G × ${per.p}P\n`; });
      } else {
        ctx += `Período dos duelos: timing não disponível nos eventos.\n`;
      }

      // Roubadas com setor
      ctx += `\nROUBADAS: ${jogo.roubadas} total`;
      if (jogo.roubadasPorSetor) {
        const rs = jogo.roubadasPorSetor;
        ctx += ` | por setor: Defesa ${rs.defesa} · Meio ${rs.meio} · Ataque ${rs.ataque}`;
      }
      ctx += '\n';

      // Finalizações + entradas no último terço
      ctx += `\nFINALIZAÇÕES: ${jogo.finalizacoes.pro} a favor × ${jogo.finalizacoes.adv} adversário`;
      if (jogo.chancesClaras) ctx += ` | Chances claras: ${jogo.chancesClaras}`;
      ctx += '\n';
      if (jogo.entradasUltimoTerco != null) {
        const convPct = jogo.entradasUltimoTerco > 0
          ? Math.round(jogo.finalizacoes.pro / jogo.entradasUltimoTerco * 100) : 0;
        ctx += `ENTRADAS NO ÚLTIMO TERÇO: ${jogo.entradasUltimoTerco} | Finalizações/entrada: ${convPct}%\n`;
      }

      // Cartões
      if (jogo.cartoes.amarelos || jogo.cartoes.vermelhos)
        ctx += `\nCARTÕES: ${jogo.cartoes.amarelos} amarelos${jogo.cartoes.vermelhos ? ', ' + jogo.cartoes.vermelhos + ' vermelho(s)' : ''}\n`;

      // Rankings individuais (sem passe-chave — não coletado no scout)
      ctx += `\nDESTAQUES INDIVIDUAIS:\n`;
      if (jogo.rankGols.length)        ctx += `Gols: ${jogo.rankGols.map(a=>`${a.nome} (${a.val})`).join(', ')}\n`;
      if (jogo.rankAssist.length)      ctx += `Assistências: ${jogo.rankAssist.map(a=>`${a.nome} (${a.val})`).join(', ')}\n`;
      if (jogo.rankDuelosG.length)     ctx += `Melhores em duelos: ${jogo.rankDuelosG.map(a=>`${a.nome}/${a.posicao} (${a.val}G)`).join(' | ')}\n`;
      if (jogo.rankRoubadas.length)    ctx += `Melhores em roubadas: ${jogo.rankRoubadas.map(a=>`${a.nome}/${a.posicao} (${a.val})`).join(' | ')}\n`;
      if (jogo.rankFin.length)         ctx += `Melhores em finalizações: ${jogo.rankFin.map(a=>`${a.nome}/${a.posicao} (${a.val})`).join(' | ')}\n`;
      if (jogo.rankErros.length)       ctx += `Mais erros: ${jogo.rankErros.slice(0,3).map(a=>`${a.nome} (${a.val})`).join(' | ')}\n`;

      ctx += `\nINSTRUÇÃO: Faça um resumo conciso do jogo — resultado, posse, duelos (aproveitamento geral e por setor), roubadas, finalizações e destaques individuais. Seja direto: máx. 5-6 bullets. NUNCA invente dados.\n`;

      // Prepara dados visuais (gráficos e minutagem)
      _chartData = { type: 'match', events: jogo._events, duracaoSegundos: jogo._partida.duracaoSegundos || 0, posseSetor: jogo._partida.possePorSetor || null, minutagem: jogo.minutagem, adversario: jogo.adversario, placarPro: jogo._partida.placar?.pro ?? 0, placarContra: jogo._partida.placar?.contra ?? 0, posseAm: jogo.posse.am, posseAdv: jogo.posse.adv };
    }
  }

  if (intent === 'recuperacao') {
    const r = await getResumoDia(today);
    const partidas = await loadScoutMatches(1);
    dados.push(`getResumoDia(${today})`, 'getScoutMatches(última partida)');
    const dataJogo = partidas[0]?.data || '—';
    ctx += `=== RECUPERAÇÃO PÓS-JOGO ===\n`;
    ctx += `Último jogo: ${fmtDate(dataJogo)} vs ${partidas[0]?.adversario||'—'}\n`;
    ctx += `Prontidão atual do elenco (${fmtDate(today)}):\n\n`;
    r.atletas.forEach(a => {
      ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp ?? 'sem coleta'} — ${a.status}`;
      if (a.dor?.length) ctx += ` | Dor: ${a.dor.join(', ')}`;
      ctx += '\n';
    });
  }

  if (['atleta_evolucao','atleta_lesoes','atleta_inm','atleta_carga','atleta_jogos'].includes(intent)) {
    const athId = getFilterAtleta();
    if (!athId) {
      ctx += `⚠ Selecione um atleta no filtro acima para usar as análises individuais.\n`;
    } else {
      const ath = (_athletesAll||[]).find(a => a.id === athId);
      const athNome = ath?.nome || athId;

      // Carrega médico primeiro para ajustar janela de histórico se necessário
      const [medical, partidas] = await Promise.all([loadMedical(), loadScoutMatches(10)]);
      let startHist = dateAgoISO(today, 180);
      if (intent === 'atleta_lesoes') {
        const lesoesDatas = medical
          .filter(m => m.athleteId === athId && (m.dados?.tipoRegistro||'') !== 'atendimento' && m.data)
          .map(m => m.data).sort();
        if (lesoesDatas.length) {
          const preLesao = dateAgoISO(lesoesDatas[0], 14);
          startHist = preLesao < dateAgoISO(today, 365) ? dateAgoISO(today, 365) : preLesao;
        }
      }
      const metricsHist = await loadMetrics(startHist, today);
      dados.push(`loadMetrics(${startHist}→${today})`, `loadMedical()`, `loadScoutMatches(10)`);

      const hist = metricsHist
        .filter(d => d.athleteId === athId)
        .sort((a,b) => a.date.localeCompare(b.date));

      // ── Helpers ────────────────────────────────────────────────────────
      const avg = arr => { const v = arr.filter(x=>x!=null); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; };
      const classINM = v => v==null?'—': v>=60?'Estável':v>=50?'Atenção Leve':v>=40?'Atenção':'Crítico';
      const tendStr  = (ini, fim) => {
        if (ini==null||fim==null) return '—';
        const d = fim-ini;
        return d>5?`↑ +${d}pts`: d<-5?`↓ ${d}pts`:`→ estável (Δ${d>0?'+':''}${d})`;
      };

      // Extrai segundos jogados independente do formato (número ou {seconds:N})
      const getSegJogados = (p, id) => {
        const val = p.playedSeconds?.[id] ?? null;
        if (val == null) return null;
        const raw = typeof val === 'object' ? (val.seconds ?? 0) : typeof val === 'number' ? val : 0;
        return raw > 0 ? raw : null;
      };

      // ── Resumo semanal (agregado) ───────────────────────────────────────
      const semanas = {};
      hist.forEach(d => {
        const dt = new Date(d.date+'T00:00:00'), mon = new Date(dt);
        mon.setDate(dt.getDate()-dt.getDay()+1);
        const k = mon.toISOString().slice(0,10);
        if (!semanas[k]) semanas[k] = [];
        semanas[k].push(d);
      });
      const semList = Object.entries(semanas).sort(([a],[b])=>a.localeCompare(b));
      const semData = semList.map(([sem, dias]) => {
        const igps = dias.map(d => calcIGP(d.pre, d.hrv, d.neuro));
        return {
          sem,
          igp:  avg(igps.map(x=>x.global)),
          ih:   avg(igps.map(x=>x.IH)),
          ia:   avg(igps.map(x=>x.IA)),
          inm:  avg(igps.map(x=>x.INM)),
          ic:   avg(igps.map(x=>x.IC)),
          carga:dias.reduce((s,d)=>s+(d.post?.carga??0),0),
          n:    dias.length,
          // dados brutos disponíveis nesta semana
          temHRV: dias.some(d=>d.hrv?.lnRR!=null),
          temCMJ: dias.some(d=>d.pre?.salto!=null),
          temIC:  dias.some(d=>d.neuro?.score!=null),
        };
      });

      // ── Cobertura de dados ──────────────────────────────────────────────
      const igpVals  = semData.map(s=>s.igp).filter(v=>v!=null);
      const inmVals  = semData.map(s=>s.inm).filter(v=>v!=null);
      const iaVals   = semData.map(s=>s.ia).filter(v=>v!=null);
      const semComHRV = semData.filter(s=>s.temHRV).length;
      const semComCMJ = semData.filter(s=>s.temCMJ).length;
      const semComIC  = semData.filter(s=>s.temIC).length;

      _chartData = { nome: athNome, semData };
      ctx += `=== ATLETA: ${athNome} (${ath?.posicao||'—'} | ${ath?.categoria||'—'}) ===\n`;
      ctx += `Período: ${hist.length?fmtDate(hist[0].date):'—'} → ${fmtDate(today)} | ${hist.length} dias com coleta | ${semData.length} semanas\n`;
      ctx += `Cobertura: HRV em ${semComHRV}/${semData.length} sem | CMJ em ${semComCMJ}/${semData.length} sem | NeuroScore em ${semComIC}/${semData.length} sem\n\n`;

      // ── Tendência geral (início → atual) ──────────────────────────────
      const iniIGP = igpVals.slice(0,3), fimIGP = igpVals.slice(-3);
      const mediaIni = avg(iniIGP), mediaFim = avg(fimIGP);
      ctx += `=== TENDÊNCIA GERAL ===\n`;
      ctx += `IGP: início=${mediaIni??'—'} (${classifyIGP(mediaIni)}) → atual=${mediaFim??'—'} (${classifyIGP(mediaFim)}) | ${tendStr(mediaIni,mediaFim)}\n`;
      ctx += `INM: ${tendStr(avg(inmVals.slice(0,3)), avg(inmVals.slice(-3)))} | IA: ${tendStr(avg(iaVals.slice(0,3)), avg(iaVals.slice(-3)))}\n\n`;

      // ── Histórico semanal compacto ─────────────────────────────────────
      ctx += `=== SEMANAL (semana | IGP | INM-índice[0-100] | IA | carga) ===\n`;
      semData.forEach(s => {
        ctx += `${fmtDate(s.sem)}: IGP=${s.igp??'—'}(${classifyIGP(s.igp)}) INM=${s.inm??'—'}(${classINM(s.inm)}) IA=${s.ia??'—'}(${classifyIGP(s.ia)}) carga=${s.carga}UA/${s.n}d\n`;
      });

      // ── Atendimentos de rotina ─────────────────────────────────────────
      const atendimentos = medical.filter(m => m.athleteId === athId && (m.dados?.tipoRegistro||'') === 'atendimento');
      if (atendimentos.length) {
        ctx += `\n=== ATENDIMENTOS (${atendimentos.length}) ===\n`;
        atendimentos.sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(m => {
          ctx += `${fmtDate(m.data||'—')}: ${m.dados?.tipoAtendimento||'—'} | ${m.dados?.queixa||m.dados?.descricao||'—'}\n`;
        });
      }

      // ── Seção específica por intent ────────────────────────────────────

      if (intent === 'atleta_inm') {
        ctx += `\n=== CMJ DETALHADO (todos os registros) ===\n`;
        ctx += `Nota: "salto" = altura em cm (dado bruto); "INM" = índice neuromuscular 0-100 calculado a partir do salto.\n`;
        const cmjHist = hist.filter(d => d.pre?.salto != null);
        if (!cmjHist.length) ctx += `Nenhum registro de salto encontrado no período.\n`;
        else cmjHist.forEach(d => {
          const inm = calcIGP(d.pre, d.hrv, d.neuro).INM;
          ctx += `${d.date}: salto=${d.pre.salto}cm → INM(índice)=${inm??'—'} (${classINM(inm)})\n`;
        });
      }

      if (intent === 'atleta_carga') {
        ctx += `\n=== CARGA DETALHADA (dias com registro) ===\n`;
        const cargaHist = hist.filter(d => (d.post?.carga??0) > 0 || (d.post?.tempo??0) > 0);
        if (!cargaHist.length) ctx += `Nenhum registro de carga pós-treino encontrado.\n`;
        else cargaHist.forEach(d => {
          const igp = calcIGP(d.pre, d.hrv, d.neuro).global;
          ctx += `${d.date}: carga=${d.post?.carga??0}UA tempo=${d.post?.tempo??0}min qual=${d.post?.qualidade??'—'} IGP=${igp??'—'}(${classifyIGP(igp)})\n`;
        });
      }

      if (intent === 'atleta_lesoes') {
        const lesoes = medical.filter(m => m.athleteId === athId && (m.dados?.tipoRegistro||'') !== 'atendimento');
        ctx += `\n=== LESÕES (${lesoes.length} registros) ===\n`;
        if (!lesoes.length) { ctx += `Nenhuma lesão registrada.\n`; }
        else lesoes.sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(m => {
          const d = m.dados||{};
          ctx += `\n${fmtDate(m.data||'—')} | ${d.tipoLesao||'—'} | Região: ${d.regiao||'—'} | ${d.diasAfastado?d.diasAfastado+'d afastado':'afastamento ?'} | Quando: ${d.quandoOcorreu||'—'}\n`;
          ctx += `  Obs: ${d.observacao||d.queixa||d.descricao||'—'}\n`;
          if (d.tipoLesao==='Muscular') ctx += `  ⚠ MUSCULAR: analisar INM, carga acumulada e recuperação pré-lesão.\n`;
          const pre7 = hist.filter(r => r.date < (m.data||'zz')).slice(-5);
          if (pre7.length) {
            ctx += `  Pré-lesão (${pre7.length}d): `;
            ctx += pre7.map(r => {
              const g = calcIGP(r.pre, r.hrv, r.neuro);
              const cmj = r.pre?.salto!=null?` CMJ=${r.pre.salto}cm`:'';
              return `${r.date} IGP=${g.global??'—'} INM=${g.INM??'—'}${cmj}`;
            }).join(' | ') + '\n';
          }
        });
        ctx += `\nINSTRUÇÃO: Não compare as lesões entre si. Finalize com sugestões práticas para prevenir recorrência.\n`;
      }

      if (intent === 'atleta_jogos') {
        ctx += `\n=== JOGOS ===\n`;
        let jogosAtleta = 0;
        partidas.forEach(p => {
          const seg = getSegJogados(p, athId);
          if (seg == null) return;
          const min = Math.round(seg/60);
          jogosAtleta++;
          const dmPre = hist.filter(d=>d.date<=p.data).slice(-1)[0]||null;
          const dmPos = hist.filter(d=>d.date>p.data).slice(0,1)[0]||null;
          const iPre  = dmPre ? calcIGP(dmPre.pre,dmPre.hrv,dmPre.neuro).global : null;
          const iPos  = dmPos ? calcIGP(dmPos.pre,dmPos.hrv,dmPos.neuro).global : null;
          ctx += `${fmtDate(p.data)} x ${p.adversario||'—'}: ${min}min | IGP pré=${iPre??'—'}(${classifyIGP(iPre)}) IGP pós=${iPos??'—'}(${classifyIGP(iPos)})\n`;
        });
        if (!jogosAtleta) ctx += `Atleta sem jogos registrados nas últimas ${partidas.length} partidas carregadas.\n`;
      }

      if (intent === 'atleta_evolucao') {
        const lesoes = medical.filter(m => m.athleteId === athId && (m.dados?.tipoRegistro||'') !== 'atendimento');
        if (lesoes.length) {
          ctx += `\n=== LESÕES NO PERÍODO (resumo) ===\n`;
          lesoes.sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach(m => {
            ctx += `${fmtDate(m.data||'—')}: ${m.dados?.tipoLesao||'—'} ${m.dados?.regiao||''} — ${m.dados?.status||'—'}\n`;
          });
        }
        const jogosResumo = partidas.filter(p => getSegJogados(p, athId) != null);
        if (jogosResumo.length) {
          const totalMin = jogosResumo.reduce((s,p)=>s+Math.round(getSegJogados(p,athId)/60),0);
          ctx += `\n=== JOGOS: ${jogosResumo.length} partidas | ${totalMin} min totais | média ${Math.round(totalMin/jogosResumo.length)} min/jogo ===\n`;
          jogosResumo.forEach(p => {
            const min = Math.round(getSegJogados(p,athId)/60);
            ctx += `  ${fmtDate(p.data)} x ${p.adversario||'—'}: ${min}min\n`;
          });
        } else {
          ctx += `\n=== JOGOS: sem minutagem registrada nas últimas ${partidas.length} partidas ===\n`;
        }
      }
    }
  }

  if (intent === 'free') {
    // Para perguntas livres, carrega resumo geral
    const r = await getResumoDia(today);
    dados.push(`getResumoDia(${today})`);
    ctx += `=== CONTEXTO GERAL (${fmtDate(today)}) ===\n`;
    ctx += `Total de atletas: ${r.total} | Com coleta: ${r.comColeta} | No médico: ${r.medico}\n`;
    ctx += `Distribuição: Estável=${r.dist.estavel} | Atenção Leve=${r.dist.atencaoLeve} | Atenção=${r.dist.atencao} | Crítico=${r.dist.critico}\n`;
  }

  // ─── RECUPERACAO_JOGO (Quintino) ─────────────────────────────
  if (intent === 'recuperacao_jogo') {
    const partidas = await loadScoutMatches(1);
    const r = await getResumoDia(today);
    dados.push('loadScoutMatches(1)', `getResumoDia(${today})`);
    if (partidas.length) {
      const p = partidas[0];
      ctx += `\n=== RECUPERAÇÃO PÓS-JOGO (${fmtDate(p.data || '—')}) ===\n`;
      ctx += `Adversário: ${p.adversario || '—'} | Resultado: ${p.resultado || '—'}\n\n`;
      const jogouMaisDE60 = [], jogouMenosDE60 = [], semMinutagem = [];
      r.atletas.forEach(a => {
        const ps = p.playedSeconds?.[a.id];
        const seconds = ps ? (typeof ps === 'object' ? (ps.seconds ?? 0) : (typeof ps === 'number' ? ps : 0)) : 0;
        const min = seconds > 0 ? Math.round(seconds / 60) : 0;
        if (min > 60) jogouMaisDE60.push({ ...a, min });
        else if (min > 0) jogouMenosDE60.push({ ...a, min });
        else semMinutagem.push(a);
      });
      ctx += `GRUPO A — Jogaram >60 min (necessitam recuperação):\n`;
      if (jogouMaisDE60.length) {
        jogouMaisDE60.forEach(a => ctx += `• ${a.nome} (${a.posicao}) | ${a.min} min | IGP: ${a.igp ?? 'sem coleta'} — ${a.status}\n`);
      } else { ctx += `Nenhum atleta com >60 min registrados.\n`; }
      ctx += `\nGRUPO B — Jogaram <60 min (substitutos/reservas — podem receber carga):\n`;
      if (jogouMenosDE60.length) {
        jogouMenosDE60.forEach(a => ctx += `• ${a.nome} (${a.posicao}) | ${a.min} min | IGP: ${a.igp ?? 'sem coleta'} — ${a.status}\n`);
      } else { ctx += `Nenhum atleta nesta faixa.\n`; }
      ctx += `\nNão entraram / sem minutagem: ${semMinutagem.map(a => a.nome).join(', ') || 'nenhum'}\n`;
    } else {
      ctx += `\n=== RECUPERAÇÃO PÓS-JOGO ===\nNenhuma partida recente encontrada.\n`;
      r.atletas.forEach(a => { ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp ?? 'sem coleta'} — ${a.status}\n`; });
    }
  }

  // ─── VOLUME_SETOR_JOGO (Quintino) ────────────────────────────
  if (intent === 'volume_setor_jogo') {
    const partidas = await loadScoutMatches(1);
    dados.push('loadScoutMatches(1)');
    if (partidas.length) {
      const p = partidas[0];
      const events = await loadMatchEventsFull(p);
      ctx += `\n=== VOLUME POR SETOR E TEMPO DE JOGO (${fmtDate(p.data || '—')}) ===\n`;
      ctx += `Adversário: ${p.adversario || '—'} | Resultado: ${p.resultado || '—'}\n\n`;

      // Minutagem — lê playedSeconds diretamente com cap em duracaoSegundos
      const durSec = p.duracaoSegundos || 0;
      const athMap = Object.fromEntries((_athletesAll || []).map(a => [a.id, a]));
      const minutagem = [];
      if (p.playedSeconds) {
        Object.entries(p.playedSeconds).forEach(([id, val]) => {
          const raw = typeof val === 'object' ? (val.seconds ?? 0) : (typeof val === 'number' ? val : 0);
          const secs = durSec > 0 ? Math.min(raw, durSec) : raw;
          if (secs <= 0) return;
          const nomeSnap = typeof val === 'object' ? (val.athleteName || null) : null;
          const athLocal = athMap[id];
          const nome = nomeSnap || athLocal?.nome || id;
          const posicao = athLocal?.posicao || p.perfSnapshot?.[id]?.posicao || '—';
          minutagem.push({ nome, posicao, min: Math.round(secs / 60) });
        });
      }
      minutagem.sort((a, b) => b.min - a.min);

      ctx += `MINUTAGEM NO JOGO:\n`;
      if (minutagem.length) {
        minutagem.forEach(a => ctx += `• ${a.nome} (${a.posicao}): ${a.min} min\n`);
      } else {
        ctx += `Sem minutagem registrada para este jogo.\n`;
      }

      // Volume de ações por atleta (eventos)
      if (events.length) {
        ctx += `\nVOLUME DE AÇÕES POR ATLETA:\n`;
        const acoesPorAtleta = {};
        events.forEach(ev => {
          const id = ev.athleteId || ev.athleteName || 'desconhecido';
          if (!acoesPorAtleta[id]) acoesPorAtleta[id] = { nome: ev.athleteName || id, total: 0, acoes: {} };
          acoesPorAtleta[id].total++;
          acoesPorAtleta[id].acoes[ev.action] = (acoesPorAtleta[id].acoes[ev.action] || 0) + 1;
        });
        Object.values(acoesPorAtleta)
          .sort((a, b) => b.total - a.total)
          .slice(0, 15)
          .forEach(a => {
            const top3 = Object.entries(a.acoes).sort((x, y) => y[1] - x[1]).slice(0, 3).map(([k, v]) => `${k}:${v}`).join(', ');
            ctx += `• ${a.nome} | ${a.total} ações | Principais: ${top3}\n`;
          });
      } else {
        ctx += `\nEventos de jogo não disponíveis para análise de ações.\n`;
      }
      _chartData = { type: 'match', events, duracaoSegundos: p.duracaoSegundos || 0, posseSetor: p.possePorSetor || null, minutagem, adversario: p.adversario, placarPro: p.placar?.pro ?? 0, placarContra: p.placar?.contra ?? 0 };
    } else {
      ctx += `\n=== VOLUME POR SETOR ===\nNenhuma partida recente encontrada.\n`;
    }
  }

  // ─── PRESCRICAO_SESSAO / PRESCRICAO_SSG / MODULACAO_INDIVIDUAL (Telê) ───
  if (intent === 'prescricao_sessao' || intent === 'prescricao_ssg' || intent === 'modulacao_individual') {
    const r = await getResumoDia(today);
    const adapt = await getAdaptacaoCarga(7);
    const partidas = await loadScoutMatches(1);
    dados.push(`getResumoDia(${today})`, 'getAdaptacaoCarga(7 dias)', 'loadScoutMatches(1)');
    // Capacidade coletiva
    const com = r.atletas.filter(a => a.igp != null);
    const alta = com.filter(a => a.igp >= 70).length;
    const emAtencao = com.filter(a => a.igp < 60).length;
    const capacidade = emAtencao > com.length * 0.4 ? 'Reduzida' : alta > com.length * 0.6 ? 'Alta' : 'Moderada';
    ctx += `=== CONTEXTO PARA PRESCRIÇÃO (${fmtDate(today)}) ===\n`;
    ctx += `Capacidade Coletiva: ${capacidade}\n`;
    ctx += `Total: ${r.total} atletas | Com coleta: ${r.comColeta} | Estável: ${r.dist.estavel} | Atenção Leve: ${r.dist.atencaoLeve} | Atenção: ${r.dist.atencao} | Crítico: ${r.dist.critico}\n`;
    ctx += `Disponíveis para SSG (IGP ≥70): ${alta} atletas\n\n`;
    // Microciclo — usa a mesma lógica do dashboard (manual > planejamento > scout_partidas)
    const mc = await obterDiaMicrocicloParaIA();
    const mcLabel = mc?.label || '—';
    const mcObj   = mc?.objetivo || '';
    const mcDet   = mc?.detalhe  || '';
    ctx += `Dia do microciclo: ${mcLabel}${mcObj ? ' — ' + mcObj : ''}${mcDet ? ' (' + mcDet + ')' : ''}\n`;
    // Calcula dots de velocidade/COD usando a mesma lógica do dashboard (briefing_engine.js)
    // Isso garante que o card do Analista IA mostra os mesmos dots que o Briefing Pré-Treino
    const _ENVELOPE_VELCOD = {
      'MD+1':{'veloc':'Baixa','cod':'Baixa'},'MD+2':{'veloc':'Baixa','cod':'Baixa'},
      'MD+3':{'veloc':'Moderada','cod':'Moderada'},'MD-4':{'veloc':'Moderada','cod':'Moderada'},
      'MD-3':{'veloc':'Alta','cod':'Alta'},'MD-2':{'veloc':'Moderada','cod':'Moderada'},
      'MD-1':{'veloc':'Baixa','cod':'Baixa'},'MD0':{'veloc':'Alta','cod':'Alta'},
      'D1':{'veloc':'Moderada','cod':'Moderada'},'D2':{'veloc':'Moderada','cod':'Moderada'},
      'D3':{'veloc':'Alta','cod':'Alta'},'D4':{'veloc':'Moderada','cod':'Moderada'},
      'D5':{'veloc':'Baixa','cod':'Baixa'},'D6':{'veloc':'Moderada','cod':'Moderada'},
    };
    const _calcDots = (nivel, cap) => nivel==='Alta' ? 5 : nivel==='Moderada' ? (cap==='Alta' ? 4 : 3) : (cap==='Reduzida' ? 1 : 2);
    const _evc = _ENVELOPE_VELCOD[mcLabel] || { veloc: 'Moderada', cod: 'Moderada' };
    const _velDots = _calcDots(_evc.veloc, capacidade);
    const _codDots = _calcDots(_evc.cod, capacidade);
    ctx += `VELOCIDADE E COD CALCULADOS (use EXATAMENTE estes valores no bloco ##PRESCRICAO##, não recalcule):\n`;
    ctx += `velocidade: ${_velDots} | cod: ${_codDots} (base do envelope: veloc=${_evc.veloc} / cod=${_evc.cod} | capacidade coletiva: ${capacidade})\n\n`;
    // Estrutura de sessão derivada do session_engine (7 princípios de jogo)
    const _sessao = gerarSessao(mcLabel, capacidade);
    if (_sessao) {
      ctx += `=== ESTRUTURA DE SESSÃO — ${mcLabel} (capacidade ${capacidade}) ===\n`;
      ctx += `Justificativa: ${_sessao.justificativa}\n`;
      ctx += `Duração estimada: ${_sessao.duracao_total_est} min\n`;
      ctx += `Assinatura fisiológica: neuromuscular=${_sessao.assinatura.inm} | metabólico=${_sessao.assinatura.ia} | cognitivo=${_sessao.assinatura.ic} | mecânico=${_sessao.assinatura.mecanico}\n`;
      ctx += `Eixos em atenção (motor): ${_sessao.eixos_motor_em_atencao.join(', ') || 'nenhum'}\n`;
      ctx += `Blocos (GRUPO RECUPERAÇÃO — titulares >60 min):\n`;
      _sessao.blocos.forEach(b => {
        ctx += `  [${b.nome}] ${b.principio_nome} | ${b.intensidade} | ${b.duracao_fmt} | PSE ${b.pse_ref[0]}–${b.pse_ref[1]}\n`;
        ctx += `    Descrição: ${b.descricao}\n`;
        ctx += `    Exercícios de referência: ${b.exercicios.slice(0, 5).join(', ')}\n`;
        ctx += `    Objetivos táticos: ${b.objetivos.join(', ')}\n`;
      });
      if (_sessao.blocos_estimulo) {
        ctx += `\nBlocos (GRUPO ESTÍMULO — não jogou ou jogou <60 min):\n`;
        ctx += `Justificativa: ${_sessao.justificativa_estimulo}\n`;
        _sessao.blocos_estimulo.forEach(b => {
          ctx += `  [${b.nome}] ${b.principio_nome} | ${b.intensidade} | ${b.duracao_fmt} | PSE ${b.pse_ref[0]}–${b.pse_ref[1]}\n`;
          ctx += `    Descrição: ${b.descricao}\n`;
          ctx += `    Exercícios de referência: ${b.exercicios.slice(0, 5).join(', ')}\n`;
          ctx += `    Objetivos táticos: ${b.objetivos.join(', ')}\n`;
        });
      }
      const _sugestao = gerarSugestaoExercicios(_sessao);
      if (_sugestao.alta.length || _sugestao.moderadaBaixa.length) {
        ctx += `=== SUGESTÃO DE EXERCÍCIOS POR ZONA DE INTENSIDADE ===\n`;
        ctx += `(Use estes exercícios ao prescrever os blocos — escolha 1 por princípio)\n`;
        if (_sugestao.alta.length) {
          ctx += `Alta intensidade:\n`;
          _sugestao.alta.forEach(p => {
            ctx += `  [${p.nome}] ${p.exercicios.join(' | ')}\n`;
          });
        }
        if (_sugestao.moderadaBaixa.length) {
          ctx += `Moderada/Baixa intensidade:\n`;
          _sugestao.moderadaBaixa.forEach(p => {
            ctx += `  [${p.nome}] ${p.exercicios.join(' | ')}\n`;
          });
        }
        ctx += '\n';
      }
    }
    // Diferenciação pós-jogo para MD+1/MD+2
    const isPosJogo = mcLabel === 'MD+1' || mcLabel === 'MD+2';
    if (isPosJogo && partidas.length) {
      const p = partidas[0];
      ctx += `\nÚltimo jogo: ${fmtDate(p.data)} vs ${p.adversario || '—'}\nDIFERENCIAÇÃO POR MINUTAGEM (${mcLabel}):\n`;
      r.atletas.forEach(a => {
        const ps = p.playedSeconds?.[a.id];
        const seconds = ps ? (typeof ps === 'object' ? (ps.seconds ?? 0) : (typeof ps === 'number' ? ps : 0)) : 0;
        const min = seconds > 0 ? Math.round(seconds / 60) : 0;
        const grupo = min > 60 ? 'RECUPERAÇÃO (>60min)' : min > 0 ? 'CARGA MODERADA/ESTÍMULO (<60min)' : 'NÃO ENTROU';
        ctx += `• ${a.nome} (${a.posicao}) | ${min > 0 ? min + ' min' : 'sem minutagem'} → ${grupo} | IGP: ${a.igp ?? '—'}\n`;
      });
      ctx += '\n';
    }
    ctx += `ATLETAS COM AJUSTE INDIVIDUAL (IGP < 70):\n`;
    const comAjuste = r.atletas.filter(a => a.igp != null && a.igp < 70);
    if (comAjuste.length) {
      comAjuste.forEach(a => {
        ctx += `• ${a.nome} (${a.posicao}) | IGP: ${a.igp} (${a.status})`;
        if (a.dor?.length) ctx += ` | Dor: ${a.dor.join(', ')}`;
        ctx += '\n';
      });
    } else { ctx += `Nenhum atleta abaixo de 70.\n`; }
    ctx += `\nACWR / CARGA — ÚLTIMOS 7 DIAS:\n`;
    const comAcwr = adapt.filter(a => !a.semDados && a.acwr != null);
    if (comAcwr.length) {
      comAcwr.forEach(a => ctx += `• ${a.nome} | ACWR: ${a.acwr} | Carga 7d: ${a.cargaTotal} UA | Tendência: ${a.tendencia}\n`);
    } else { ctx += `Dados de ACWR não disponíveis.\n`; }
  }

  // ── Motor de recomendações (modulacao_individual) ─────────────────────────────
  if (intent === 'modulacao_individual') {
    const [motorMap, resumoHoje] = await Promise.all([
      loadMotorRecomendacoes(today),
      getResumoDia(today),
    ]);
    dados.push('loadMotorRecomendacoes(hoje)', `getResumoDia(${today})`);

    const EIXO_LABEL  = { volume: 'Volume', intensidade: 'Intensidade', densidade: 'Densidade', carga_mecanica: 'Carga Mecânica' };
    const DOSE_TEXTO  = { manter: 'Livre', leve: 'Restrição Leve', moderado: 'Restrição Média', forte: 'Restrição Forte' };
    const EIXOS_ORDER = ['carga_mecanica', 'volume', 'intensidade', 'densidade'];
    const igpMap = {};
    resumoHoje.atletas.forEach(a => { igpMap[a.id] = a; });

    ctx += `=== MODULAÇÃO INDIVIDUAL (${fmtDate(today)}) ===\n`;
    ctx += `Apenas atletas com dados de hoje. Se o atleta não tem dados hoje, não aparece.\n\n`;

    const comRestricao = [];
    const treino_normal = [];

    // Só processa atletas que têm motor data gerado HOJE
    Object.values(motorMap).forEach(mot => {
      const igpAtl = igpMap[mot.id];
      const eixos = mot.eixos || {};
      const restritos = EIXOS_ORDER.filter(e => eixos[e]?.dose_final && eixos[e].dose_final !== 'manter');

      if (mot.encaminhamento) {
        comRestricao.push({ ...mot, restritos, igpAtl, encaminhar: true });
      } else if (restritos.length) {
        comRestricao.push({ ...mot, restritos, igpAtl, encaminhar: false });
      } else {
        treino_normal.push(mot.nome);
      }
    });

    if (comRestricao.length) {
      ctx += `ATLETAS QUE PRECISAM MODULAR:\n`;
      comRestricao.forEach(m => {
        const igp = m.igpAtl?.igp ?? '—';
        const status = m.igpAtl?.status ?? '';
        ctx += `• ${m.nome} (${m.posicao}) — IGP ${igp}${status ? ' ' + status : ''}\n`;
        if (m.encaminhar) { ctx += `  → ENCAMINHAR AO DEPARTAMENTO MÉDICO\n`; }
        m.restritos.forEach(e => {
          ctx += `  ${EIXO_LABEL[e]}: ${DOSE_TEXTO[m.eixos?.[e]?.dose_final] || m.eixos?.[e]?.dose_final || '—'}`;
          if (m.eixos?.[e]?.justificativa) ctx += ` — ${m.eixos[e].justificativa}`;
          ctx += '\n';
        });
        if (m.restricoes?.length) ctx += `  Obs: ${m.restricoes[0]}\n`;
        if (m.igpAtl?.dor?.length) ctx += `  Dor: ${m.igpAtl.dor.join(', ')}\n`;
      });
    } else {
      ctx += `Nenhum atleta requer modulação hoje — todos em treino normal.\n`;
    }
    if (treino_normal.length) {
      ctx += `\nTREINO NORMAL (sem restrição): ${treino_normal.join(', ')}\n`;
    }
  }

  // ── Motor de recomendações (resumo_dia / atletas_atencao) ────────────────────
  if (['resumo_dia', 'atletas_atencao'].includes(intent)) {
    try {
      const motorMap = await loadMotorRecomendacoes(today);
      dados.push('loadMotorRecomendacoes(hoje)');
      const EIXO_LABEL  = { volume: 'Volume', intensidade: 'Intensidade', densidade: 'Densidade', carga_mecanica: 'Carga Mecânica' };
      const DOSE_TEXTO  = { manter: 'Livre', leve: 'Restrição Leve', moderado: 'Restrição Média', forte: 'Restrição Forte' };
      const EIXOS_ORDER = ['carga_mecanica', 'volume', 'intensidade', 'densidade'];
      const comRestricao = Object.values(motorMap).filter(mot => {
        const eixos = mot.eixos || {};
        return mot.encaminhamento || EIXOS_ORDER.some(e => eixos[e]?.dose_final && eixos[e].dose_final !== 'manter');
      });
      if (comRestricao.length) {
        const DOSE_PESO = { forte: 3, moderado: 2, leve: 1, manter: 0 };
        const pesoAtleta = m => {
          if (m.encaminhamento) return 99;
          const eixos = m.eixos || {};
          return EIXOS_ORDER.reduce((acc, e) => acc + (DOSE_PESO[eixos[e]?.dose_final] || 0), 0);
        };
        comRestricao.sort((a, b) => pesoAtleta(b) - pesoAtleta(a));

        ctx += `\n=== MODULAÇÕES DE TREINO (Motor de Recomendações) ===\n`;
        ctx += `| Atleta | Volume | Intensidade | Densidade | Carga Mecânica |\n`;
        ctx += `|--------|--------|-------------|-----------|----------------|\n`;
        comRestricao.forEach(m => {
          const eixos = m.eixos || {};
          if (m.encaminhamento) {
            ctx += `| **${m.nome} (${m.posicao})** | ⚕ Encaminhar Dept. Médico | — | — | — |\n`;
          } else {
            const cel = e => {
              const d = eixos[e]?.dose_final;
              return d && d !== 'manter' ? DOSE_TEXTO[d] || d : '—';
            };
            ctx += `| ${m.nome} (${m.posicao}) | ${cel('volume')} | ${cel('intensidade')} | ${cel('densidade')} | ${cel('carga_mecanica')} |\n`;
          }
        });
      }
    } catch(e) {
      ctx += `\n[Motor de recomendações indisponível para hoje — dados não encontrados]\n`;
    }
  }

  // Contexto extra para briefings compostos
  if (_briefingExtra === 'adaptacao_carga') {
    const adapt = await getAdaptacaoCarga(7);
    dados.push('getAdaptacaoCarga(7 dias)');
    ctx += `\n=== ADAPTAÇÃO À CARGA — ÚLTIMOS 7 DIAS ===\n`;
    const problemas = adapt.filter(a => !a.semDados && (a.tendencia === 'Queda' || (a.acwr != null && a.acwr > 1.3)));
    const alertaISP = adapt.filter(a => a.alertaISPACWR);
    alertaISP.forEach(a => alertas.push(`⚠ RISCO SOBRECARGA (ISP+ACWR): ${a.nome} — ACWR ${a.acwr} + IGP em queda. Monitorar imediatamente.`));
    problemas.forEach(a => {
      ctx += `• ${a.nome} (${a.posicao}) | IGP hoje: ${a.igpHoje ?? '—'} (${a.statusHoje}) | ACWR: ${a.acwr ?? '—'} | Tendência: ${a.tendencia} | Carga 7d: ${a.cargaTotal} UA\n`;
      if (a.alertaISPACWR) ctx += `  ⚠ RISCO: ACWR elevado + queda de IGP\n`;
    });
    if (!problemas.length) ctx += `Nenhum atleta com sinal de má adaptação identificado.\n`;
  }

  if (_briefingExtra === 'recuperacao') {
    const r = await getResumoDia(today);
    const partidas = await loadScoutMatches(1);
    dados.push(`getResumoDia(${today})`, 'getScoutMatches(última partida)');
    const dataJogo = partidas[0]?.data || '—';
    ctx += `\n=== RECUPERAÇÃO PÓS-JOGO ===\n`;
    ctx += `Último jogo: ${fmtDate(dataJogo)} vs ${partidas[0]?.adversario||'—'}\n`;
    ctx += `Prontidão atual do elenco (${fmtDate(today)}):\n\n`;
    r.atletas.forEach(a => {
      ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp ?? 'sem coleta'} — ${a.status}`;
      if (a.dor?.length) ctx += ` | Dor: ${a.dor.join(', ')}`;
      ctx += '\n';
    });
  }

  if (_briefingExtra === 'queixas') {
    const q = await getQueixasMedicas(7);
    dados.push('getQueixasMedicas(7 dias)');
    ctx += `\n=== QUEIXAS DO ELENCO — ÚLTIMOS 7 DIAS ===\n`;
    ctx += `DORES RELATADAS (pré-coleta):\n`;
    q.queixas.forEach(a => { ctx += `• ${a.nome} | Regiões: ${a.regioes} | ${a.dias} dia(s)${a.recorrente ? ' — RECORRENTE ⚠' : ''}\n`; });
    if (!q.queixas.length) ctx += `Nenhuma queixa de dor registrada\n`;
    ctx += `\nATENDIMENTOS MÉDICOS:\n`;
    q.atendimentos.forEach(a => ctx += `• ${a.nome} (${fmtDate(a.data)}) | Queixa: ${a.queixa} | Conduta: ${a.conduta}\n`);
    if (!q.atendimentos.length) ctx += `Nenhum atendimento registrado\n`;
  }

  return { ctx: ctx.trim(), dados, alertas, chartData: _chartData };
}
let _chartData = null;

/* ═══════════════════════════════════════════════════
   ANTHROPIC API
═══════════════════════════════════════════════════ */
function getApiKey() { return localStorage.getItem('anthropic_api_key') || ''; }

let _currentAbort = null;

function showStopBar() {
  $('stopBar').classList.remove('hidden');
  $('stopBar').classList.add('flex');
}
function hideStopBar() {
  $('stopBar').classList.add('hidden');
  $('stopBar').classList.remove('flex');
}

$('btnStop').addEventListener('click', () => {
  if (_currentAbort) { _currentAbort.abort(); _currentAbort = null; }
});

async function callAnthropic(contextStr, question, maxTokens = 2000, systemPrompt = SYSTEM_PROMPT) {
  const key = getApiKey();
  if (!key) throw new Error('Chave Anthropic não configurada. Clique em ⚙ para configurar.');

  _currentAbort = new AbortController();

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    signal: _currentAbort.signal,
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: [{ role: 'user', content: `DADOS DO ELENCO:\n${contextStr}\n\nPERGUNTA: ${question}` }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    throw new Error(err?.error?.message || `Erro ${res.status} na API Anthropic`);
  }
  const data = await res.json();
  return data.content?.[0]?.text || 'Sem resposta.';
}

/* ═══════════════════════════════════════════════════
   USAGE CONTROL
═══════════════════════════════════════════════════ */
async function getUsage() {
  if (!clubId) return { perguntas_mes: 0, limite_mes: LIMITE_MES, perguntas_hoje: 0, limite_dia: LIMITE_DIA };
  try {
    const ref = doc(db, 'ai_usage', clubId);
    const snap = await getDoc(ref);
    if (!snap.exists()) return { perguntas_mes: 0, limite_mes: LIMITE_MES, perguntas_hoje: 0, limite_dia: LIMITE_DIA, reset_em: null };
    const d = snap.data();
    // Verifica reset mensal
    if (d.reset_em && new Date() > d.reset_em.toDate()) {
      await setDoc(ref, { perguntas_mes: 0, perguntas_hoje: 0, reset_em: null }, { merge: true });
      return { ...d, perguntas_mes: 0, perguntas_hoje: 0 };
    }
    // Verifica reset diário
    if (d.ultima_pergunta && d.ultima_pergunta !== todayISO()) {
      await setDoc(ref, { perguntas_hoje: 0 }, { merge: true });
      return { perguntas_mes: 0, limite_mes: LIMITE_MES, perguntas_hoje: 0, limite_dia: LIMITE_DIA, ...d, perguntas_hoje: 0 };
    }
    return { perguntas_mes: 0, limite_mes: LIMITE_MES, perguntas_hoje: 0, limite_dia: LIMITE_DIA, ...d };
  } catch { return { perguntas_mes: 0, limite_mes: LIMITE_MES, perguntas_hoje: 0, limite_dia: LIMITE_DIA }; }
}

async function incrementUsage() {
  if (!clubId) return;
  try {
    const ref = doc(db, 'ai_usage', clubId);
    const now = new Date();
    const resetEm = new Date(now.getFullYear(), now.getMonth()+1, 1);
    const u = await getUsage();
    await setDoc(ref, {
      perguntas_mes: (u.perguntas_mes || 0) + 1,
      perguntas_hoje: (u.perguntas_hoje || 0) + 1,
      limite_mes: LIMITE_MES,
      limite_dia: LIMITE_DIA,
      reset_em: resetEm,
      ultima_pergunta: todayISO()
    }, { merge: true });
  } catch(e) { console.warn('Erro ao incrementar uso:', e); }
}

async function updateBadge() {
  const u = await getUsage();
  const restantes = (u.limite_mes || LIMITE_MES) - (u.perguntas_mes || 0);
  const badge = $('badgeUso');
  badge.textContent = `${restantes} pergunta${restantes!==1?'s':''} restante${restantes!==1?'s':''}`;
  badge.className = `text-xs font-bold px-3 py-1 rounded-full border ${restantes > 20 ? 'bg-gray-100 text-gray-500 border-gray-200' : restantes > 5 ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-red-50 text-red-600 border-red-200'}`;
}

async function checkLimit() {
  const u = await getUsage();
  if ((u.perguntas_hoje || 0) >= (u.limite_dia || LIMITE_DIA)) {
    const reset = u.reset_em ? new Date(u.reset_em.toDate()).toLocaleDateString('pt-BR') : 'amanhã';
    throw new Error(`Limite diário atingido (${u.limite_dia} perguntas/dia). Tente novamente amanhã ou aguarde o reset em ${reset}.`);
  }
  if ((u.perguntas_mes || 0) >= (u.limite_mes || LIMITE_MES)) {
    throw new Error(`Limite mensal atingido (${u.limite_mes} perguntas/mês). O contador reseta no primeiro dia do próximo mês.`);
  }
}

   HISTORY
═══════════════════════════════════════════════════ */
async function saveHistory({ pergunta, resposta, intencao, dados, queryId }) {
  if (!clubId) return;
  try {
    await setDoc(doc(collection(db, 'ai_queries', clubId, 'historico'), queryId), {
      clubId, userId, pergunta, resposta, intencao,
      dadosUtilizados: dados,
      feedback: null,
      createdAt: serverTimestamp()
    });
  } catch(e) { console.warn('Erro ao salvar histórico:', e); }
}

async function saveFeedback(queryId, feedback) {
  try {
    await setDoc(doc(db, 'ai_queries', clubId, 'historico', queryId), { feedback }, { merge: true });
  } catch {}
}

async function loadHistory() {
  if (!clubId) return [];
  try {
    const snap = await getDocs(query(
      collection(db, 'ai_queries', clubId, 'historico'),
      orderBy('createdAt', 'desc'), limitFS(10)
    ));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) {
    // Fallback sem orderBy (evita erro de índice composto)
    try {
      const snap = await getDocs(collection(db, 'ai_queries', clubId, 'historico'));
      return snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0))
        .slice(0, 10);
    } catch { return []; }
  }
}

function igpColor(v) {
  return v >= 70 ? '#16a34a' : v >= 60 ? '#ca8a04' : v >= 50 ? '#ea580c' : '#dc2626';
}
function igpBarHtml(v) {
  const pct = Math.min(100, Math.max(0, v));
  const color = igpColor(pct);
  return `<span class="igp-bar-wrap"><span class="igp-val" style="color:${color};">${pct}</span><span class="igp-bar-track"><span class="igp-bar-fill" style="width:${pct}%;background:${color};"></span></span></span>`;
}
function statusPillHtml(label) {
  const map = {
    'estável':      'pill-estavel',
    'atenção leve': 'pill-atencao-leve',
    'atenção':      'pill-atencao',
    'crítico':      'pill-critico',
  };

function _buildIGPSummaryCard({ igpMedioHoje, dist, totalAtletas, date, hist28, porPosicao, atletasDor }) {
  if (!dist) return '';
  const { estavel = 0, atencaoLeve = 0, atencao = 0, critico = 0, semColeta = 0 } = dist;
  const comDados = estavel + atencaoLeve + atencao + critico;

  const igpColor = (v) => v == null ? '#94a3b8' : v >= 70 ? '#16a34a' : v >= 60 ? '#ca8a04' : v >= 50 ? '#ea580c' : '#dc2626';

  const squareCard = (label, n, color, bg) =>
    `<div style="flex:1;min-width:0;background:${bg};border:1.5px solid ${color}33;border-radius:8px;padding:6px 4px;text-align:center;">
       <div style="font-size:16px;font-weight:800;color:${color};line-height:1;">${n}</div>
       <div style="font-size:8px;font-weight:700;color:${color};text-transform:uppercase;letter-spacing:.04em;margin-top:2px;">${label}</div>
     </div>`;

  const dataFmt = (() => {
    if (!date) return '';
    const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const dt = new Date(date + 'T12:00:00');
    const [y, m, d] = date.split('-');
    return `${dias[dt.getDay()]} ${d}/${m}`;
  })();

  // IGP histórico 28d estimado a partir das médias de sistemas
  const _igpHist = (() => {
    if (!hist28) return null;
    const vals = [hist28.IH, hist28.IA, hist28.INM, hist28.IC].filter(v => v != null);
    if (!vals.length) return null;
    const media = vals.reduce((s,v)=>s+v,0)/vals.length;
    const pior  = Math.min(...vals);
    return Math.round(0.8 * media + 0.2 * pior);
  })();

  const igpHoje = igpMedioHoje;
  const igpHist = _igpHist;
  const igpDelta = igpHoje != null && igpHist != null ? igpHoje - igpHist : null;

  const igpBadge = igpHoje != null
    ? `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #f1f5f9;">
         <span style="font-size:26px;font-weight:900;color:${igpColor(igpHoje)};line-height:1;">${igpHoje}</span>
         <span style="font-size:11px;color:#94a3b8;font-weight:500;">/100</span>
         ${igpHist != null ? `<span style="font-size:11px;color:#64748b;">· hist. <b>${igpHist}</b></span>` : ''}
         ${igpDelta != null ? `<span style="font-size:11px;font-weight:700;color:${igpDelta >= 0 ? '#16a34a' : '#dc2626'};">${igpDelta >= 0 ? '↑' : '↓'} ${Math.abs(igpDelta)}</span>` : ''}
         <span style="font-size:10px;color:#94a3b8;margin-left:auto;">IGP médio</span>
       </div>`
    : '';

  const igpLabel = (v) => v == null ? '' : v >= 70 ? 'Estável' : v >= 60 ? 'Atenção Leve' : v >= 50 ? 'Atenção' : 'Crítico';

  // Por posição — linhas horizontais com barras segmentadas (mesmo padrão das métricas)
  const _sysColor = (val, isNM) => {
    if (val == null) return '#cbd5e1';
    if (isNM) return val >= 60 ? '#16a34a' : val >= 50 ? '#ca8a04' : val >= 40 ? '#ea580c' : '#dc2626';
    return val >= 70 ? '#16a34a' : val >= 60 ? '#ca8a04' : val >= 50 ? '#ea580c' : '#dc2626';
  };
  const _segBar = (val, isNM = false) => {
    if (val == null) return '<span style="color:#94a3b8;font-size:10px;">—</span>';
    const c = _sysColor(val, isNM);
    const filled = Math.round(Math.min(10, Math.max(0, val / 10)));
    return Array.from({ length: 10 }, (_, i) =>
      `<span style="display:inline-block;width:5px;height:10px;border-radius:1px;background:${i < filled ? c : '#e2e8f0'};margin:0 1px;"></span>`
    ).join('');
  };
  const _sysRow = (lbl, val, isNM = false) => {
    if (val == null) return '';
    const c = _sysColor(val, isNM);

  const posRow = (nome, dados) => {
    if (!dados || dados.n === 0) return '';

    const color = igpColor(igp);
    const label = igpLabel(igp);
    const _fmtRefDate = (dateStr) => {
      if (!dateStr) return '';
      const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

      const [, m, d] = dateStr.split('-');
      return `${dias[dt.getDay()]} ${d}/${m}`;
    };
    const _refSegBar = (val) => {
      const filled = Math.round(Math.min(10, Math.max(0, val / 10)));

        `<span style="display:inline-block;width:5px;height:8px;border-radius:1px;background:${i < filled ? '#cbd5e1' : '#f1f5f9'};margin:0 1px;"></span>`
      ).join('');
    };
    // Always renders: colored if today, gray+date if ref, "Sem dados" if neither
    const _row = (lbl, todayVal, refVal, refDate, isNM = false) => {
      if (todayVal != null) return _sysRow(lbl, todayVal, isNM);
      if (refVal != null) {
        const dateLbl = _fmtRefDate(refDate);

        <span style="flex:1;color:#cbd5e1;font-size:10px;min-width:0;">${lbl}</span>
        <span style="font-size:10px;color:#d1d5db;font-style:italic;">Sem dados coletados</span>
      </div>`;
    };
    const sistemas = [
      _row('Subjetivo (IH)',      IH,  ref?.IH,  ref?.dateIH,  false),
      _row('Autonômico (IA)',     IA,  ref?.IA,  ref?.dateIA,  false),
      _row('Neuromuscular (INM)', INM, ref?.INM, ref?.dateINM, true),
      _row('Cognitivo (IC)',      IC,  ref?.IC,  ref?.dateIC,  false),
    ].join('');
    return `<div style="padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid #f1f5f9;">
        <span style="font-size:12px;font-weight:800;color:#0f172a;">${nome}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:9px;color:#94a3b8;">${n} atletas</span>
          ${label ? `<span style="font-size:9px;font-weight:700;color:${color};background:${color}18;border-radius:99px;padding:2px 8px;">${label}</span>` : ''}
          <span style="font-size:20px;font-weight:900;color:${color};line-height:1;">${igp ?? '—'}</span>
        </div>
      </div>
      ${sistemas}
    </div>`;
  };

  // Grid de posições: sem Goleiro
  const _POSICOES_GRID = [
    ['Zagueiro', 'Lateral'],               // linha 1 — 2 cards
    ['Volante', 'Meia'],                   // linha 2 — 2 cards
    ['Ponta', 'Centro-avante'],            // linha 3 — 2 cards
  ];

  const posColsHtml = porPosicao
    ? (() => {
        const linhas = _POSICOES_GRID.map(linha => {
          const cards = linha.map(p => posRow(p, porPosicao[p])).filter(Boolean);
          if (!cards.length) return '';
          const cols = cards.length === 3 ? '1fr 1fr 1fr' : '1fr 1fr';
          return `<div style="display:grid;grid-template-columns:${cols};gap:8px;margin-bottom:8px;">${cards.join('')}</div>`;
        }).filter(Boolean);
        return linhas.join('');
      })()
    : '';

  return `<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-family:system-ui,sans-serif;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <span style="font-size:12px;font-weight:800;color:#0f172a;">Prontidão do Elenco</span>
      <span style="font-size:11px;color:#64748b;">${dataFmt}${comDados ? ' · ' + comDados + ' atletas' : ''}</span>
    </div>
    ${igpBadge}
    <div style="display:flex;gap:5px;margin-bottom:${posColsHtml ? '14px' : '0'};">
      ${squareCard('Estável',   estavel,      '#16a34a', '#f0fdf4')}
      ${squareCard('At. Leve',  atencaoLeve,  '#ca8a04', '#fffbeb')}
      ${squareCard('Atenção',   atencao,      '#ea580c', '#fff7ed')}
      ${squareCard('Crítico',   critico,      '#dc2626', '#fef2f2')}

    ${(() => {

function _buildMetricasGrupoCard(dados) {
  if (!dados) return '';
  const { ontem, semana, hist28, date, lastSessionDate } = dados;

  const fmtNum = (v, dec = 1) => v != null ? Number(v).toFixed(dec) : '—';

  const delta = (hj, hs) => {
    if (hj == null || hs == null) return '';
    const d = hj - hs;
    const cor = Math.abs(d) < 0.5 ? '#94a3b8' : d > 0 ? '#16a34a' : '#dc2626';
    const seta = Math.abs(d) < 0.5 ? '=' : d > 0 ? '↑' : '↓';
    return `<span style="color:${cor};font-weight:700;font-size:10px;">${seta}</span>`;
  };

  // Classificações inline
  const _pseLabel = (v) => {
    if (v == null) return '';
    const [txt, cor] = v <= 3 ? ['Leve','#16a34a'] : v <= 6 ? ['Moderada','#ca8a04'] : v <= 8 ? ['Alta','#ea580c'] : ['Máxima','#dc2626'];
    return `<span style="font-size:9px;font-weight:700;color:${cor};background:${cor}18;border-radius:4px;padding:1px 5px;">${txt}</span>`;
  };
  const _qualLabel = (v) => {
    if (v == null) return '';
    const [txt, cor] = v <= 2 ? ['Ruim','#dc2626'] : v <= 3 ? ['Regular','#ca8a04'] : ['Boa','#16a34a'];
    return `<span style="font-size:9px;font-weight:700;color:${cor};background:${cor}18;border-radius:4px;padding:1px 5px;">${txt}</span>`;
  };

  // Row compacta para os sub-cards de carga
  const cr = (label, val, hist, badgeFn, suffix = '', dec = 0) => {
    const badge = badgeFn ? badgeFn(typeof val === 'number' ? val : null) : '';
    const d = delta(val, hist);
    const valFmt = val != null ? `${fmtNum(val, dec)}${suffix}` : '—';
    const histFmt = hist != null ? `<span style="font-size:9px;color:#94a3b8;">${fmtNum(hist, dec)}${suffix}</span>` : '';
    return `<div style="display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid #f1f5f9;">
      <span style="flex:1;color:#64748b;font-size:10px;min-width:0;">${label}</span>
      <span style="font-weight:700;color:#0f172a;font-size:12px;">${valFmt}</span>
      ${badge}
      ${histFmt}
      ${d}
    </div>`;
  };

  // Label da última sessão coletiva
  const _ontemLabel = (() => {
    const refDate = lastSessionDate || date;
    if (!refDate) return 'Última Sessão';
    const d = new Date(refDate + 'T12:00:00');
    const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return `Última Sessão · ${dias[d.getDay()]} ${d.getDate()} ${meses[d.getMonth()]}`;
  })();

  const nSess = semana?.n_sessoes != null ? ` · ${semana.n_sessoes} sessões` : '';

  return `<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;margin-bottom:10px;font-family:system-ui,sans-serif;">
    <div style="font-size:11px;font-weight:800;color:#0f172a;margin-bottom:10px;">⚡ Carga</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;background:#fafafa;">
        <div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #e9edf2;">${_ontemLabel}</div>
        ${cr('PSE',       ontem.pse,      hist28.pse,      _pseLabel,  ' / 10', 1)}
        ${cr('Volume',    ontem.volume,   hist28.volume,   null,       ' min',  0)}
        ${cr('Carga',     ontem.carga != null ? Math.round(ontem.carga) : null, hist28.carga != null ? Math.round(hist28.carga) : null, null, ' UA', 0)}
        ${cr('Qualidade', ontem.qualidade, hist28.qualidade, _qualLabel, ' / 5', 1)}
      </div>
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;background:#fafafa;">
        <div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid #e9edf2;">Carga da Semana${nSess}</div>
        ${cr('PSE médio',     semana?.pse,      hist28.pse,      _pseLabel,  ' / 10', 1)}
        ${cr('Carga / sessão', semana?.carga != null ? Math.round(semana.carga) : null, hist28.carga != null ? Math.round(hist28.carga) : null, null, ' UA', 0)}
        ${cr('Volume / sessão', semana?.volume,  hist28.volume,   null,       ' min',  0)}
        ${cr('Qualidade',     semana?.qualidade, hist28.qualidade, _qualLabel, ' / 5', 1)}
      </div>
    </div>
  </div>`;
}
