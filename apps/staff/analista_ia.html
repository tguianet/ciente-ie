    }).join('');
    return _sec('📊 Carga Total Média — Últimas 8 Semanas (UA/atleta)', `
      <div style="display:flex;gap:3px;align-items:flex-end;">${bars}</div>
      <div style="font-size:9px;color:#94a3b8;margin-top:5px;text-align:center;">UA = carga total média por atleta · semana atual em azul</div>
    `);
  })();

  // 2. Carga por posição
  const posHtml = (() => {
    if (!porPosicao||!porPosicao.length) return '';
    const _row = (lbl, sem, hist, suffix='', dec=0) => {
      const sf = sem!=null?`${Number(sem).toFixed(dec)}${suffix}`:'—';
      const hf = hist!=null?`<span style="font-size:9px;color:#94a3b8;">${Number(hist).toFixed(dec)}${suffix}</span>`:'';
      return `<div style="display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:1px solid #f8fafc;">
        <span style="flex:1;color:#64748b;font-size:10px;">${lbl}</span>
        <span style="font-weight:700;color:#0f172a;font-size:11px;">${sf}</span>
        ${hf}${_delta(typeof sem==='number'?sem:null,typeof hist==='number'?hist:null)}
      </div>`;
    };
    const cards = porPosicao.map(g=>`
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;background:#fafafa;">
        <div style="font-size:10px;font-weight:700;color:#0f172a;margin-bottom:5px;padding-bottom:4px;border-bottom:1px solid #e9edf2;display:flex;justify-content:space-between;">
          <span>${g.label} <span style="font-weight:400;color:#94a3b8;">(${g.n})</span></span>
          <span style="font-size:9px;color:#94a3b8;">sem | hist28d</span>
        </div>
        ${_row('Carga/sessão',g.sem.carga,g.hist.carga,' UA')}
        ${_row('PSE médio',g.sem.pse,g.hist.pse,'/10',1)}
        ${_row('Volume',g.sem.vol,g.hist.vol,' min')}
        ${_row('Qualidade',g.sem.qual,g.hist.qual,'/5',1)}
      </div>`).join('');
    return _sec('⚡ Carga por Grupo — Semana vs Histórico 28d', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">${cards}</div>`);
  })();

  // 3. ISP
  const ispHtml = (() => {
    const _aRow = (a, showAlerta=false) => `<div style="padding:3px 0;border-bottom:1px solid #f8fafc;display:flex;align-items:center;gap:4px;">
      <span style="flex:1;font-size:10px;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${a.nome}</span>
      ${a.igp!=null?`<span style="font-size:9px;color:#94a3b8;">${a.igp}</span>`:''}
      ${showAlerta&&a.alerta?'<span style="color:#dc2626;font-size:10px;" title="ACWR > 1.3">⚠</span>':''}
    </div>`;
    const cols = [
      { title:'Melhorando', cor:'#16a34a', bg:'#f0fdf4', icon:'↑', list:isp.melhorando, alerta:false },
      { title:'Estável',    cor:'#2563eb', bg:'#eff6ff', icon:'=', list:isp.estavel,    alerta:false },
      { title:'Piorando',   cor:'#dc2626', bg:'#fef2f2', icon:'↓', list:isp.piorando,   alerta:true  },
    ];
    const colsHtml = cols.map(c=>`
      <div style="border:1px solid ${c.cor}40;border-radius:8px;padding:8px 10px;background:${c.bg};">
        <div style="font-size:10px;font-weight:800;color:${c.cor};margin-bottom:5px;">${c.icon} ${c.title} <span style="background:${c.cor};color:#fff;border-radius:99px;padding:0 5px;font-size:9px;">${c.list.length}</span></div>
        ${c.list.length?c.list.map(a=>_aRow(a,c.alerta)).join(''):'<div style="font-size:10px;color:#94a3b8;font-style:italic;">Nenhum</div>'}
      </div>`).join('');
    const insufHtml = isp.insuf?`<div style="font-size:9px;color:#94a3b8;margin-top:6px;">+ ${isp.insuf} sem dados suficientes para tendência</div>`:'';
    return _sec('📈 ISP — Índice Semanal de Adaptação', `
      <div style="font-size:10px;color:#374151;margin-bottom:8px;background:#f0f9ff;border-radius:6px;padding:7px 9px;border-left:3px solid #2563eb;line-height:1.4;">
        Compara a <strong>média do IGP das últimas 3 coletas</strong> com as <strong>4 anteriores</strong> — indica se o atleta está se adaptando <span style="color:#16a34a;">↑</span>, tolerando <span style="color:#2563eb;">=</span> ou sobrecarregando <span style="color:#dc2626;">↓</span> com a carga da semana.
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">${colsHtml}</div>${insufHtml}
    `);
  })();

  // 4. Sinalização de fadiga
  const fadigaHtml = (() => {
    const nRes = fadiga.residual.length, nPer = fadiga.persistente.length;
    if (!nRes&&!nPer) return _sec('🟢 Sinalização de Fadiga', `<div style="font-size:11px;color:#16a34a;font-weight:600;">Nenhuma sinalização de fadiga identificada.</div>`);
    const _aRow = (a) => `<div style="padding:3px 0;border-bottom:1px solid #f8fafc;font-size:10px;">
      <span style="font-weight:600;color:#0f172a;">${a.nome}</span>
      <span style="color:#94a3b8;font-size:9px;"> ${a.igp!=null?`· IGP ${a.igp}`:''} ${a.acwr!=null?`· ACWR ${a.acwr}`:''}</span>
    </div>`;
    return _sec('⚠️ Sinalização de Fadiga', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div style="border:1px solid #fbbf2450;border-radius:8px;padding:10px 12px;background:#fffbeb;">
        <div style="font-size:10px;font-weight:800;color:#d97706;margin-bottom:4px;">⚠ Fadiga Residual <span style="background:#d97706;color:#fff;border-radius:99px;padding:0 5px;font-size:9px;">${nRes}</span></div>
        <div style="font-size:9px;color:#92400e;margin-bottom:5px;">ISP piorando, carga dentro do limite aceitável. Monitorar.</div>
        ${nRes?fadiga.residual.map(_aRow).join(''):'<div style="font-size:10px;color:#94a3b8;font-style:italic;">Nenhum</div>'}
      </div>
      <div style="border:1px solid #fca5a550;border-radius:8px;padding:10px 12px;background:#fef2f2;">
        <div style="font-size:10px;font-weight:800;color:#dc2626;margin-bottom:4px;">🚨 Fadiga Persistente <span style="background:#dc2626;color:#fff;border-radius:99px;padding:0 5px;font-size:9px;">${nPer}</span></div>
        <div style="font-size:9px;color:#991b1b;margin-bottom:5px;">ACWR > 1.3 + IGP em queda. Reduzir carga imediatamente.</div>
        ${nPer?fadiga.persistente.map(_aRow).join(''):'<div style="font-size:10px;color:#94a3b8;font-style:italic;">Nenhum</div>'}
      </div>
    </div>`);
  })();

  // 5. Microciclo
  const microHtml = (() => {
    if (!microciclo||!microciclo.length) return '';
    const _cargaColor = (c,h) => {
      if (!c||!h) return '#0f172a';
      const r = c/h;
      return r>1.15?'#dc2626':r>1.05?'#f97316':r<0.85?'#16a34a':'#0f172a';
    };
    const rows = microciclo.map(s=>`
      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #f1f5f9;">
        <div style="min-width:46px;">
          <div style="font-size:11px;font-weight:800;color:#1e40af;">${s.mdLabel}</div>
          <div style="font-size:9px;color:#94a3b8;">${s.dateLabel}</div>
        </div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;">
          <div>
            <div style="font-size:9px;color:#64748b;">Carga</div>
            <div style="font-size:12px;font-weight:700;color:${_cargaColor(s.carga,s.histCarga)};">${s.carga??'—'}</div>
            ${s.histCarga?`<div style="font-size:9px;color:#94a3b8;">${s.histCarga}</div>`:'<div style="font-size:9px;color:#e2e8f0;">—</div>'}
          </div>
          <div>
            <div style="font-size:9px;color:#64748b;">PSE</div>
            <div style="font-size:12px;font-weight:700;color:#0f172a;">${s.pse!=null?s.pse.toFixed(1):'—'}</div>
          </div>
          <div>
            <div style="font-size:9px;color:#64748b;">Volume</div>
            <div style="font-size:12px;font-weight:700;color:#0f172a;">${s.vol!=null?`${s.vol}min`:'—'}</div>
          </div>
          <div>
            <div style="font-size:9px;color:#64748b;">Qual.</div>
            <div style="font-size:12px;font-weight:700;color:#0f172a;">${s.qual!=null?s.qual.toFixed(1):'—'}</div>
          </div>
        </div>
        <div style="font-size:9px;color:#cbd5e1;min-width:14px;text-align:right;">${s.n}</div>
      </div>`).join('');
    const header = `<div style="display:flex;align-items:center;gap:8px;padding:0 10px;margin-bottom:3px;">
      <div style="min-width:46px;"></div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:9px;color:#94a3b8;">
        <div>Carga UA<br><span style="font-size:8px;">hist28d</span></div><div>PSE</div><div>Volume</div><div>Qual.</div>
      </div>
    </div>`;
    return _sec('📅 Carga por Dia do Microciclo', header+rows);
  })();

  return chartHtml + posHtml + ispHtml + fadigaHtml + microHtml;
}

function _buildPrescricaoCard(block) {
  const get = (key) => { const m = block.match(new RegExp(`^${key}:\\s*(.+)$`, 'm')); return m ? m[1].trim() : ''; };
  const getAll = (key) => { const re = new RegExp(`^${key}:\\s*(.+)$`, 'gm'); const r = []; let m; while ((m = re.exec(block)) !== null) r.push(m[1].trim()); return r; };

  const dia        = get('dia');
  const fase       = get('fase');
  const capacidade = get('capacidade');
  const duracao    = get('duracao');
  const carga      = get('carga');
  const altaMin    = get('alta_min');
  const modMin     = get('mod_min');
  const vel        = parseInt(get('velocidade')) || 0;
  const cod        = parseInt(get('cod')) || 0;
  const aquec      = get('aquecimento');
  const resfr      = get('resfriamento');
  const bAlta      = get('blocos_alta');
  const bMod       = get('blocos_mod');
  const exAlta     = [get('exercicio_alta_1'), get('exercicio_alta_2')].filter(Boolean);
  const exMod      = [get('exercicio_mod_1'),  get('exercicio_mod_2')].filter(Boolean);
  const posicoes   = get('posicoes').split(',').map(p => p.trim()).filter(Boolean);
  const individuais = getAll('individual');

  const capColor = capacidade === 'Alta' ? '#16a34a' : capacidade === 'Reduzida' ? '#dc2626' : '#ca8a04';
  const capBg    = capacidade === 'Alta' ? '#f0fdf4' : capacidade === 'Reduzida' ? '#fef2f2' : '#fffbeb';
  const capPct   = capacidade === 'Alta' ? '100%'   : capacidade === 'Moderada' ? '80%'    : '60%';

  const dots = (n) => Array.from({length:5}, (_,i) =>
    `<span style="width:11px;height:11px;border-radius:50%;background:${i<n?'#1e40af':'#e2e8f0'};display:inline-block;"></span>`
  ).join('');

  const metricCard = (label, val) =>
    `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;">
       <div style="font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">${label}</div>
       <div style="font-size:15px;font-weight:700;color:#0f172a;">${val||'—'}</div>
     </div>`;

  const dotsCard = (label, n) =>
    `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;">
       <div style="font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">${label}</div>
       <div style="display:flex;gap:3px;">${dots(n)}</div>
     </div>`;

  const blocosCard = (titulo, cor, bg, texto, exercs) => {
    if (!texto) return '';
    const [qtd, ratio] = texto.split('|').map(s => s.trim());
    return `<div style="background:${bg};border:1px solid ${cor}44;border-radius:8px;padding:12px 14px;margin-bottom:8px;">
      <div style="font-size:10px;font-weight:700;color:${cor};text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">${titulo}</div>
      <div style="font-size:14px;font-weight:600;color:#1e293b;">${qtd||''}</div>
      ${ratio?`<div style="font-size:12px;color:#64748b;margin-top:2px;">${ratio}</div>`:''}
      ${exercs.map(e=>`<div style="font-size:12px;color:#374151;margin-top:6px;padding-top:6px;border-top:1px solid ${cor}22;">→ ${e}</div>`).join('')}
    </div>`;
  };

  const posHtml = posicoes.length
    ? `<div style="margin-top:14px;">
        <div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Posições em Atenção</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${posicoes.map(p=>`<span style="background:#dbeafe;color:#1e40af;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;">${p}</span>`).join('')}
        </div>
       </div>` : '';

  const indHtml = individuais.length
    ? `<div style="margin-top:14px;">
        <div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Ajuste Individual (${individuais.length})</div>
        ${individuais.map(ind => {
          const p = ind.split('—').map(s=>s.trim());
          const sc = p[1]==='Crítico'?'#dc2626':p[1]==='Atenção'?'#ea580c':'#ca8a04';
          return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f8fafc;border-radius:6px;margin-bottom:4px;">
            <div style="flex:1;font-size:13px;font-weight:600;color:#0f172a;">${p[0]||''}</div>
            <span style="font-size:11px;font-weight:700;color:${sc};white-space:nowrap;">${p[1]||''}</span>
            ${p.slice(2).join(' — ')?`<div style="font-size:12px;color:#64748b;">${p.slice(2).join(' — ')}</div>`:''}
          </div>`;
        }).join('')}
       </div>` : '';

  // Grupo B (estímulo pós-jogo — <60 min / não jogaram)
  const gBDuracao  = get('grupoB_duracao');
  const gBCarga    = get('grupoB_carga');
  const gBAltaMin  = get('grupoB_alta_min');
  const gBModMin   = get('grupoB_mod_min');
  const gBBAlta    = get('grupoB_blocos_alta');
  const gBBMod     = get('grupoB_blocos_mod');
  const gBExAlta   = [get('grupoB_exercicio_alta_1'), get('grupoB_exercicio_alta_2')].filter(Boolean);
  const gBExMod    = [get('grupoB_exercicio_mod_1'),  get('grupoB_exercicio_mod_2')].filter(Boolean);
  const hasGrupoB  = !!(gBDuracao || gBCarga || gBAltaMin);

  const grupoBCard = hasGrupoB ? `
    <div style="margin-top:16px;padding-top:16px;border-top:2px dashed #e2e8f0;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="background:#7c3aed;color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:99px;">GRUPO B — Estímulo</span>
        <span style="font-size:11px;color:#64748b;">Substitutos / não jogaram (&lt;60 min)</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
        ${metricCard('Duração Total', gBDuracao)}
        ${metricCard('Carga Interna', gBCarga ? gBCarga.replace(/\s*UA\s*$/i,'').trim()+' UA' : '')}
        ${metricCard('Minutos Alta Intensidade', gBAltaMin||'—')}
        ${metricCard('Minutos Mod / Baixa', gBModMin)}
        ${dotsCard('Exposição à Velocidade', vel)}
        ${dotsCard('Mudanças de Direção', cod)}
      </div>
      ${blocosCard('Blocos Alta Intensidade','#7c3aed','#f5f3ff', gBBAlta, gBExAlta)}
      ${blocosCard('Blocos Moderada / Baixa','#2563eb','#eff6ff', gBBMod, gBExMod)}
    </div>` : '';

  return `<div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;background:#fff;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
      <div>
        <div style="font-size:16px;font-weight:800;color:#0f172a;">Prescrição de Sessão</div>
        ${fase?`<div style="font-size:12px;color:#64748b;margin-top:2px;">${fase}</div>`:''}
      </div>
      ${dia?`<span style="background:#1e40af;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;flex-shrink:0;margin-left:12px;">${dia}</span>`:''}
    </div>

    <div style="background:${capBg};border:1px solid ${capColor}44;border-radius:8px;padding:8px 12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:12px;color:#374151;font-weight:500;">Capacidade coletiva do elenco</span>
      <span style="font-size:13px;font-weight:700;color:${capColor};">${capacidade} (${capPct} do envelope)</span>
    </div>

    ${hasGrupoB?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <span style="background:#1e40af;color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:99px;">GRUPO A — Recuperação</span>
      <span style="font-size:11px;color:#64748b;">Jogaram &gt;60 min</span>
    </div>`:''}
    <div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Prescrição da Sessão</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
      ${metricCard('Duração Total', duracao)}
      ${metricCard('Carga Interna', carga ? carga.replace(/\s*UA\s*$/i,'').trim()+' UA' : '')}
      ${metricCard('Minutos Intensidade Alta', altaMin||'—')}
      ${metricCard('Minutos Intensidade Moderada / Baixa', modMin)}
      ${dotsCard('Exposição à Velocidade', vel)}
      ${dotsCard('Mudanças de Direção', cod)}
    </div>

    <div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Sugestão de Blocos e Pausas</div>
    ${blocosCard('Blocos Alta Intensidade','#ea580c','#fff7ed', bAlta, exAlta)}
    ${blocosCard('Blocos Moderada / Baixa','#2563eb','#eff6ff', bMod,  exMod)}
    ${(aquec||resfr)?`<div style="font-size:11px;color:#64748b;margin-top:6px;">Aquecimento ~${aquec}${resfr?' · resfriamento ~'+resfr:''}</div>`:''}
    ${grupoBCard}
    ${posHtml}
    ${indHtml}
  </div>`;
}

function _buildModulacaoCard(block) {
  const get     = (key) => { const m = block.match(new RegExp(`^${key}:\\s*(.+)$`, 'm')); return m ? m[1].trim() : ''; };
  const getAll  = (key) => { const re = new RegExp(`^${key}:\\s*(.+)$`, 'gm'); const r = []; let m; while ((m = re.exec(block)) !== null) r.push(m[1].trim()); return r; };

  const dia          = get('dia');
  const capacidade   = get('capacidade');
  const modulares    = getAll('modular');
  const treino_raw   = get('treino_normal');
  const treino_list  = treino_raw === 'todos' ? [] : treino_raw.split(',').map(s => s.trim()).filter(Boolean);
  const todos_normal = treino_raw === 'todos';

  const _ajusteColor = (txt) => {
    if (/encaminhar/i.test(txt)) return '#dc2626';
    if (/fora da alta/i.test(txt)) return '#ea580c';
    if (/−\d+%|reduzid/i.test(txt)) return '#ca8a04';
    return '#374151';
  };

  const modulaHtml = modulares.length
    ? modulares.map(line => {
        const parts = line.split('→').map(s => s.trim());
        const nomePos = parts[0] || '';
        const ajuste  = parts[1] || '';
        const color   = _ajusteColor(ajuste);
        const isDM    = /encaminhar/i.test(ajuste);
        return `<div style="display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:${isDM?'#fef2f2':'#fff7ed'};border:1px solid ${isDM?'#fca5a5':'#fed7aa'};border-radius:8px;margin-bottom:6px;">
          <div style="flex:1;">
            <div style="font-size:13px;font-weight:700;color:#0f172a;">${nomePos}</div>
            <div style="font-size:12px;color:${color};font-weight:600;margin-top:2px;">→ ${ajuste}</div>
          </div>
          ${isDM?`<span style="font-size:10px;font-weight:800;color:#dc2626;background:#fee2e2;padding:2px 8px;border-radius:99px;white-space:nowrap;">DM</span>`:''}
        </div>`;
      }).join('')
    : '';

  const normalHtml = todos_normal
    ? `<div style="padding:8px 12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;font-size:13px;color:#15803d;font-weight:600;">Todos em treino normal</div>`
    : treino_list.length
      ? `<div style="padding:8px 12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;">
           <div style="font-size:10px;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Treino Normal</div>
           <div style="font-size:12px;color:#374151;">${treino_list.join(' · ')}</div>
         </div>`
      : '';

  const capColor = capacidade === 'Alta' ? '#16a34a' : capacidade === 'Reduzida' ? '#dc2626' : '#ca8a04';
  const capBg    = capacidade === 'Alta' ? '#f0fdf4' : capacidade === 'Reduzida' ? '#fef2f2' : '#fffbeb';

  return `<div style="border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px;background:#fff;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div style="font-size:16px;font-weight:800;color:#0f172a;">Modulação Individual</div>
      ${dia?`<span style="background:#1e40af;color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;">${dia}</span>`:''}
    </div>
    ${capacidade?`<div style="background:${capBg};border:1px solid ${capColor}44;border-radius:8px;padding:7px 12px;margin-bottom:12px;font-size:12px;font-weight:600;color:${capColor};">Capacidade coletiva: ${capacidade}</div>`:''}
    ${modulares.length?`<div style="font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Atletas com ajuste (${modulares.length})</div>${modulaHtml}`:''}
    ${normalHtml}
  </div>`;
}

function _buildDistribChart(str) {
  const g = (k) => { const m = str.match(new RegExp(`${k}=(\\d+)`)); return m ? parseInt(m[1]) : 0; };
  const est = g('estaveis'), al = g('atencao_leve'), at = g('atencao'), cr = g('critico');
  const total = est + al + at + cr;
  if (!total) return '';
  const pct = (n) => Math.round((n / total) * 100);
  const seg = (n, color, label) => n
    ? `<div title="${label}: ${n}" style="flex:${n};background:${color};height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;min-width:${n/total>0.08?'auto':'0px'};overflow:hidden;">${n/total>0.1?n:''}</div>`
    : '';
  return `<div style="margin:6px 0 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;">
    <div style="font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Distribuição do Elenco (${total} atletas)</div>
    <div style="display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;">
      ${seg(est,'#16a34a','Estável')}${seg(al,'#ca8a04','Atenção Leve')}${seg(at,'#ea580c','Atenção')}${seg(cr,'#dc2626','Crítico')}
    </div>
    <div style="display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;">
      ${est?`<span style="font-size:11px;color:#16a34a;font-weight:600;">● Estável: ${est} (${pct(est)}%)</span>`:``}
      ${al?`<span style="font-size:11px;color:#ca8a04;font-weight:600;">● At. Leve: ${al} (${pct(al)}%)</span>`:``}
      ${at?`<span style="font-size:11px;color:#ea580c;font-weight:600;">● Atenção: ${at} (${pct(at)}%)</span>`:``}
      ${cr?`<span style="font-size:11px;color:#dc2626;font-weight:600;">● Crítico: ${cr} (${pct(cr)}%)</span>`:``}
    </div>
  </div>`;
}

function classificaPSE(v) {
  if (v == null) return '';
  const map = { 1:'Muito leve', 2:'Leve', 3:'Moderada', 4:'Moderada',
    5:'Um pouco intensa', 6:'Intensa', 7:'Muito intensa', 8:'Muito intensa',
    9:'Submáxima', 10:'Máxima' };
  return map[Math.round(v)] || '';
}
function classificaCarga(v) {
  if (v == null) return '';
  if (v < 300)  return 'Regenerativa';
  if (v <= 599) return 'Moderada';
  if (v <= 799) return 'Alta';
  return 'Muito alta';
}

function renderMarkdown(text) {
  // Modulação individual (Telê) — card de ajuste por atleta
  if (text.includes('##MODULACAO##') && text.includes('##FIM##')) {
    const pStart = text.indexOf('##MODULACAO##');
    const pEnd   = text.indexOf('##FIM##');
    const before = text.slice(0, pStart).trim();
    const after  = text.slice(pEnd + 7).trim();
    const block  = text.slice(pStart + 13, pEnd);
    return (before ? renderMarkdown(before) + '<div style="height:10px;"></div>' : '') +
           _buildModulacaoCard(block) +
           (after  ? '<div style="height:10px;"></div>' + renderMarkdown(after) : '');
  }

  // Prescrição de sessão (Telê) — detecta bloco estruturado e renderiza como card
  if (text.includes('##PRESCRICAO##') && text.includes('##FIM##')) {
    const pStart = text.indexOf('##PRESCRICAO##');
    const pEnd   = text.indexOf('##FIM##');
    const block  = text.slice(pStart + 14, pEnd);
    // Descarta texto antes/depois — o card já contém tudo
    return _buildPrescricaoCard(block);
  }
  // 1. Tabelas markdown: blocos de linhas que começam com |
  text = text.replace(/((?:\|.+\|\n?)+)/g, match => {
    const rows = match.trim().split('\n');
    const separatorIdx = rows.findIndex(r => /^\|[\s\-:|]+\|/.test(r));
    let html = '<table class="resp-table">';
    rows.forEach((row, i) => {
      if (i === separatorIdx) return; // pula linha separadora
      const cells = row.split('|').slice(1, -1).map(c => c.trim());
      if (!cells.length) return;
      const isHead = separatorIdx > 0 && i < separatorIdx;
      const tag = isHead ? 'th' : 'td';
      const renderCell = (c, isHeader) => {
        if (isHeader) return `<th>${renderInline(c)}</th>`;
        const _DOSE_STYLE = {
          'Restrição Forte':  'background:#fee2e2;color:#991b1b;font-weight:700;',
          'Restrição Média':  'background:#ffedd5;color:#9a3412;font-weight:600;',
          'Restrição Leve':   'background:#fef9c3;color:#854d0e;font-weight:500;',
          '⚕ Encaminhar Dept. Médico': 'background:#ede9fe;color:#5b21b6;font-weight:700;',
        };
        const style = Object.entries(_DOSE_STYLE).find(([k]) => c.includes(k));
        return style
          ? `<td style="${style[1]}">${renderInline(c)}</td>`
          : `<td>${renderInline(c)}</td>`;
      };
      html += `<tr>${cells.map((c, ci) => renderCell(c, isHead)).join('')}</tr>`;
    });
    html += '</table>';
    return html;
  });

  // 2a. Linhas que são APENAS **texto** → section header colorido
  const _SEC = {
    'prontos para jogar':                   { c:'#16a34a', bg:'#f0fdf4' },
    'com restrição':                         { c:'#ca8a04', bg:'#fffbeb' },
    'fora':                                  { c:'#dc2626', bg:'#fef2f2' },
    'abaixo de 70':                          { c:'#ea580c', bg:'#fff7ed' },
    'dor relatada':                          { c:'#7c3aed', bg:'#f5f3ff' },
    'média do grupo hoje':                   { c:'#0891b2', bg:'#ecfeff' },
    'por posição':                           { c:'#374151', bg:'#f9fafb' },
    'tendência de queda':                    { c:'#dc2626', bg:'#fef2f2' },
    'pse acima da mediana':                  { c:'#ea580c', bg:'#fff7ed' },
    'em resumo':                             { c:'#1d4ed8', bg:'#eff6ff' },
    'hoje':                                  { c:'#374151', bg:'#f9fafb' },
    'semana':                                { c:'#374151', bg:'#f9fafb' },
    'atletas com ajuste':                    { c:'#ea580c', bg:'#fff7ed' },
    'treino normal':                         { c:'#16a34a', bg:'#f0fdf4' },
    'carga do elenco':                       { c:'#0891b2', bg:'#ecfeff' },
  };
  text = text.replace(/^\*\*([^*\n]+)\*\*\s*$/gm, (_, title) => {
    const key = Object.keys(_SEC).find(k => title.toLowerCase().startsWith(k));
    const s = _SEC[key] || { c:'#1e3a5f', bg:'#f8fafc' };
    return `<div style="font-size:10px;font-weight:800;color:${s.c};text-transform:uppercase;letter-spacing:.06em;margin:14px 0 5px;padding:5px 10px;background:${s.bg};border-left:3px solid ${s.c};border-radius:0 6px 6px 0;">${title}</div>`;
  });

  // 2b. Cabeçalhos markdown normais
  text = text.replace(/^### (.+)$/gm, '<h4>$1</h4>');
  text = text.replace(/^## (.+)$/gm,  '<h3>$1</h3>');
  text = text.replace(/^# (.+)$/gm,   '<h2>$1</h2>');

  // 3. Listas (• ou - ou *)
  text = text.replace(/^[•\-\*] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);

  // 4. Bold/italic inline
  text = renderInline(text);

  // 5. Parágrafos: quebra dupla → parágrafo separado; simples → <br>
  text = text.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
  text = `<p>${text}</p>`;

  // limpa parágrafos vazios
  text = text.replace(/<p>\s*<\/p>/g, '');

  // 6. Visuais: IGP numérico → mini barra colorida
  // Detecta padrões: "IGP 74", "IGP: 74", "IGP médio: 74", "IGP médio 74"
  text = text.replace(/\bIGP(?:\s+médio)?[:\s]+(\d{1,3})\b/g, (_, n) => {
    const v = parseInt(n);
    if (v < 0 || v > 100) return _;
    return `IGP ${igpBarHtml(v)}`;
  });

  // 7. Visuais: palavras de status → pills coloridas
  // Detecta após "— " ou "→ " ou no início de contexto de status
  text = text.replace(/\b(Estável|Atenção Leve|Atenção|Crítico)\b/g, (match) => statusPillHtml(match));

  // Mini gráfico de distribuição inline — feito DEPOIS das pills para não quebrar o HTML gerado
  const _safeHtmlBlocks = [];
  text = text.replace(/##DISTRIB##([^#]*)##FIM##/g, (_, data) => {
    const html = _buildDistribChart(data);
    _safeHtmlBlocks.push(html);
    return `\x00DISTRIB_${_safeHtmlBlocks.length - 1}\x00`;
  });
  // Parágrafos e quebras não devem quebrar placeholders — restaurar após
  _safeHtmlBlocks.forEach((html, i) => {
    text = text.replace(`\x00DISTRIB_${i}\x00`, html);
  });

  return text;
}

function renderInline(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function renderSparklineChart({ nome, semData }) {
  if (!semData?.length) return;
  const W = 480, H = 90, PAD = 8, BOTTOM = 20;
  const series = [
    { key: 'igp',  label: 'IGP',  color: '#1d4ed8' },
    { key: 'inm',  label: 'INM',  color: '#059669' },
    { key: 'ia',   label: 'IA',   color: '#7c3aed' },
  ];
  const n = semData.length;
  const xPos = i => PAD + (i/(n-1||1)) * (W - PAD*2);
  const scale = (v, min, max) => v==null ? null : BOTTOM + (H - BOTTOM - PAD) - ((v-min)/(max-min||1)) * (H - BOTTOM - PAD);

  let svgLines = '';
  series.forEach(s => {
    const vals = semData.map(d => d[s.key]);
    const nonNull = vals.filter(v=>v!=null);
    if (!nonNull.length) return;
    const min = Math.max(0, Math.min(...nonNull) - 5);
    const max = Math.min(100, Math.max(...nonNull) + 5);
    const pts = vals.map((v,i) => v!=null ? `${xPos(i).toFixed(1)},${scale(v,min,max).toFixed(1)}` : null);
    // polyline segments (skip nulls)
    let seg = '', inSeg = false;
    pts.forEach((p,i) => {
      if (p) { seg += inSeg ? ` L${p}` : `M${p}`; inSeg = true; }
      else inSeg = false;
    });
    svgLines += `<path d="${seg}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    // dots
    pts.forEach((p,i) => { if(p) svgLines += `<circle cx="${xPos(i).toFixed(1)}" cy="${scale(vals[i],min,max).toFixed(1)}" r="3" fill="${s.color}"/>`; });
    // last value label
    const lastIdx = vals.map((v,i)=>v!=null?i:-1).filter(i=>i>=0).pop();
    if (lastIdx!=null) svgLines += `<text x="${(xPos(lastIdx)+5).toFixed(1)}" y="${(scale(vals[lastIdx],min,max)+4).toFixed(1)}" font-size="9" fill="${s.color}" font-weight="bold">${s.label} ${vals[lastIdx]}</text>`;
  });
  // x-axis labels (every ~4 weeks)
  let xLabels = '';
  semData.forEach((s,i) => {
    if (i===0||i===n-1||(n>6&&i%4===0)) {
      const d = s.sem.split('-'); xLabels += `<text x="${xPos(i).toFixed(1)}" y="${H-2}" font-size="8" fill="#94a3b8" text-anchor="middle">${d[2]}/${d[1]}</text>`;
    }
  });
  // threshold line 70
  const yStable = PAD + (H - BOTTOM - PAD) - ((70-0)/(100-0)) * (H - BOTTOM - PAD);
  svgLines += `<line x1="${PAD}" y1="${yStable.toFixed(1)}" x2="${W-PAD}" y2="${yStable.toFixed(1)}" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>`;
  svgLines += `<text x="${PAD+2}" y="${(yStable-2).toFixed(1)}" font-size="8" fill="#d1d5db">70</text>`;

  const legend = series.map(s=>`<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:10px;color:${s.color};font-weight:600;"><svg width="12" height="4"><line x1="0" y1="2" x2="12" y2="2" stroke="${s.color}" stroke-width="2"/></svg>${s.label}</span>`).join('');

  const el = document.createElement('div');
  el.className = 'msg-ai flex gap-3';
  el.innerHTML = `
    <div class="w-7 h-7 rounded-lg bg-blue-600 flex items-center justify-center text-xs font-black text-white flex-shrink-0 mt-1">IA</div>
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 border border-gray-200 shadow-sm" style="max-width:${W+40}px;">
      <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:4px;">Evolução semanal — ${nome}</div>
      <svg width="${W}" height="${H}" style="display:block;">${svgLines}${xLabels}</svg>
      <div style="margin-top:4px;">${legend}<span style="font-size:10px;color:#94a3b8;margin-left:4px;">--- limiar estável (70)</span></div>
    </div>`;
  const _ca = getChatArea(); if (_ca) { _ca.appendChild(el); _ca.scrollTop = _ca.scrollHeight; }
}

/* ═══════════════════════════════════════════════════
   MATCH CHARTS — timeline + zone heatmaps (Quintino)
═══════════════════════════════════════════════════ */
function renderMatchCharts({ events, duracaoSegundos, posseSetor, minutagem, adversario, placarPro, placarContra, posseAm, posseAdv }) {
  if (!events || !events.length) return;

  const BINS = ['0–15','15–30','30–45','45–60','60–75','75+'];
  const binIdx = s => { const m=(s||0)/60; return m<15?0:m<30?1:m<45?2:m<60?3:m<75?4:5; };

  const isR   = e => e.action==='Roubada (pressão ofensiva)'||e.action==='Roubada (pós-perda)'||e.action==='Roubada (combate)';
  const isDG  = e => e.action==='Duelo ganho (alto)'||e.action==='Duelo ganho (chão)';
  const isDP  = e => e.action==='Duelo perdido (alto)'||e.action==='Duelo perdido (chão)';
  const isFA  = e => e.action==='Finalização';
  const isFAd = e => e.action==='Finalização adversária';
  const isGP  = e => e.action==='Gol Pró';
  const isGC  = e => e.action==='Gol Contra (adv)';

  const byBin = fn => BINS.map((_,i)=>events.filter(e=>fn(e)&&binIdx(e.seconds)===i).length);

  const dg   = byBin(isDG);
  const dp   = byBin(isDP);
  const rob  = byBin(isR);
  const fa   = byBin(isFA);
  const fadv = byBin(isFAd);
  const gp   = byBin(isGP);
  const gc   = byBin(isGC);

  const getSec = e => { const s=(e.sector||'').toLowerCase(); return s.includes('def')?'defesa':s.includes('ata')?'ataque':'meio'; };
  const byZone = fn => { const z={defesa:0,meio:0,ataque:0}; events.filter(fn).forEach(e=>z[getSec(e)]++); return z; };

  const zR   = byZone(isR);
  const zDG  = byZone(isDG);
  const zDP  = byZone(isDP);
  const zBD  = byZone(e=>e.action==='Boa decisão');
  const zErr = byZone(e=>e.action==='Erro NF'||e.action==='Erro pressão');
  const posseAmZona = posseSetor?.america || null;

  // ── Timeline bar chart ──────────────────────────────────────────
  const TW=265, TH=68, TPAD=16;
  function timelineChart(title, seriesArr, goalDots) {
    const maxV = Math.max(1,...seriesArr.flatMap(s=>s.values));
    const nSer = seriesArr.length;
    const slotW = (TW-TPAD*2)/BINS.length;
    const bw = (slotW*0.82)/nSer;
    let bars='', xlbls='';
    // Track top-of-bar Y positions for first series (for goal dots)
    const topY = [];
    seriesArr.forEach((s,si) => {
      s.values.forEach((v,i) => {
        const slotX = TPAD+i*slotW;
        const x = slotX+(slotW*0.09)+si*bw;
        const bh = Math.max(0,Math.round((v/maxV)*(TH-18)));
        const y = TH-12-bh;
        if(si===0) topY[i] = { x: x+bw/2, y };
        if(bh>0) bars+=`<rect x="${x.toFixed(1)}" y="${y}" width="${(bw-1).toFixed(1)}" height="${bh}" fill="${s.color}" rx="1"/>`;
        if(v>0) bars+=`<text x="${(x+bw/2-0.5).toFixed(1)}" y="${y-2}" font-size="7" fill="${s.color}" text-anchor="middle" font-weight="bold">${v}</text>`;
      });
    });
    // Goal indicators — circle on top of bar
    if (goalDots) {
      goalDots.forEach((g, i) => {
        if (g > 0 && topY[i]) {
          const cx = topY[i].x, cy = topY[i].y - 7;
          bars += `<circle cx="${cx.toFixed(1)}" cy="${cy}" r="4.5" fill="#111827" stroke="white" stroke-width="1"/>`;
          bars += `<text x="${cx.toFixed(1)}" y="${(cy+3).toFixed(1)}" font-size="6" fill="white" text-anchor="middle" font-weight="800">${g}</text>`;
        }
      });
    }
    BINS.forEach((b,i) => {
      const x = TPAD+i*slotW+slotW/2;
      xlbls+=`<text x="${x.toFixed(1)}" y="${TH-1}" font-size="7" fill="#9ca3af" text-anchor="middle">${b}</text>`;
    });
    const legend = seriesArr.map(s=>`<span style="display:inline-flex;align-items:center;gap:2px;font-size:9px;color:${s.color};font-weight:700;margin-right:6px;"><svg width="8" height="5"><rect x="0" y="1" width="8" height="3" fill="${s.color}" rx="1"/></svg>${s.label}</span>`).join('');
    const goalLegend = goalDots?.some(g=>g>0) ? `<span style="display:inline-flex;align-items:center;gap:3px;font-size:9px;color:#111827;font-weight:700;"><svg width="10" height="10"><circle cx="5" cy="5" r="4.5" fill="#111827"/><text x="5" y="8" font-size="5" fill="white" text-anchor="middle" font-weight="800">G</text></svg> Gol</span>` : '';
    return `<div style="margin-bottom:9px;"><div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:1px;">${title}</div><svg width="${TW}" height="${TH}" style="display:block;">${bars}${xlbls}</svg><div style="margin-top:1px;">${legend}${goalLegend}</div></div>`;
  }

  // ── Field zone heatmap (portrait / vertical) ───────────────────
  const FW=110, FH=168;
  function fieldZoneMap(title, zoneVals, accentColor, fmt) {
    // Campo retrato — cor única estilo clean, sem heatmap
    const zOrder=[{k:'ataque',l:'Ataque'},{k:'meio',l:'Meio'},{k:'defesa',l:'Defesa'}];
    const vals=zOrder.map(z=>zoneVals[z.k]||0);
    const bH=(FH-4)/3;
    // Campo: fundo cinza claro, linhas brancas, valores com a cor do acento
    const fieldBg='#d1d5db';   // cinza claro
    const lineBg='#9ca3af';    // linha divisória
    const textCol=accentColor||'#374151';
    let svg=`<svg width="${FW}" height="${FH}" style="display:block;">`;
    // Fundo campo
    svg+=`<rect x="1" y="1" width="${FW-2}" height="${FH-2}" fill="${fieldBg}" rx="4"/>`;
    // Gramado em chevron (linhas diagonais alternadas para textura sutil)
    for(let row=0;row<6;row++){
      const ry=2+row*(FH-4)/6;
      if(row%2===0) svg+=`<rect x="2" y="${ry.toFixed(1)}" width="${FW-4}" height="${((FH-4)/6).toFixed(1)}" fill="rgba(0,0,0,0.04)"/>`;
    }
    zOrder.forEach(({l},i)=>{
      const y=2+i*bH;
      if(i>0) svg+=`<line x1="8" y1="${y.toFixed(1)}" x2="${FW-8}" y2="${y.toFixed(1)}" stroke="${lineBg}" stroke-width="0.8" stroke-dasharray="3,2"/>`;
      const ly=y+bH/2;
      svg+=`<text x="${(FW/2).toFixed(1)}" y="${(ly-6).toFixed(1)}" font-size="7" fill="#6b7280" text-anchor="middle" font-weight="700">${l}</text>`;
      const disp = fmt?fmt(vals[i]):vals[i];
      svg+=`<text x="${(FW/2).toFixed(1)}" y="${(ly+10).toFixed(1)}" font-size="15" fill="${textCol}" text-anchor="middle" font-weight="800">${disp}</text>`;
    });
    // Contorno campo
    svg+=`<rect x="1" y="1" width="${FW-2}" height="${FH-2}" fill="none" rx="4" stroke="#9ca3af" stroke-width="1.2"/>`;
    // Gol superior e inferior
    const gaW=Math.round((FW-4)*0.38),gaX=Math.round((FW-gaW)/2);
    svg+=`<rect x="${gaX}" y="1" width="${gaW}" height="10" fill="white" stroke="#9ca3af" stroke-width="1"/>`;
    svg+=`<rect x="${gaX}" y="${FH-11}" width="${gaW}" height="10" fill="white" stroke="#9ca3af" stroke-width="1"/>`;
    // Linha do meio
    const cy=FH/2;
    svg+=`<line x1="8" y1="${cy}" x2="${FW-8}" y2="${cy}" stroke="#9ca3af" stroke-width="0.8"/>`;
    svg+=`<circle cx="${FW/2}" cy="${cy}" r="12" fill="none" stroke="#9ca3af" stroke-width="0.8"/>`;
    svg+=`</svg>`;
    return `<div style="text-align:center;flex-shrink:0;"><div style="font-size:9px;font-weight:700;color:#374151;margin-bottom:3px;white-space:nowrap;">${title}</div>${svg}</div>`;
  }

  // ── Minutagem table (4 colunas) ────────────────────────────────
  let minutagemTable = '';
  if (minutagem && minutagem.length) {
    // Divide os atletas em 4 colunas
    const cols = 4;
    const perCol = Math.ceil(minutagem.length / cols);
    const colArrays = Array.from({length: cols}, (_, c) => minutagem.slice(c * perCol, (c+1) * perCol));
    const cellStyle = 'border:1px solid #e5e7eb;border-radius:6px;overflow:hidden;flex:1;min-width:0;';
    const thStyle = 'padding:3px 7px;font-size:9px;font-weight:700;color:#374151;background:#f3f4f6;';
    const tables = colArrays.filter(col => col.length > 0).map(col => {
      const rows = col.map((a, i) => {
        const bg = i % 2 === 0 ? '#f9fafb' : '#ffffff';
        const bold = a.min >= 60 ? 'font-weight:700;' : '';
        return `<tr style="background:${bg};">
          <td style="padding:3px 7px;font-size:11px;${bold}color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px;">${a.nome}</td>
          <td style="padding:3px 7px;font-size:10px;color:#6b7280;white-space:nowrap;">${a.posicao}</td>
          <td style="padding:3px 7px;font-size:11px;${bold}color:#111827;text-align:right;white-space:nowrap;">${a.min}'</td>
        </tr>`;
      }).join('');
      return `<table style="border-collapse:collapse;width:100%;${cellStyle}">
        <thead><tr><th style="${thStyle}text-align:left;">Jogador</th><th style="${thStyle}text-align:left;">Pos.</th><th style="${thStyle}text-align:right;">Min.</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }).join('');
    minutagemTable = `
      <div>
        <div style="font-size:9px;font-weight:800;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Minutagem no jogo</div>
        <div style="display:flex;gap:8px;align-items:flex-start;">${tables}</div>
        <div style="font-size:9px;color:#9ca3af;margin-top:4px;">negrito = mais de 60 min</div>
      </div>`;
  }

  // ── Butterfly stats chart ──────────────────────────────────────
  const _advName = adversario || 'Adversário';
  const _posseAm  = posseAm  ?? 50;
  const _posseAdv = posseAdv ?? (100 - _posseAm);
  const _finPro  = events.filter(isFA).length;
  const _finAdv  = events.filter(isFAd).length;
  const _finNoGolPro  = events.filter(e => e.action === 'Finalização' && e.meta?.resultado === 'no_gol').length;
  const _finNoGolAdv  = events.filter(e => e.action === 'Finalização adversária' && e.meta?.resultado === 'no_gol').length;
  const _chancesClaras    = events.filter(e => e.action === 'Chance clara criada').length;
  const _chancesClarasAdv = events.filter(e => e.action === 'Chance clara adversário').length;
  const _escanteiosPro = events.filter(e => e.action === 'Bola Parada' && e.meta?.equipe === 'america' && e.meta?.tipo === 'escanteio').length;
  const _escanteiosAdv = events.filter(e => e.action === 'Bola Parada' && e.meta?.equipe === 'adv'     && e.meta?.tipo === 'escanteio').length;
  const _faltasCom  = events.filter(e => e.action === 'Falta' && e.meta?.tipo === 'cometida').length;
  const _faltasSof  = events.filter(e => e.action === 'Falta' && e.meta?.tipo === 'sofrida').length;
  const _golsPro = placarPro ?? events.filter(isGP).length;
  const _golsContra = placarContra ?? events.filter(isGC).length;

  function _bfRow(label, valA, valB, unit) {
    const maxV = Math.max(valA ?? 0, valB ?? 0, 1);
    const maxW = 90;
    const wA = valA != null && valA > 0 ? Math.max(3, Math.round((valA / maxV) * maxW)) : 0;
    const wB = valB != null && valB > 0 ? Math.max(3, Math.round((valB / maxV) * maxW)) : 0;
    const dispA = valA != null ? `${valA}${unit||''}` : '—';
    const dispB = valB != null ? `${valB}${unit||''}` : '—';
    const colA = valA != null ? '#ef4444' : 'transparent';
    const colB = valB != null ? '#9ca3af' : 'transparent';
    return `<div style="display:grid;grid-template-columns:${maxW+36}px 1fr ${maxW+36}px;align-items:center;padding:4px 0;border-bottom:1px solid #f3f4f6;">
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:5px;">
        <span style="font-size:12px;font-weight:700;color:#111827;min-width:28px;text-align:right;">${dispA}</span>
        <div style="width:${wA}px;height:10px;background:${colA};border-radius:3px 0 0 3px;flex-shrink:0;"></div>
      </div>
      <div style="text-align:center;font-size:10px;font-weight:600;color:#6b7280;padding:0 6px;white-space:nowrap;">${label}</div>
      <div style="display:flex;align-items:center;gap:5px;">
        <div style="width:${wB}px;height:10px;background:${colB};border-radius:0 3px 3px 0;flex-shrink:0;"></div>
        <span style="font-size:12px;font-weight:700;color:#111827;min-width:28px;">${dispB}</span>
      </div>
    </div>`;
  }

  const _butterflyStats = [
    _bfRow('Gols', _golsPro, _golsContra),
    _bfRow('Posse de Bola', Math.round(_posseAm), Math.round(_posseAdv), '%'),
    _bfRow('Finalizações', _finPro, _finAdv),
    _bfRow('Finalizações no Gol', _finNoGolPro, _finNoGolAdv),
    _bfRow('Chances Claras', _chancesClaras, _chancesClarasAdv),
    _bfRow('Escanteios', _escanteiosPro, _escanteiosAdv),
    _bfRow('Faltas cometidas', _faltasCom, _faltasSof),
  ].join('');

  // ── Diverging timeline chart (barras ↑ nós / ↓ adversário) ────
  const TDW=295, TDH=88, TDPAD=16;
  function divergingChart(title, upLabel, downLabel, upVals, downVals) {
    const maxV = Math.max(1, ...upVals, ...downVals);
    const midY = 38;
    const maxUpH = midY - 8;
    const maxDnH = TDH - midY - 14;
    const slotW = (TDW - TDPAD*2) / BINS.length;
    const bw = slotW * 0.68;
    let bars = '';
    BINS.forEach((_, i) => {
      const x = TDPAD + i * slotW + (slotW - bw) / 2;
      const upH = upVals[i]   > 0 ? Math.max(2, Math.round((upVals[i]   / maxV) * maxUpH)) : 0;
      const dnH = downVals[i] > 0 ? Math.max(2, Math.round((downVals[i] / maxV) * maxDnH)) : 0;
      if (upH > 0) {
        bars += `<rect x="${x.toFixed(1)}" y="${(midY - upH).toFixed(1)}" width="${bw.toFixed(1)}" height="${upH}" fill="#ef4444" rx="1"/>`;
        bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(midY-upH-2).toFixed(1)}" font-size="6.5" fill="#ef4444" text-anchor="middle" font-weight="bold">${upVals[i]}</text>`;
      }
      if (dnH > 0) {
        bars += `<rect x="${x.toFixed(1)}" y="${midY}" width="${bw.toFixed(1)}" height="${dnH}" fill="#9ca3af" rx="1"/>`;
        bars += `<text x="${(x+bw/2).toFixed(1)}" y="${(midY+dnH+8).toFixed(1)}" font-size="6.5" fill="#6b7280" text-anchor="middle" font-weight="bold">${downVals[i]}</text>`;
      }
    });
    // Zero axis
    bars += `<line x1="${TDPAD}" y1="${midY}" x2="${TDW-TDPAD}" y2="${midY}" stroke="#e5e7eb" stroke-width="1"/>`;
    // X labels centered on zero line
    let xlbls = '';
    BINS.forEach((b,i) => {
      const x = TDPAD + i * slotW + slotW / 2;
      xlbls += `<text x="${x.toFixed(1)}" y="${(midY+4).toFixed(1)}" font-size="6" fill="#d1d5db" text-anchor="middle">${b.split('–')[0]}</text>`;
    });
    const legend = `<span style="display:inline-flex;align-items:center;gap:2px;font-size:9px;color:#ef4444;font-weight:700;margin-right:6px;"><svg width="8" height="5"><rect x="0" y="1" width="8" height="3" fill="#ef4444" rx="1"/></svg>${upLabel}</span><span style="display:inline-flex;align-items:center;gap:2px;font-size:9px;color:#6b7280;font-weight:700;"><svg width="8" height="5"><rect x="0" y="1" width="8" height="3" fill="#9ca3af" rx="1"/></svg>${downLabel}</span>`;
    return `<div style="margin-bottom:9px;"><div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:1px;">${title}</div><svg width="${TDW}" height="${TDH}" style="display:block;">${bars}${xlbls}</svg><div style="margin-top:1px;">${legend}</div></div>`;
  }

  // ── Dados para gráficos divergentes ────────────────────────────
  // Posse por período: contagem de eventos por equipe em cada bin
  const _posseBins = BINS.map((_,i) => {
    const binEvs = events.filter(e => binIdx(e.seconds) === i && (e.posse === 'america' || e.posse === 'adv'));
    const tot = binEvs.length || 1;
    const am  = Math.round(binEvs.filter(e => e.posse === 'america').length / tot * 100);
    return { am, adv: 100 - am };
  });
  const posseBinAm  = _posseBins.map(b => b.am);
  const posseBinAdv = _posseBins.map(b => b.adv);
  // Entradas no setor de ataque (nós) vs entradas na defesa (adversário)
  const entAtq = byBin(e => e.action === 'Troca de setor' && e.meta?.para === 'ataque');
  const entDef = byBin(e => e.action === 'Troca de setor' && e.meta?.para === 'defesa');

  // ── Assemble ────────────────────────────────────────────────────
  const timelines = [
    timelineChart('Duelos',[{values:dg,color:'#ef4444',label:'Ganhos'},{values:dp,color:'#9ca3af',label:'Perdidos'}]),
    timelineChart('Roubadas de bola',[{values:rob,color:'#ef4444',label:'Roubadas'}]),
    timelineChart('Finalizações',[{values:fa,color:'#ef4444',label:'Nós'},{values:fadv,color:'#9ca3af',label:'Adv.'}], gp),
  ].join('');
  const diverging = [
    divergingChart('Posse de bola por período (%)', 'Nós', _advName, posseBinAm, posseBinAdv),
    divergingChart('Entradas no setor de ataque / defesa', 'Ataques (nós)', 'Ataques (adv)', entAtq, entDef),
  ].join('');

  const fieldMaps = `<div style="display:flex;gap:10px;flex-wrap:wrap;">` + [
    posseAmZona ? fieldZoneMap('Posse (%)',posseAmZona,'#374151',v=>v+'%') : '',
    fieldZoneMap('Roubadas',zR,'#ef4444'),
    fieldZoneMap('Duelos +',zDG,'#ef4444'),
    fieldZoneMap('Duelos −',zDP,'#6b7280'),
    fieldZoneMap('Boas dec.',zBD,'#ef4444'),
    fieldZoneMap('Erros',zErr,'#6b7280'),
  ].join('') + `</div>`;

  const _ca = getChatArea();
  if (!_ca) return;

  // Card 0 — Estatísticas do jogo (butterfly)
  const elStats = document.createElement('div');
  elStats.className = 'msg-ai flex gap-3';
  elStats.innerHTML = `
    <div class="w-7 h-7 rounded-lg bg-violet-700 flex items-center justify-center text-xs font-black text-white flex-shrink-0 mt-1">🕵️</div>
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 border border-gray-200 shadow-sm" style="max-width:min(95vw,960px);width:100%;">
      <div style="display:grid;grid-template-columns:126px 1fr 126px;align-items:center;margin-bottom:8px;">
        <div style="font-size:11px;font-weight:800;color:#ef4444;text-align:right;">Nós</div>
        <div style="text-align:center;font-size:10px;font-weight:700;color:#9ca3af;letter-spacing:.05em;text-transform:uppercase;">Estatísticas</div>
        <div style="font-size:11px;font-weight:800;color:#7c3aed;">${_advName}</div>
      </div>
      ${_butterflyStats}
      <div style="margin-top:5px;font-size:9px;color:#9ca3af;">— = dado não coletado pelo scout</div>
    </div>`;
  _ca.appendChild(elStats);

  // Card 1 — Gráficos de setor e tempo de jogo
  const elCharts = document.createElement('div');
  elCharts.className = 'msg-ai flex gap-3';
  elCharts.innerHTML = `
    <div class="w-7 h-7 rounded-lg bg-violet-700 flex items-center justify-center text-xs font-black text-white flex-shrink-0 mt-1">🕵️</div>
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 border border-gray-200 shadow-sm" style="max-width:min(95vw,960px);">
      <div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:10px;">Distribuição por setor e tempo de jogo</div>
      <div style="margin-bottom:12px;">
        <div style="font-size:9px;font-weight:800;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Por período (15 min)</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;">${timelines}</div>
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;">${diverging}</div>
      </div>
      <div>
        <div style="font-size:9px;font-weight:800;color:#6b7280;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Zonas do campo</div>
        ${fieldMaps}
      </div>
    </div>`;
  _ca.appendChild(elCharts);

  // Card 2 — Tabela de minutos dos atletas
  if (minutagemTable) {
    const elMin = document.createElement('div');
    elMin.className = 'msg-ai flex gap-3';
    elMin.innerHTML = `
      <div class="w-7 h-7 rounded-lg bg-violet-700 flex items-center justify-center text-xs font-black text-white flex-shrink-0 mt-1">🕵️</div>
      <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 border border-gray-200 shadow-sm" style="max-width:min(95vw,960px);width:100%;">
        ${minutagemTable}
      </div>`;
    _ca.appendChild(elMin);
  }

  _ca.scrollTop = _ca.scrollHeight;
}

function appendMsg(role, text, meta = {}) {
  const area = getChatArea();
  if (!area) return;

  if (role === 'user') {
    const el = document.createElement('div');
    el.className = 'msg-user flex justify-end';
    el.innerHTML = `<div class="bg-blue-600 rounded-2xl rounded-tr-sm px-4 py-3 max-w-lg"><p class="text-sm text-white">${text}</p></div>`;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
    return;
  }

  // AI message
  const el = document.createElement('div');
  el.className = 'msg-ai flex gap-3';
  const queryId = meta.queryId || uid();
  // Persona avatar
  const pKey = meta.persona || _activePersona;
  const pConf = pKey ? PERSONA_CONFIG[pKey] : null;
  const avatarBg = pConf ? pConf.color : '#1d4ed8';
  const avatarLabel = pConf ? pConf.emoji : 'IA';

  // Alertas ISP+ACWR
  const alertaHtml = meta.alertas?.length ? `<div class="alerta-isp-acwr mb-2">${meta.alertas.map(a=>`⚠ ${a}`).join('<br>')}</div>` : '';

  // Dados utilizados
  const dadosHtml = meta.dados?.length ? `
    <details class="mt-2 border-t border-gray-100 pt-2">
      <summary class="text-xs text-gray-400 cursor-pointer hover:text-gray-600 select-none">▸ Dados utilizados</summary>
      <p class="text-xs text-gray-400 mt-1">${meta.dados.join(' · ')}</p>
    </details>` : '';

  const feedbackHtml = `
    <div class="flex items-center gap-2 mt-2">
      <button class="feedback-btn text-lg" data-id="${queryId}" data-val="positivo" title="Útil">👍</button>
      <button class="feedback-btn text-lg" data-id="${queryId}" data-val="negativo" title="Não útil">👎</button>
      <button class="btn-pdf ml-auto text-xs font-semibold text-gray-400 hover:text-gray-700 border border-gray-200 hover:border-gray-400 rounded-lg px-3 py-1 transition-all" title="Exportar PDF">⬇ PDF</button>
    </div>`;

  const nivel2Html = !meta.nivel2 ? `
    <button class="btn-nivel2 mt-2 text-xs font-bold text-blue-600 hover:text-blue-800 border border-blue-200 hover:border-blue-400 rounded-lg px-3 py-1.5 transition-all block" data-qid="${queryId}">
      Ver análise detalhada →
    </button>` : '';

  const igpSummaryHtml   = meta.metricasGrupo?.dist ? _buildIGPSummaryCard(meta.metricasGrupo) : '';
  const metricasCardHtml = meta.metricasGrupo ? _buildMetricasGrupoCard(meta.metricasGrupo) : '';
  const cargaSemanaHtml  = meta.cargaSemana ? _buildCargaSemanaCards(meta.cargaSemana) : '';

  el.innerHTML = `
    <div class="w-7 h-7 rounded-lg flex items-center justify-center text-sm font-black text-white flex-shrink-0 mt-1" style="background:${avatarBg};">${avatarLabel}</div>
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 border border-gray-200 shadow-sm flex-1" style="min-width:0;">
      ${alertaHtml}
      ${igpSummaryHtml}
      ${metricasCardHtml ? metricasCardHtml + '<div style="height:12px;"></div>' : ''}
      ${cargaSemanaHtml ? cargaSemanaHtml + '<div style="height:4px;"></div>' : ''}
      <div class="resp-text text-sm text-gray-700 leading-relaxed">${renderMarkdown(text)}</div>
      ${dadosHtml}
      ${feedbackHtml}
      ${nivel2Html}
    </div>`;

  // Feedback handlers
  el.querySelectorAll('.feedback-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      el.querySelectorAll('.feedback-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      saveFeedback(btn.dataset.id, btn.dataset.val);
    });
  });

  // Nível 2 handler
  el.querySelector('.btn-nivel2')?.addEventListener('click', async function() {
    const btn = this;
    btn.disabled = true;
    btn.textContent = 'Analisando…';
    const cached = ctxCache.get(btn.dataset.qid);
    if (!cached) { btn.textContent = 'Contexto expirado.'; return; }
    const { ctx, intent, dados: cachedDados, alertas: cachedAlertas } = cached;
    const pergunta = INTENT_QUESTIONS[intent] || 'Análise detalhada.';
    showLoading();
    try {
      const resposta = await callAnthropic(ctx, pergunta, 3500, SYSTEM_PROMPT_NIVEL2);
      hideLoading();
      const newQid = uid();
      appendMsg('ai', resposta, { dados: cachedDados, alertas: cachedAlertas, queryId: newQid, nivel2: true });
      await Promise.all([
        incrementUsage(),
        saveHistory({ pergunta: `[Análise detalhada] ${pergunta}`, resposta, intencao: intent, dados: cachedDados, queryId: newQid }),
        updateBadge()
      ]);
    } catch(e) {
      hideLoading();
      if (e.name === 'AbortError') {
        appendMsg('ai', '_Resposta interrompida._', { nivel2: true });
      } else {
        appendMsg('ai', `Erro: ${e.message}`, { nivel2: true });
      }
    }
  });

  // PDF export handler
  el.querySelector('.btn-pdf')?.addEventListener('click', () => {
    const pKey2 = meta.persona || _activePersona;
    const pConf2 = pKey2 ? PERSONA_CONFIG[pKey2] : null;
    const personaLabel = pConf2 ? `${pConf2.emoji} ${pConf2.label}` : 'Analista IA';
    const hoje = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const conteudoHtml = el.querySelector('.resp-text')?.innerHTML || '';
    const alertaHtml2 = meta.alertas?.length ? `<div class="alerta">${meta.alertas.map(a=>`⚠ ${a}`).join('<br>')}</div>` : '';
    const win = window.open('', '_blank', 'width=800,height=700');
    win.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Ciente IE — ${personaLabel}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; color: #111827; background: #fff; padding: 36px 44px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 20px; }
  header .brand { font-size: 18px; font-weight: 800; color: #1d4ed8; letter-spacing: -.01em; }
  header .meta { font-size: 11px; color: #6b7280; text-align: right; line-height: 1.5; }
  .persona-tag { display: inline-block; font-size: 11px; font-weight: 700; color: ${pConf2?.color || '#1d4ed8'}; background: #f0f9ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 2px 8px; margin-bottom: 14px; }
  .alerta { background: #fff7ed; border: 1px solid #f97316; border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #c2410c; margin-bottom: 14px; }
  b, strong { font-weight: 700; color: #111827; }
  ul { padding-left: 1.4em; margin: .35em 0; }
  li { margin: .2em 0; }
  h2 { font-size: 13px; font-weight: 800; color: #111827; margin: 14px 0 4px; border-bottom: 1px solid #f3f4f6; padding-bottom: 3px; }
  h3 { font-size: 12px; font-weight: 800; color: #1e3a5f; margin: 10px 0 3px; }
  h4 { font-size: 12px; font-weight: 700; color: #374151; margin: 8px 0 2px; }
  p { margin: .3em 0; line-height: 1.6; }
  hr { border: none; border-top: 1px solid #e5e7eb; margin: 12px 0; }
  footer { margin-top: 28px; border-top: 1px solid #e5e7eb; padding-top: 8px; font-size: 10px; color: #9ca3af; text-align: center; }
  @media print { body { padding: 18px 24px; } }
</style></head><body>
<header>
  <div class="brand">Ciente IE</div>
  <div class="meta">Gerado em ${hoje}<br>Plataforma de Inteligência Esportiva</div>
</header>
<div class="persona-tag">${personaLabel}</div>
${alertaHtml2}
<div>${conteudoHtml}</div>
<footer>Ciente IE — Plataforma de Inteligência Esportiva | Documento gerado automaticamente</footer>
<script>window.onload = () => { window.print(); }<\/script>
</body></html>`);
    win.document.close();
  });

  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
  return queryId;
}

function showLoading() {
  const pConf = _activePersona ? PERSONA_CONFIG[_activePersona] : null;
  const loadBg = pConf ? pConf.color : '#1d4ed8';
  const loadLabel = pConf ? pConf.emoji : 'IA';
  const el = document.createElement('div');
  el.id = 'loadingMsg';
  el.className = 'flex gap-3';
  el.innerHTML = `
    <div class="w-7 h-7 rounded-lg flex items-center justify-center text-sm font-black text-white flex-shrink-0 mt-1" style="background:${loadBg};">${loadLabel}</div>
    <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 border border-gray-200 shadow-sm">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  const _ca = getChatArea(); if (_ca) { _ca.appendChild(el); _ca.scrollTop = _ca.scrollHeight; }
  showStopBar();
}

function hideLoading() {
  $('loadingMsg')?.remove();
  _currentAbort = null;
  hideStopBar();
}

/* ═══════════════════════════════════════════════════
   MAIN HANDLER
═══════════════════════════════════════════════════ */
async function handleSend(question, intent) {
  question = question.trim();
  if (!question || !intent) return;

  // Reseta caches de cards a cada nova pergunta
  _metricasGrupoCache = null;
  _cargaSemanaCache = null;

  const key = getApiKey();
  if (!key) {
    appendMsg('ai', '⚙ Chave da API Anthropic não configurada. Clique em **⚙** no canto superior direito para configurar.');
    return;
  }

  appendMsg('user', question);
  showLoading();

  const isAtletaIntent = ['atleta_evolucao','atleta_lesoes','atleta_inm','atleta_carga','atleta_jogos','briefing_atleta'].includes(intent);

  try {
    // await checkLimit(); // desativado temporariamente durante ajustes
    const { ctx, dados, alertas, chartData } = await buildContext(intent);
    if (isAtletaIntent && chartData) renderSparklineChart(chartData);
    if ((intent === 'desempenho_jogo' || intent === 'volume_setor_jogo') && chartData?.type === 'match') renderMatchCharts(chartData);
    const maxTok = isAtletaIntent ? 3500 : 2000;
    const persona = _activePersona ? PERSONA_CONFIG[_activePersona] : null;
    const sysPrompt = persona ? persona.systemPrompt() : SYSTEM_PROMPT;
    const resposta = await callAnthropic(ctx, question, maxTok, sysPrompt);
    hideLoading();
    const queryId = uid();
    ctxCache.set(queryId, { ctx, intent, dados, alertas });
    // Captura e reseta os caches de cards (populados por buildContext)
    const metricasGrupo = _metricasGrupoCache;
    _metricasGrupoCache = null;
    const cargaSemana = _cargaSemanaCache;
    _cargaSemanaCache = null;
    appendMsg('ai', resposta, { dados, alertas, queryId, persona: _activePersona, metricasGrupo, cargaSemana });
    await Promise.all([
      incrementUsage(),
      saveHistory({ pergunta: question, resposta, intencao: intent, dados, queryId }),
      updateBadge()
    ]);
  } catch(e) {
    hideLoading();
    if (e.name === 'AbortError') {
      appendMsg('ai', '_Resposta interrompida._');
    } else {
      appendMsg('ai', `Erro: ${e.message}`);
    }
  }
}

/* ═══════════════════════════════════════════════════
   HISTORY MODAL
═══════════════════════════════════════════════════ */
async function openHistory() {
  $('modalHistory').classList.remove('hidden');
  $('modalHistory').classList.add('flex');
  $('historyList').innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Carregando…</p>';
  const list = await loadHistory();
  if (!list.length) {
    $('historyList').innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Nenhuma consulta ainda.</p>';
    return;
  }
  $('historyList').innerHTML = '';
  list.forEach(item => {
    const el = document.createElement('div');
    el.className = 'bg-slate-800/60 border border-slate-700 rounded-xl px-3 py-2 cursor-pointer hover:border-blue-700 transition-colors';
    const ts = item.createdAt?.toDate ? item.createdAt.toDate().toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
    el.innerHTML = `
      <p class="text-xs font-bold text-slate-300 truncate">${item.pergunta}</p>
      <p class="text-xs text-slate-600 mt-0.5">${ts} · ${INTENT_LABELS[item.intencao]||item.intencao||'Livre'}</p>`;
    el.onclick = () => {
      $('modalHistory').classList.add('hidden');
      $('modalHistory').classList.remove('flex');
      appendMsg('user', item.pergunta);
      appendMsg('ai', item.resposta, { dados: item.dadosUtilizados });
    };
    $('historyList').appendChild(el);
  });
}

/* ═══════════════════════════════════════════════════
   EVENT HANDLERS
═══════════════════════════════════════════════════ */
// Persona cards
function setActivePersona(key) {
  _activePersona = key;

  // Mostrar área do persona selecionado, esconder as outras e o empty state
  $('chatEmpty').classList.add('hidden');
  ['mario', 'tele', 'quintino'].forEach(p => {
    const area = $(`chatArea-${p}`);
    if (p === key) {
      area.classList.remove('hidden');
    } else {
      area.classList.add('hidden');
    }
  });

  // Destacar card ativo
  document.querySelectorAll('.persona-card').forEach(c => {
    c.classList.toggle('active', c.dataset.persona === key);
    c.style.borderColor = c.dataset.persona === key ? PERSONA_CONFIG[key].color : '#e5e7eb';
  });

  // Atualizar perguntas rápidas
  const conf = PERSONA_CONFIG[key];
  const container = $('personaQuestions');
  container.innerHTML = '';
  conf.questions.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'btn-quick';
    btn.textContent = q.text;
    btn.style.borderColor = conf.color;
    btn.addEventListener('click', () => handleSend(q.text, q.intent));
    container.appendChild(btn);
  });
  container.classList.remove('hidden');
  container.classList.add('flex');

  // Mensagem de apresentação — apenas na primeira vez que esta persona é aberta
  if (!_greetedPersonas.has(key) && conf.apresentacao) {
    _greetedPersonas.add(key);
    const chatArea = $(`chatArea-${key}`);
    const div = document.createElement('div');
    div.className = 'msg-ai flex gap-3';
    div.innerHTML = `
      <div class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-black text-white flex-shrink-0 mt-1" style="background:${conf.color};">${conf.label[0]}</div>
      <div class="bg-white rounded-2xl rounded-tl-sm px-4 py-3 max-w-2xl border border-gray-200 shadow-sm">
        <p class="text-xs font-bold mb-1" style="color:${conf.color};">${conf.label}</p>
        <p class="text-sm text-gray-700 leading-relaxed">${conf.apresentacao}</p>
      </div>`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }
}

document.querySelectorAll('.persona-card').forEach(card => {
  card.addEventListener('click', () => setActivePersona(card.dataset.persona));
});

// Settings
$('btnSettings').addEventListener('click', () => {
  $('inputApiKey').value = localStorage.getItem('anthropic_api_key') || '';
  $('modalSettings').classList.remove('hidden');
  $('modalSettings').classList.add('flex');
});
$('btnSaveKey').addEventListener('click', () => {
  const k = $('inputApiKey').value.trim();
  if(k) localStorage.setItem('anthropic_api_key', k);
  $('modalSettings').classList.add('hidden');
  $('modalSettings').classList.remove('flex');
});
['btnCloseSettings','btnCloseSettings2'].forEach(id => {
  $(id)?.addEventListener('click', () => { $('modalSettings').classList.add('hidden'); $('modalSettings').classList.remove('flex'); });
});

// History
$('btnHistory').addEventListener('click', openHistory);
$('btnCloseHistory').addEventListener('click', () => { $('modalHistory').classList.add('hidden'); $('modalHistory').classList.remove('flex'); });
$('modalHistory').addEventListener('click', e => { if(e.target === $('modalHistory')) { $('modalHistory').classList.add('hidden'); $('modalHistory').classList.remove('flex'); } });
$('modalSettings').addEventListener('click', e => { if(e.target === $('modalSettings')) { $('modalSettings').classList.add('hidden'); $('modalSettings').classList.remove('flex'); } });

/* ═══════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════ */
onAuthStateChanged(auth, async user => {
  if (!user) return;
  const ctx = JSON.parse(localStorage.getItem('userContext') || '{}');
  clubId = ctx.clubId || '';
  userId = user.uid;
  if (!clubId) {
    try {
      const snap = await getDoc(doc(db,'users', user.uid));
      if (snap.exists()) clubId = snap.data().clubId || '';
    } catch {}
  }
  await updateBadge();

  // Set default date filter to today
  $('filtroData').value = todayISO();

  // Populate filter dropdowns
  try {
    const snap = await getDocs(query(collection(db,'athletes'), where('clubId','==',clubId), where('ativo','==',true)));
    _athletesAll = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    const cats = [...new Set(_athletesAll.map(a=>a.categoria).filter(Boolean))].sort();
    const poss = [...new Set(_athletesAll.map(a=>a.posicao).filter(Boolean))].sort();

    const selCat = $('filtroCategoria');
    cats.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; selCat.appendChild(o); });

    const selPos = $('filtroPosicao');
    poss.forEach(p => { const o=document.createElement('option'); o.value=p; o.textContent=p; selPos.appendChild(o); });

    const selAth = $('filtroAtleta');
    [..._athletesAll].sort((a,b)=>a.nome.localeCompare(b.nome)).forEach(a => {
      const o=document.createElement('option'); o.value=a.id; o.textContent=a.nome; selAth.appendChild(o);
    });

    // When category or position changes, filter the athlete dropdown
    function syncAthleteDropdown() {
      const cat = $('filtroCategoria').value;
      const pos = $('filtroPosicao').value;
      const prev = $('filtroAtleta').value;
      selAth.innerHTML = '<option value="">Todos</option>';
      _athletesAll.filter(a => (!cat || a.categoria===cat) && (!pos || a.posicao===pos))
        .sort((a,b)=>a.nome.localeCompare(b.nome))
        .forEach(a => { const o=document.createElement('option'); o.value=a.id; o.textContent=a.nome; selAth.appendChild(o); });
      if ([...$('filtroAtleta').options].some(o=>o.value===prev)) $('filtroAtleta').value=prev;
    }
    $('filtroCategoria').addEventListener('change', syncAthleteDropdown);
    $('filtroPosicao').addEventListener('change', syncAthleteDropdown);
  } catch(e) { console.warn('Erro ao carregar filtros:', e); }
});
</script>
