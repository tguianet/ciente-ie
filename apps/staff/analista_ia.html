<script type="module">
import { db, auth } from "../core/firebase.js";
import {
  collection, getDocs, addDoc, setDoc, getDoc, doc,
  query, where, orderBy, limit as limitFS, serverTimestamp, updateDoc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { gerarSessao, gerarSugestaoExercicios, PRINCIPIOS } from "../core/session_engine.js";
import { calcularProntidao as _calcPront } from "../core/stats.js";

/* ═══════════════════════════════════════════════════
   MICROCICLO — replicado de dashboard.js
═══════════════════════════════════════════════════ */
function _getMicrocicloCtx() {
  const hoje = new Date();
  function getISOWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil((((t - y) / 86400000) + 1) / 7);
  }
  const semana = `S${getISOWeek(hoje)}-${hoje.getFullYear()}`;
  const _clubId = JSON.parse(localStorage.getItem('userContext') || '{}').clubId || '';
  const chave = `microciclo_${semana}_${_clubId}`;
  const raw = localStorage.getItem(chave);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function _getMicrocicloManualDia(dateStr, _clubId) {
  const raw = localStorage.getItem(`microciclo_dia_${dateStr}_${_clubId}`);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch { return null; }
}

function calcularDiaMicrociclo() {
  const _clubId = JSON.parse(localStorage.getItem('userContext') || '{}').clubId || '';
  const _manual = _getMicrocicloManualDia(new Date().toLocaleDateString('en-CA'), _clubId);
  if (_manual?.label) return _manual;

  const ctx = _getMicrocicloCtx();
  if (!ctx) return null;

  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const periodo = ctx.periodo || 'Preparação';

  function parseLocal(str) {
    const [y, m, d] = str.split('-').map(Number);
    const dt = new Date(y, m - 1, d); dt.setHours(0, 0, 0, 0); return dt;
  }
  function diffDias(a, b) { return Math.round((a - b) / 86400000); }

  const objs = {
    D1: { label: 'D1', objetivo: 'Reativação',    detalhe: 'Fortalecimento neuromuscular — início do ciclo de carga',              cor: '#3b82f6' },
    D2: { label: 'D2', objetivo: 'Sobrecarga I',  detalhe: 'Desenvolvimento metabólico — resistência aeróbica e capacidade glicolítica', cor: '#f97316' },
    D3: { label: 'D3', objetivo: 'Sobrecarga II', detalhe: 'Pico de carga — força, alta solicitação neuromuscular',                     cor: '#ef4444' },
    D4: { label: 'D4', objetivo: 'Dissipação',    detalhe: 'Redução de carga — início da dissipação da fadiga acumulada',               cor: '#8b5cf6' },
    D5: { label: 'D5', objetivo: 'Potenciação',   detalhe: 'Baixo volume — manutenção da excitabilidade neural',                        cor: '#10b981' },
    D6: { label: 'D6', objetivo: 'Manutenção',    detalhe: 'Carga e exigências física-cognitiva semelhantes ao jogo competitivo',       cor: '#6b7280' },
    D7: { label: 'D7', objetivo: 'Folga',         detalhe: 'Folga — recuperação espontânea',                                            cor: '#9ca3af' },
  };

  if (ctx.jogoA) {
    const jogoA = parseLocal(ctx.jogoA);
    const jogoB = ctx.jogoB ? parseLocal(ctx.jogoB) : null;
    if (jogoB) {
      const dA = diffDias(hoje, jogoA);
      const dB = diffDias(hoje, jogoB);
      if (dA === 0) return { periodo, label: 'Jogo A', objetivo: 'Competição', detalhe: 'Jogo — mobilização máxima de todos os sistemas', cor: '#1d4ed8' };
      if (dB === 0) return { periodo, label: 'Jogo B', objetivo: 'Competição', detalhe: 'Jogo — mobilização máxima de todos os sistemas', cor: '#1d4ed8' };
      if (dA === 1) return { periodo, label: 'MD+1', objetivo: 'Repouso ou Recovery', detalhe: 'Pico de fadiga pós-jogo — repouso e início da ressíntese de glicogênio', cor: '#8b5cf6' };
      if (dB === -1) return { periodo, label: 'MD-1 (B)', objetivo: 'Ativação', detalhe: 'Ativação leve — mobilização neural sem acúmulo de fadiga', cor: '#10b981' };
      if (dB === -2) return { periodo, label: 'MD-2 (B)', objetivo: 'Reativação', detalhe: 'Recuperação parcial — reestimulação neuromuscular controlada', cor: '#f59e0b' };
      return { periodo, label: 'Semana dupla', objetivo: 'Recuperação', detalhe: 'Semana comprimida', cor: '#6b7280' };
    }
    const diff = diffDias(hoje, jogoA);
    const mapa = {
       '0':  { label: 'MD0',  objetivo: 'Competição',         detalhe: 'Jogo — mobilização máxima de todos os sistemas',                        cor: '#1d4ed8' },
       '1':  { label: 'MD+1', objetivo: 'Repouso ou Recovery', detalhe: 'Pico de fadiga pós-jogo — repouso e início da ressíntese de glicogênio', cor: '#8b5cf6' },
       '2':  { label: 'MD+2', objetivo: 'Regenerativo',        detalhe: 'Recuperação ativa — redução de metabólitos',                           cor: '#7c3aed' },
       '3':  { label: 'MD+3', objetivo: 'Adaptação',           detalhe: 'Estímulo aeróbio e neuromuscular',                                     cor: '#6366f1' },
      '-3':  { label: 'MD-3', objetivo: 'Potenciação',         detalhe: 'Última sessão de alta carga — força e demanda neuromuscular elevada',   cor: '#ef4444' },
      '-2':  { label: 'MD-2', objetivo: 'Reconstrução',        detalhe: 'Redução de volume — velocidade e qualidade de movimento em foco',       cor: '#f97316' },
      '-1':  { label: 'MD-1', objetivo: 'Ativação',            detalhe: 'Baixo volume — ativação neural e preservação do estado de prontidão',   cor: '#10b981' },
    };
    if (diff <= -4) {
      const dow = hoje.getDay();
      if (dow === 1) return { periodo, ...objs['D1'] };
      if (dow === 2) return { periodo, ...objs['D2'] };
      if (dow === 3) return { periodo, ...objs['D3'] };
    }
    return { periodo, ...(mapa[String(diff)] || { label: '—', objetivo: 'Fora do microciclo', detalhe: '', cor: '#9ca3af' }) };
  }

  if (periodo === 'Preparação' || periodo === 'Transição') {
    const diasSemana = ['D7', 'D1', 'D2', 'D3', 'D4', 'D5', 'D6'];
    const labelEfetivo = diasSemana[hoje.getDay()];
    return { periodo, ...(objs[labelEfetivo] || objs['D7']) };
  }

  return { periodo, label: '—', objetivo: 'Sem jogo cadastrado', detalhe: '', cor: '#9ca3af' };
}

async function obterDiaMicrocicloParaIA() {
  const _clubId = JSON.parse(localStorage.getItem('userContext') || '{}').clubId || '';
  const hojStr = new Date().toLocaleDateString('en-CA');
  const manual = _getMicrocicloManualDia(hojStr, _clubId);
  if (manual?.label) return manual;

  const mc = calcularDiaMicrociclo();
  const label = mc?.label || '';
  if (label.startsWith('MD') || label === 'Jogo A' || label === 'Jogo B' || label === 'MD0') return mc;

  if (!_clubId) return mc;
  try {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const hojStr2 = hoje.toISOString().slice(0, 10);
    const d4ago = new Date(hoje.getTime() - 4 * 86400000).toISOString().slice(0, 10);
    const d4fte = new Date(hoje.getTime() + 4 * 86400000).toISOString().slice(0, 10);
    const snap = await getDocs(query(collection(db, 'scout_partidas'), where('clubId', '==', _clubId)));
    const todasPartidas = [];
    snap.forEach(d => {
      const p = d.data();
      if (p.data?.toDate) p.data = p.data.toDate().toLocaleDateString('en-CA');
      todasPartidas.push(p);
    });
    const partidas = todasPartidas.filter(p => typeof p.data === 'string' && p.data >= d4ago && p.data <= d4fte);
    if (!partidas.length) return mc;
    const periodo = mc?.periodo || 'Competição';
    const passadas = partidas.filter(p => p.data < hojStr2).sort((a, b) => b.data.localeCompare(a.data));
    const futuras  = partidas.filter(p => p.data > hojStr2).sort((a, b) => a.data.localeCompare(b.data));
    const hojeJogo = partidas.some(p => p.data === hojStr2);
    const mapaMais  = { 1: { label: 'MD+1', objetivo: 'Repouso ou Recovery', detalhe: 'Pico de fadiga pós-jogo', cor: '#8b5cf6' }, 2: { label: 'MD+2', objetivo: 'Regenerativo', detalhe: 'Recuperação ativa', cor: '#7c3aed' }, 3: { label: 'MD+3', objetivo: 'Adaptação', detalhe: 'Estímulo aeróbio e neuromuscular', cor: '#6366f1' } };
    const mapaMenos = { 1: { label: 'MD-1', objetivo: 'Ativação', detalhe: 'Baixo volume — ativação neural', cor: '#10b981' }, 2: { label: 'MD-2', objetivo: 'Reconstrução', detalhe: 'Redução de volume — velocidade em foco', cor: '#f97316' }, 3: { label: 'MD-3', objetivo: 'Potenciação', detalhe: 'Última sessão de alta carga', cor: '#ef4444' } };
    if (hojeJogo) return { periodo, label: 'MD0', objetivo: 'Competição', detalhe: 'Jogo', cor: '#1d4ed8' };
    if (futuras.length) { const d = Math.round((new Date(futuras[0].data + 'T00:00:00') - hoje) / 86400000); if (d <= 3 && mapaMenos[d]) return { periodo, ...mapaMenos[d] }; }
    if (passadas.length) { const d = Math.round((hoje - new Date(passadas[0].data + 'T00:00:00')) / 86400000); if (d <= 3 && mapaMais[d]) return { periodo, ...mapaMais[d] }; }
  } catch (e) { console.warn('obterDiaMicrocicloParaIA:', e); }
  return mc;
}

/* ═══════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════
   IGP CALCULATION (simplified absolute scales)
═══════════════════════════════════════════════════ */
function calcIH(hooper) {
  if (hooper == null) return null;
  return Math.max(0, Math.min(100, Math.round(100 - ((hooper - 4) / 24) * 100)));
}
function calcIA(lnRR) {
  if (lnRR == null) return null;
  const pts = [[1.5,5],[2.5,35],[3.0,50],[3.5,65],[4.0,80],[4.5,92],[5.5,98]];
  if (lnRR <= pts[0][0]) return pts[0][1];
  if (lnRR >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for (let i = 1; i < pts.length; i++) {
    if (lnRR <= pts[i][0]) {
      const t = (lnRR - pts[i-1][0]) / (pts[i][0] - pts[i-1][0]);
      return Math.round(pts[i-1][1] + t * (pts[i][1] - pts[i-1][1]));
    }
  }
  return 65;
}
function calcINM(salto) {
  if (salto == null) return null;
  const pts = [[10,10],[20,30],[30,50],[35,60],[40,70],[45,80],[50,88],[60,97]];
  if (salto <= pts[0][0]) return pts[0][1];
  if (salto >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for (let i = 1; i < pts.length; i++) {
    if (salto <= pts[i][0]) {
      const t = (salto - pts[i-1][0]) / (pts[i][0] - pts[i-1][0]);
      return Math.round(pts[i-1][1] + t * (pts[i][1] - pts[i-1][1]));
    }
  }
  return 50;
}
function calcIGP(pre, hrv, neuro) {
  const IH  = calcIH(pre?.hooper ?? null);
  // IA: usa hrv.score (Bayesiano ou absoluto) salvo pelo app de HRV — igual ao dashboard.
  // Fallback para calcIA(lnRR) apenas se hrv.score não existir (coletas antigas).
  const IA  = hrv?.score != null
    ? Math.round(Math.max(0, Math.min(100, hrv.score)))
    : calcIA(hrv?.lnRR ?? null);
  const INM = calcINM(pre?.salto ?? null);
  // IC: usa neuro.score (0–100) direto — mesmo que prontidao.js antes de aplicar z-score
  const IC  = neuro?.score != null ? Math.round(Math.max(0, Math.min(100, neuro.score))) : null;
  const scores = [IH, IA, INM, IC].filter(s => s != null);
  if (!scores.length) return { global: null, IH, IA, INM, IC };
  const media = scores.reduce((a,b)=>a+b,0) / scores.length;
  const pior  = Math.max(Math.min(...scores), 30);
  const global = Math.max(0, Math.min(100, Math.round(media * 0.8 + pior * 0.2)));
  return { global, IH, IA, INM, IC };
}
function classifyIGP(v) {
  if (v == null) return 'Sem dados';
  if (v >= 70) return 'Estável';
  if (v >= 60) return 'Atenção Leve';
  if (v >= 50) return 'Atenção';
  return 'Crítico';
}
function sistemasBaixos(igp) {
  const out = [];
  const map = { IH: 'Hooper (subjetivo)', IA: 'HRV (autonômico)', INM: 'CMJ (neuromuscular)', IC: 'NeuroScore (cognitivo)' };
  Object.entries(map).forEach(([k,v]) => { if(igp[k] != null && igp[k] < 60) out.push(`${v} (${igp[k]})`); });
  return out;
}

async function loadMatchEventsFull(p) {
  // 1. Inline (partidas antigas que guardam eventos no documento)
  if (Array.isArray(p.events) && p.events.length) return p.events;
  // 2. Sub-coleção (padrão atual)
  const fromSub = await loadMatchEvents(p.id);
  if (fromSub.length) return fromSub;
  // 3. perfSnapshot (fallback: reconstrói ações sem timing)
  if (p.perfSnapshot) {
    const rebuilt = [];
    Object.values(p.perfSnapshot).forEach(sn => {
      if (!sn.athleteId || !sn.actions) return;
      Object.entries(sn.actions).forEach(([action, count]) => {
        for (let i = 0; i < count; i++)
          rebuilt.push({ action, athleteId: sn.athleteId, athleteName: sn.athleteName || sn.athleteId });
      });
    });
    return rebuilt;
  }
  return [];
}

// Calcula % de posse da equipe a partir dos eventos de "Troca de posse"
function calcPosseFromEvts(events, durSec) {
  const trocas = events
    .filter(e => e.action === "Troca de posse")
    .sort((a,b) => (a.seconds||0) - (b.seconds||0));
  if (!trocas.length) return null;
  let amSec = 0, advSec = 0, prevSec = 0, curr = "america";
  const primSec = trocas[0].seconds || 0;
  if (primSec > 0) { if (curr === "america") amSec += primSec; else advSec += primSec; }
  curr = trocas[0].meta?.para ?? curr;
  prevSec = primSec;
  for (let i = 1; i < trocas.length; i++) {
    const s = trocas[i].seconds || 0;
    const seg = Math.max(s - prevSec, 0);
    if (curr === "america") amSec += seg; else if (curr === "adv") advSec += seg;
    curr = trocas[i].meta?.para ?? curr;
    prevSec = s;
  }
  const remain = Math.max((durSec||0) - prevSec, 0);
  if (curr === "america") amSec += remain; else if (curr === "adv") advSec += remain;
  const total = amSec + advSec;
  return total > 0 ? Math.round(amSec / total * 100) : null;
}

/**
 * Para cada atleta ativo, retorna o status do registro de lesão mais recente.
 * Registros de tipoRegistro === 'atendimento' (rotina) são ignorados para não
 * sobrescrever o status real de um atleta já liberado.
 */
function buildLatestInjuryStatus(medical, athMap) {
  const latest = {};
  medical.forEach(m => {
    if (!athMap[m.athleteId]) return; // apenas atletas ativos
    if ((m.dados?.tipoRegistro || '') === 'atendimento') return; // rotina não muda status de lesão
    const aid = m.athleteId;
    if (!latest[aid] || (m.data || '') > (latest[aid].data || '')) {
      latest[aid] = m;
    }
  });
  const result = {};
  Object.entries(latest).forEach(([id, m]) => {
    result[id] = { id, status: m.dados?.status || m.dados?.statusAtual || '', record: m };
  });
  return result;
}

async function getResumoDia(date) {
  // Carrega TODOS os metrics como prontidao.js — sem janela de datas — para z-scores idênticos
  const [athletes, allMetrics, medical] = await Promise.all([
    loadAthletes(),
    loadAllMetrics(),
    loadMedical()
  ]);

  const metrics     = allMetrics.filter(m => m.date === date);
  const metricsHist = allMetrics.filter(m => m.date < date);   // histórico sem hoje

  // statusMedMap: status real por atleta (afastado | transicao | livre)
  const injuryMap = buildLatestInjuryStatus(medical, Object.fromEntries(athletes.map(a=>[a.id,a])));
  const statusMedMap = {};
  Object.values(injuryMap).forEach(r => { statusMedMap[r.id] = r.status; });

  // Current week start (Monday)
  const _rsd_wd = new Date(date + 'T12:00:00').getDay();
  const _rsd_mon = new Date(date + 'T12:00:00');
  _rsd_mon.setDate(_rsd_mon.getDate() - (_rsd_wd === 0 ? 6 : _rsd_wd - 1));
  const _weekStart = _rsd_mon.toLocaleDateString('en-CA');

  const list = athletes.map(a => {
    const statusMed = statusMedMap[a.id] || 'livre';
    const hist = metricsHist.filter(m => m.athleteId === a.id);
    const dm = metrics.find(m => m.athleteId === a.id);

    // Today's indicators
    let igpGlobal = null, IH = null, IA = null, INM = null, IC = null;
    let dor = [], dorNumerico = null;
    if (dm) {
      const pront = _calcPront({ ...dm, athleteId: a.id }, hist, date);
      igpGlobal = pront.global != null ? Math.round(pront.global) : null;
      IH  = pront.IH  != null ? Math.round(pront.IH)  : null;
      IA  = pront.IA  != null ? Math.round(pront.IA)  : null;
      INM = pront.INM != null ? Math.round(pront.INM) : null;
      IC  = pront.IC  != null ? Math.round(pront.IC)  : null;
      dor = dm.pre?.regioes_dor || [];
      dorNumerico = dm.pre?.dor ?? null;
    }

    // Per-indicator week reference (for any indicator missing today)
    let refSemana = null;
    if (IH == null || IA == null || INM == null || IC == null) {
      const weekPrior = allMetrics
        .filter(m => m.athleteId === a.id && m.date >= _weekStart && m.date < date)
        .sort((x, y) => y.date.localeCompare(x.date));
      if (weekPrior.length) {
        const dmRef = weekPrior[0];
        const pRef = _calcPront({ ...dmRef, athleteId: a.id }, hist, dmRef.date);
        refSemana = {
          date: dmRef.date,
          IH:  pRef.IH  != null ? Math.round(pRef.IH)  : null,
          IA:  pRef.IA  != null ? Math.round(pRef.IA)  : null,
          INM: pRef.INM != null ? Math.round(pRef.INM) : null,
          IC:  pRef.IC  != null ? Math.round(pRef.IC)  : null,
        };
      }
    }

    return {
      id: a.id, nome: a.nome, posicao: a.posicao,
      igp: igpGlobal, IH, IA, INM, IC,
      status: dm ? classifyIGP(igpGlobal) : 'Sem coleta',
      statusMed, inMedical: statusMed === 'afastado' || statusMed === 'transicao',
      dor, dorNumerico, refSemana
    };
  });

  const w = list.filter(r => r.igp != null);
  return {
    data: date,
    total: athletes.length,
    comColeta: w.length,
    dist: { estavel: w.filter(r=>r.igp>=70).length, atencaoLeve: w.filter(r=>r.igp>=60&&r.igp<70).length, atencao: w.filter(r=>r.igp>=50&&r.igp<60).length, critico: w.filter(r=>r.igp<50).length, semColeta: list.filter(r=>r.igp==null).length },
    medico: Object.values(statusMedMap).filter(s => s === 'afastado').length,
    atletas: list
  };
}

/* ═══════════════════════════════════════════════════
   MÉDIAS DO GRUPO
═══════════════════════════════════════════════════ */
async function getMediasGrupo(date, atletasHoje) {
  const _avg = (docs, path) => {
    const vals = docs.map(d => path.split('.').reduce((o, k) => o?.[k], d))
                     .filter(v => v != null && typeof v === 'number');
    return vals.length ? Math.round((vals.reduce((s, v) => s + v, 0) / vals.length) * 10) / 10 : null;
  };

  const date28ago = dateAgoISO(date, 28);

  // Carrega métricas de hoje e histórico 28d em paralelo
  const [metricsHoje, metricsHist] = await Promise.all([
    loadMetrics(date, date),
    loadMetrics(date28ago, dateAgoISO(date, 1))
  ]);

  // Threshold para sessão coletiva: pelo menos 20% do elenco ou 3 atletas
  const totalAtletas = (atletasHoje || []).length || 10;
  const minThreshold = Math.max(3, Math.floor(totalAtletas * 0.2));

  // Agrupa histórico por data e conta atletas com post.pse > 0
  const pseByDate = {};
  metricsHist.forEach(m => {
    if ((m.post?.pse ?? 0) > 0) {
      pseByDate[m.date] = (pseByDate[m.date] || 0) + 1;
    }
  });

  // Datas de sessões coletivas (≥ minThreshold atletas com post.pse > 0)
  const teamSessionDates = Object.keys(pseByDate)
    .filter(d => pseByDate[d] >= minThreshold)
    .sort();

  // Última sessão coletiva
  const lastSessionDate = teamSessionDates.length
    ? teamSessionDates[teamSessionDates.length - 1]
    : null;
  const metricsLastSession = lastSessionDate
    ? metricsHist.filter(m => m.date === lastSessionDate)
    : [];

  // Scores calculados (IH/IA/INM/IC) — média dos atletas que já têm coleta hoje
  const comColeta = (atletasHoje || []).filter(a => a.igp != null);
  const n_hoje = comColeta.length;

  const avgScore = (key) => {
    const vals = comColeta.map(a => a[key]).filter(v => v != null && typeof v === 'number');
    return vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length) : null;
  };

  // Scores históricos: calcular IH/IA/INM/IC para cada doc de histórico
  const histComScores = metricsHist.map(dm => {
    const igp = calcIGP(dm.pre, dm.hrv, dm.neuro);
    return { ...dm, _IH: igp.IH, _IA: igp.IA, _INM: igp.INM, _IC: igp.IC };
  });

  // Sessões coletivas da semana ISO atual (segunda-feira até ontem)
  const _isoMonday = (() => {
    const d = new Date(date + 'T12:00:00');
    const dow = d.getDay(); // 0=Dom, 1=Seg...6=Sáb
    d.setDate(d.getDate() - (dow === 0 ? 6 : dow - 1));
    return d.toLocaleDateString('en-CA');
  })();
  const weekTeamDates = teamSessionDates.filter(d => d >= _isoMonday);
  const m7team = metricsHist.filter(m => weekTeamDates.includes(m.date));
  const nSess = weekTeamDates.length;

  return {
    hoje: {
      IH:        avgScore('IH'),
      IA:        avgScore('IA'),
      INM:       avgScore('INM'),
      IC:        avgScore('IC'),
      sono:      _avg(metricsHoje, 'pre.sono'),
      estresse:  _avg(metricsHoje, 'pre.estresse'),
      fadiga:    _avg(metricsHoje, 'pre.fadiga'),
      dor_hooper:_avg(metricsHoje, 'pre.dor'),
      humor:     _avg(metricsHoje, 'pre.humorEmocional'),
      salto:     _avg(metricsHoje, 'pre.salto'),
      lnRR:      _avg(metricsHoje, 'hrv.lnRR'),
      neuroScore:_avg(metricsHoje, 'neuro.score'),
    },
    ontem: {
      pse:       _avg(metricsLastSession, 'post.pse'),
      volume:    _avg(metricsLastSession, 'post.tempo'),
      carga:     _avg(metricsLastSession, 'post.carga'),
      qualidade: _avg(metricsLastSession, 'post.qualidade'),
    },
    lastSessionDate,
    hist28: {
      IH:        (() => { const v = histComScores.map(d => d._IH).filter(v => v != null); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; })(),
      IA:        (() => { const v = histComScores.map(d => d._IA).filter(v => v != null); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; })(),
      INM:       (() => { const v = histComScores.map(d => d._INM).filter(v => v != null); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; })(),
      IC:        (() => { const v = histComScores.map(d => d._IC).filter(v => v != null); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; })(),
      sono:      _avg(metricsHist, 'pre.sono'),
      estresse:  _avg(metricsHist, 'pre.estresse'),
      fadiga:    _avg(metricsHist, 'pre.fadiga'),
      dor_hooper:_avg(metricsHist, 'pre.dor'),
      humor:     _avg(metricsHist, 'pre.humorEmocional'),
      salto:     _avg(metricsHist, 'pre.salto'),
      lnRR:      _avg(metricsHist, 'hrv.lnRR'),
      neuroScore:_avg(metricsHist, 'neuro.score'),
      pse:       _avg(metricsHist, 'post.pse'),
      volume:    _avg(metricsHist, 'post.tempo'),
      carga:     _avg(metricsHist, 'post.carga'),
      qualidade: _avg(metricsHist, 'post.qualidade'),
    },
    semana: {
      pse:       _avg(m7team, 'post.pse'),
      volume:    _avg(m7team, 'post.tempo'),
      carga:     _avg(m7team, 'post.carga'),
      qualidade: _avg(m7team, 'post.qualidade'),
      n_sessoes: nSess,
    },
    n_hoje,
    date,
  };
}

async function getAdaptacaoCarga(janelaOrStart = 7) {
  const today = getRefDate();
  const start = typeof janelaOrStart === 'string' ? janelaOrStart : dateAgoISO(today, janelaOrStart);
  const [athletes, metrics] = await Promise.all([loadAthletes(), loadMetrics(start, today)]);

  return athletes.map(a => {
    const hist = metrics.filter(m => m.athleteId === a.id).sort((x,y) => x.date.localeCompare(y.date));
    if (!hist.length) return { id: a.id, nome: a.nome, posicao: a.posicao, semDados: true };

    const igps = hist.map(d => ({ date: d.date, igp: calcIGP(d.pre, d.hrv, d.neuro).global })).filter(x=>x.igp!=null);
    const cargaTotal = hist.reduce((s,d) => s + (d.post?.carga ?? 0), 0);
    const tempoTotal = hist.reduce((s,d) => s + (d.post?.tempo ?? 0), 0);
    const sessoes = hist.filter(d => (d.post?.carga ?? 0) > 0 || (d.post?.pse ?? 0) > 0);
    const pses  = sessoes.map(d => d.post?.pse).filter(v => v != null);
    const quals = sessoes.map(d => d.post?.qualidade).filter(v => v != null);
    const tempos = sessoes.map(d => d.post?.tempo).filter(v => v != null);
    const fn_media = arr => arr.length ? parseFloat((arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1)) : null;
    const pseMedia   = fn_media(pses);
    const qualMedia  = fn_media(quals);
    const tempoMedia = tempos.length ? Math.round(tempos.reduce((a,b)=>a+b,0)/tempos.length) : null;
    const sessoesDetalhes = sessoes.map(d => ({ date: d.date, pse: d.post?.pse??null, carga: d.post?.carga??null, tempo: d.post?.tempo??null, qualidade: d.post?.qualidade??null }));
    const dorRegioes = new Set();
    hist.forEach(d => (d.pre?.regioes_dor || []).forEach(r => dorRegioes.add(r)));
    const dorDias = hist.filter(d => (d.pre?.regioes_dor || []).length > 0).length;
    const cargas28 = metrics.filter(m => m.athleteId === a.id && m.date < today).map(d => d.post?.carga ?? 0);
    const aguda = cargas28.slice(-7).reduce((s,v)=>s+v, 0);
    const cronica = cargas28.length >= 4 ? cargas28.reduce((s,v)=>s+v,0)/Math.ceil(cargas28.length/7) : null;
    const acwr = cronica && cronica > 0 ? parseFloat((aguda/cronica).toFixed(2)) : null;
    const recentes   = igps.slice(-3).map(x=>x.igp);
    const anteriores = igps.slice(-7,-3).map(x=>x.igp);
    const mediaRec = recentes.length   ? recentes.reduce((a,b)=>a+b,0)/recentes.length   : null;
    const mediaAnt = anteriores.length ? anteriores.reduce((a,b)=>a+b,0)/anteriores.length : null;
    const tendencia = (mediaRec!=null && mediaAnt!=null) ? (mediaRec > mediaAnt+3 ? 'Melhora' : mediaRec < mediaAnt-3 ? 'Queda' : 'Estável') : 'Insuficiente';
    const alertaISPACWR = acwr != null && acwr > 1.3 && tendencia === 'Queda';
    const igpHoje = igps.length ? igps[igps.length-1].igp : null;
    const dmHoje = hist.find(d => d.date === today);
    const pseHoje   = dmHoje?.post?.pse    ?? null;
    const cargaHoje = dmHoje?.post?.carga  ?? null;
    const tempoHoje = dmHoje?.post?.tempo  ?? null;
    const qualHoje  = dmHoje?.post?.qualidade ?? null;
    return {
      id: a.id, nome: a.nome, posicao: a.posicao,
      igpHoje, statusHoje: classifyIGP(igpHoje),
      cargaTotal, tempoTotal, acwr, tendencia, alertaISPACWR,
      pseMedia, qualMedia, tempoMedia, sessoesDetalhes,
      dorRegioes: [...dorRegioes], dorDias,
      pseHoje, cargaHoje, tempoHoje, qualHoje,
    };
  });
}

// Determina o início da semana de treino atual (MD+1 ou última segunda-feira)
async function getInicioSemana(today) {
  // Helper: ISO week key "S29-2026"
  function _isoWkKey(dateStr) {
    const d = new Date(dateStr+'T12:00:00');
    const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
    t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
    const y1 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
    const wk = Math.ceil((((t-y1)/86400000)+1)/7);
    return `S${wk}-${t.getUTCFullYear()}`;
  }
  const matchDates = [];
  try {
    const d28ago = dateAgoISO(today, 28);
    const d14fte = (() => { const d = new Date(today+'T12:00:00'); d.setDate(d.getDate()+14); return d.toLocaleDateString('en-CA'); })();

    // 1. Lê jogos do Planejamento (assessments_planning) — semana atual e próxima
    const wkCurrent = _isoWkKey(today);
    const wkNext = _isoWkKey(d14fte);
    const planKeys = [...new Set([wkCurrent, wkNext])].map(wk => `${wk}_${clubId}`);
    const planSnaps = await Promise.all(planKeys.map(k => getDoc(doc(db,'assessments_planning',k)).catch(()=>null)));
    planSnaps.forEach(snap => {
      if (!snap?.exists()) return;
      (snap.data().jogos || []).forEach(j => {
        if (typeof j.data === 'string' && j.data >= d28ago && j.data <= d14fte && !matchDates.includes(j.data))
          matchDates.push(j.data);
      });
    });

    // 2. Complementa com scout_partidas (jogos já realizados)
    const scoutSnap = await getDocs(query(collection(db,'scout_partidas'), where('clubId','==',clubId)));
    scoutSnap.forEach(d => {
      const p = d.data();
      if (p.data?.toDate) p.data = p.data.toDate().toLocaleDateString('en-CA');
      if (typeof p.data === 'string' && p.data >= d28ago && p.data <= d14fte && !matchDates.includes(p.data))
        matchDates.push(p.data);
    });

    matchDates.sort((a,b) => a.localeCompare(b));
    const jogosPassados = matchDates.filter(d => d < today).sort((a,b) => b.localeCompare(a));

    if (jogosPassados.length) {
      const ultimoJogo = jogosPassados[0];
      const diff = Math.round((new Date(today+'T12:00:00') - new Date(ultimoJogo+'T12:00:00')) / 86400000);
      if (diff >= 1 && diff <= 6) {
        const ws = new Date(ultimoJogo+'T12:00:00');
        ws.setDate(ws.getDate()+1);
        return { inicio: ws.toISOString().slice(0,10), label: 'MD+1 (dia após último jogo)', matchDates };
      }
    }
  } catch(e) { console.warn('getInicioSemana:', e.message); }
  // Fallback: última segunda-feira
  const ref = new Date(today+'T12:00:00');
  const dow = ref.getDay();
  const diasAteSeg = dow === 0 ? 6 : dow - 1;
  const seg = new Date(ref.getTime() - diasAteSeg * 86400000);
  return { inicio: seg.toISOString().slice(0,10), label: 'Segunda-feira', matchDates };
}

async function getAptidaoJogoGrupo(janela = 7) {
  const today = getRefDate();
  const start = dateAgoISO(today, janela);
  const [athletes, metricsHoje, metricsJanela, medical, rtp] = await Promise.all([
    loadAthletes(), loadMetrics(today, today), loadMetrics(start, today), loadMedical(), loadRTP()
  ]);
  const athMapLocal = {};
  athletes.forEach(a => { athMapLocal[a.id] = a; });
  const statusMap = buildLatestInjuryStatus(medical, athMapLocal);

  // afastado = último status médico é 'afastado' (rotina não conta)
  const medicalOut = new Set(
    Object.values(statusMap).filter(r => r.status === 'afastado').map(r => r.id)
  );

  // rtpMap: ignora atletas cujo último status médico já é 'liberado' ou 'alta'
  const rtpMap = {};
  rtp.forEach(r => {
    if (!athMapLocal[r.athleteId]) return;
    const st = statusMap[r.athleteId]?.status || '';
    if (st === 'liberado' || st === 'alta') return; // liberado → sai do RTP ativo
    rtpMap[r.athleteId] = r.fase;
  });

  return athletes.map(a => {
    const dm = metricsHoje.find(m => m.athleteId === a.id);
    const hist = metricsJanela.filter(m => m.athleteId === a.id);
    const igp = dm ? calcIGP(dm.pre, dm.hrv, dm.neuro) : { global: null, IH:null, IA:null, INM:null, IC:null };
    const carga7d = hist.reduce((s,d)=>s+(d.post?.carga??0),0);
    const min7d   = hist.reduce((s,d)=>s+(d.post?.tempo??0),0);

    // Score de aptidão
    let score = 'Apto', obs = [];
    if (medicalOut.has(a.id)) { score = 'Afastado'; obs.push('Departamento médico'); }
    else {
      if (rtpMap[a.id] != null && rtpMap[a.id] < 4) { score = 'RTP'; obs.push(`Em RTP fase F${rtpMap[a.id]}`); }
      if (igp.global == null) { obs.push('Sem coleta hoje'); }
      else if (igp.global < 50) { score = 'Risco'; obs.push(`IGP crítico (${igp.global})`); }
      else if (igp.global < 65) { if(score==='Apto') score='Atenção'; obs.push(`IGP ${classifyIGP(igp.global)} (${igp.global})`); }

      const mediaHistCarga = hist.length ? hist.map(d=>d.post?.carga??0).reduce((a,b)=>a+b,0)/hist.length*7 : null;
      if (mediaHistCarga && carga7d > mediaHistCarga * 1.3) { if(score==='Apto') score='Atenção'; obs.push(`Carga semanal elevada (${carga7d} UA, +30% acima da média)`); }
      if (min7d > 420) { if(score==='Apto') score='Atenção'; obs.push(`Minutagem elevada (${min7d} min na semana)`); }
    }

    const minSeguros = igp.global == null ? null : igp.global >= 70 ? 90 : igp.global >= 60 ? 70 : igp.global >= 50 ? 45 : 0;
    const dor = dm?.pre?.regioes_dor?.length > 0;
    const pseHoje = dm?.post?.pse ?? null;

    return { id: a.id, nome: a.nome, posicao: a.posicao, igp: igp.global, status: classifyIGP(igp.global), score, obs, carga7d, min7d, minSeguros, dor, pseHoje, emRTP: rtpMap[a.id] != null && rtpMap[a.id] < 4 };
  });
}

async function getResumoSemanal() {
  const today = getRefDate();
  const start = dateAgoISO(today, 7);
  const [athletes, metrics] = await Promise.all([loadAthletes(), loadMetrics(start, today)]);

  const atletaMap = {};
  athletes.forEach(a => { atletaMap[a.id] = a.nome; });

  // IGP médio por atleta
  const porAtleta = {};
  metrics.forEach(dm => {
    if (!porAtleta[dm.athleteId]) porAtleta[dm.athleteId] = [];
    const igp = calcIGP(dm.pre, dm.hrv, dm.neuro).global;
    if (igp != null) porAtleta[dm.athleteId].push({ date: dm.date, igp, carga: dm.post?.carga??0 });
  });

  const resumo = Object.entries(porAtleta).map(([id, dias]) => {
    dias.sort((a,b)=>a.date.localeCompare(b.date));
    const igps = dias.map(d=>d.igp);
    const mediaIGP = igps.reduce((a,b)=>a+b,0)/igps.length;
    const primeiro = igps[0], ultimo = igps[igps.length-1];
    const delta = ultimo - primeiro;
    const cargaTotal = dias.reduce((s,d)=>s+d.carga,0);
    return { id, nome: atletaMap[id]||id, mediaIGP: Math.round(mediaIGP), delta: Math.round(delta), dias: dias.length, cargaTotal };
  });

  resumo.sort((a,b) => b.mediaIGP - a.mediaIGP);
  const mediaGrupo = resumo.length ? resumo.reduce((s,a)=>s+a.mediaIGP,0)/resumo.length : null;
  const melhora = resumo.filter(a=>a.delta > 5).sort((a,b)=>b.delta-a.delta);
  const queda   = resumo.filter(a=>a.delta < -5).sort((a,b)=>a.delta-b.delta);
  return { mediaGrupo: mediaGrupo!=null ? Math.round(mediaGrupo) : null, atletas: resumo, melhora, queda };
}

async function getStatusRTP() {
  const [athletes, medical, rtp] = await Promise.all([loadAthletes(), loadMedical(), loadRTP()]);
  const athMap = {};
  athletes.forEach(a => { athMap[a.id] = a; });

  // Status atual de cada atleta = registro de LESÃO mais recente (atendimentos de rotina ignorados)
  const statusMap = buildLatestInjuryStatus(medical, athMap);

  const afastados = Object.values(statusMap)
    .filter(r => r.status === 'afastado' || r.status === 'transicao')
    .map(r => ({
      id: r.id,
      nome: athMap[r.id].nome,
      tipo: r.record.dados?.tipoLesao || r.record.dados?.tipoAtendimento || '—',
      regiao: r.record.dados?.regiao || '—',
      status: r.status,
      data: r.record.data || '—'
    }));

  const historico = Object.values(statusMap)
    .filter(r => r.status === 'liberado' || r.status === 'alta')
    .map(r => ({
      id: r.id,
      nome: athMap[r.id].nome,
      tipo: r.record.dados?.tipoLesao || r.record.dados?.tipoAtendimento || '—',
      regiao: r.record.dados?.regiao || '—',
      data: r.record.data || '—',
      dataAlta: r.record.dados?.dataAlta || '—'
    }));

  // rtpFases: ignora atletas cujo último status médico já é 'liberado' ou 'alta'
  // (rtp_progress pode ter dados desatualizados se não foi zerado após a liberação)
  const rtpFases = rtp
    .filter(r => {
      if (!athMap[r.athleteId]) return false;
      const st = statusMap[r.athleteId]?.status || '';
      return st !== 'liberado' && st !== 'alta'; // liberado medicamente → sai do RTP ativo
    })
    .map(r => ({ id: r.athleteId, nome: athMap[r.athleteId].nome, fase: r.fase, label: ['Afastado','Recondicionamento','Treino Adaptado','Treino Coletivo','Liberado'][r.fase] || '—' }));

  return { afastados, rtpFases, historico, totalFora: afastados.length };
}

async function getQueixasMedicas(janela = 7) {
  const today = getRefDate();
  const start = dateAgoISO(today, janela);
  const [athletes, metrics, medical] = await Promise.all([loadAthletes(), loadMetrics(start, today), loadMedical()]);
  const athMap = {};
  athletes.forEach(a => { athMap[a.id] = a.nome; });

  // Queixas do mapa corporal (pré-coleta) — apenas atletas ativos
  const dorMap = {};
  metrics.forEach(dm => {
    if (!athMap[dm.athleteId]) return; // ignora atletas inativos
    const regioes = dm.pre?.regioes_dor || [];
    if (!regioes.length) return;
    if (!dorMap[dm.athleteId]) dorMap[dm.athleteId] = { dias: [], regioes: new Set() };
    dorMap[dm.athleteId].dias.push(dm.date);
    regioes.forEach(r => dorMap[dm.athleteId].regioes.add(r));
  });

  // Atendimentos médicos recentes — apenas atletas ativos
  const atendimentos = medical.filter(m => m.data >= start && m.data <= today && m.dados?.tipoRegistro === 'atendimento' && athMap[m.athleteId])
    .map(m => ({ id: m.athleteId, nome: athMap[m.athleteId], queixa: m.dados?.queixa||'—', conduta: m.dados?.conduta||'—', data: m.data }));

  const queixas = Object.entries(dorMap).map(([id, v]) => ({
    id, nome: athMap[id],
    regioes: [...v.regioes].join(', '),
    dias: v.dias.length,
    recorrente: v.dias.length >= 3
  }));

  return { queixas, atendimentos };
}

  // ── Posse de bola por setor (salvo no documento principal) ─────────────────
  const posseSetor = p.possePorSetor || null; // { america: {defesa,meio,ataque}, adv: {...} }
  const acoesPorSetor = p.acoesPorSetor || null; // { defesa, meio, ataque }

  // Posse % total — denominador = tempo de bola em jogo (posseAm + posseAdv)
  // Bola parada (faltas, laterais, etc.) não conta para nenhum time: excluída do total.
  // Referência: definição FIFA/UEFA de posse = % do tempo de jogo efetivo com bola.
  // Posse total: calculada dos eventos "Troca de posse" (possePorSetor guarda % por zona, não total)
  const durSec = p.duracaoSegundos || 0;
  const posseAmPct = durSec > 0 ? calcPosseFromEvts(events, durSec) : null;
  const pctAm  = posseAmPct ?? 50;
  const pctAdv = 100 - pctAm;

  // Distribuição por zona: possePorSetor.america já é { defesa, meio, ataque } em % da posse do time
  const posseZona = posseSetor?.america ? {
    defesa: posseSetor.america.defesa ?? 33,
    meio:   posseSetor.america.meio   ?? 33,
    ataque: posseSetor.america.ataque ?? 33,
  } : null;

  // ── Bolas paradas (apenas finalizações — não temos origem de gol registrada) ──
  const evParada  = events.filter(e => e.posse === 'parada');
  const finParadaPro  = evParada.filter(e => e.action === 'Finalização' || e.action === 'Chance clara criada').length;
  const finParadaAdv  = evParada.filter(e => e.action === 'Finalização adversária').length;

  // ── Duelos ────────────────────────────────────────────────────────────────
  const evDuelos = events.filter(e => e.action?.startsWith('Duelo'));
  const duelos = {
    ganhoAlto:   evDuelos.filter(e => e.action === 'Duelo ganho (alto)').length,
    ganhoChao:   evDuelos.filter(e => e.action === 'Duelo ganho (chão)').length,
    perdidoAlto: evDuelos.filter(e => e.action === 'Duelo perdido (alto)').length,
    perdidoChao: evDuelos.filter(e => e.action === 'Duelo perdido (chão)').length,
    porSetor: {
      defesa: { ganho: evDuelos.filter(e => e.sector==='defesa' && e.action?.includes('ganho')).length, perdido: evDuelos.filter(e => e.sector==='defesa' && e.action?.includes('perdido')).length },
      meio:   { ganho: evDuelos.filter(e => e.sector==='meio'   && e.action?.includes('ganho')).length, perdido: evDuelos.filter(e => e.sector==='meio'   && e.action?.includes('perdido')).length },
      ataque: { ganho: evDuelos.filter(e => e.sector==='ataque' && e.action?.includes('ganho')).length, perdido: evDuelos.filter(e => e.sector==='ataque' && e.action?.includes('perdido')).length },
    }
  };
  duelos.totalGanho  = duelos.ganhoAlto + duelos.ganhoChao;
  duelos.totalPerdido= duelos.perdidoAlto + duelos.perdidoChao;

  // ── Ações ofensivas / defensivas por zona ─────────────────────────────────
  const acoesAm = acoesPorSetor || { defesa: 0, meio: 0, ataque: 0 };

  // ── Gols (quem marcou) ────────────────────────────────────────────────────
  const golsEv = events.filter(e => e.action === 'Gol Pró' && e.athleteId);
  const assistEv = events.filter(e => e.action === 'Assistência' && e.athleteId);

  // ── Desempenho individual ─────────────────────────────────────────────────
  const perAtleta = {};
  events.forEach(ev => {
    if (!ev.athleteId || !ev.action) return;
    if (!perAtleta[ev.athleteId]) perAtleta[ev.athleteId] = { acoes: 0, score: 0, actions: {} };
    const w = WEIGHTS[ev.action] ?? 0;
    perAtleta[ev.athleteId].score += w;
    perAtleta[ev.athleteId].acoes++;
    perAtleta[ev.athleteId].actions[ev.action] = (perAtleta[ev.athleteId].actions[ev.action]||0)+1;
  });

  const destaques = Object.entries(perAtleta)
    .map(([id,v]) => ({
      id, nome: athMap[id]?.nome||id, posicao: athMap[id]?.posicao||'—',
      score: parseFloat(v.score.toFixed(1)), acoes: v.acoes,
      top: Object.entries(v.actions).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,c])=>`${k}×${c}`).join(', ')
    }))
    .sort((a,b) => b.score - a.score);

  const fatorConfianca = events.filter(e => e.athleteId).length;

  return {
    adversario: p.adversario||'Adversário',
    data: fmtDate(p.data||''),
    placar: `${p.placar?.pro??0}×${p.placar?.contra??0}`,
    local: p.local||'—',
    totalEventos: events.length,
    fatorConfianca,
    confiancaBaixa: fatorConfianca < 30,
    // Posse
    posse: { am: pctAm, adv: pctAdv, zona: posseZona },
    // Bolas paradas
    bolasParadas: { finPro: finParadaPro, finAdv: finParadaAdv, totalEventos: evParada.length },
    // Duelos
    duelos,
    // Ações por zona
    acoesZona: acoesAm,
    // Gols
    gols: golsEv.map(e => athMap[e.athleteId]?.nome||e.athleteId),
    assistencias: assistEv.map(e => athMap[e.athleteId]?.nome||e.athleteId),
    // Individual
    destaques,
  };
}

async function getDesempenhoJogo() {
  const partidas = await loadScoutMatches(1);
  if (!partidas.length) return null;
  const p = partidas[0];
  const events = await loadMatchEventsFull(p);
  const athletes = await loadAthletes();
  const athMap = Object.fromEntries(athletes.map(a => [a.id, { nome: a.nome, posicao: a.posicao }]));

  // Posse total: calculada dos eventos "Troca de posse" (possePorSetor guarda % por zona, não total)
  const posseSetor = p.possePorSetor || null;
  const acoesPorSetor = p.acoesPorSetor || null;
  const durSec2 = p.duracaoSegundos || 0;
  const posseAmPct2 = durSec2 > 0 ? calcPosseFromEvts(events, durSec2) : null;
  const pctAm  = posseAmPct2 ?? 50;
  const pctAdv = 100 - pctAm;
  const posseZona = posseSetor?.america ? {
    defesa: posseSetor.america.defesa ?? 33,
    meio:   posseSetor.america.meio   ?? 33,
    ataque: posseSetor.america.ataque ?? 33,
  } : null;

  // Duelos
  const evDuelos = events.filter(e => e.action?.startsWith('Duelo'));
  const dG = evDuelos.filter(e => e.action?.includes('ganho'));
  const dP = evDuelos.filter(e => e.action?.includes('perdido'));
  const setorDuelo = (sector, tipo) => evDuelos.filter(e => e.sector===sector && e.action?.includes(tipo)).length;
  const dueloPeriodo = ['0–15','15–30','30–45','45–60','60–75','75–90+'].map((lbl, i) => {
    const s0 = i * 900, s1 = i === 5 ? Infinity : (i+1)*900;
    const seg = evDuelos.filter(e => e.seconds != null && e.seconds >= s0 && e.seconds < s1);
    return { lbl, g: seg.filter(e=>e.action?.includes('ganho')).length, p: seg.filter(e=>e.action?.includes('perdido')).length };
  });

  // Roubadas
  const ROUBADAS = ['Roubada (combate)','Roubada (pressão ofensiva)','Roubada (pós-perda)'];
  const evRoubadas = events.filter(e => ROUBADAS.includes(e.action));

  // Roubadas por setor
  const roubadasPorSetor = {
    defesa: evRoubadas.filter(e => e.sector === 'defesa').length,
    meio:   evRoubadas.filter(e => e.sector === 'meio').length,
    ataque: evRoubadas.filter(e => e.sector === 'ataque').length,
  };

  // Finalizações
  const evFin    = events.filter(e => e.action === 'Finalização');
  const evFinAdv = events.filter(e => e.action === 'Finalização adversária');

  // Entradas no último terço: "Troca de setor" com meta.para === 'ataque'
  const entradasUltimoTerco = events.filter(e => e.action === 'Troca de setor' && e.meta?.para === 'ataque').length;

  // Outros agregados
  const totalChancasClaras = events.filter(e => e.action === 'Chance clara criada').length;
  const amarelos  = events.filter(e => e.action === 'Cartão Amarelo').length;
  const vermelhos = events.filter(e => e.action === 'Cartão Vermelho').length;

  // Rankings individuais
  const perAtleta = {};
  events.forEach(ev => {
    if (!ev.athleteId) return;
    if (!perAtleta[ev.athleteId]) perAtleta[ev.athleteId] = { dG:0,dP:0,roubadas:0,fin:0,passesChave:0,gols:0,assist:0,erros:0 };
    const s = perAtleta[ev.athleteId];
    if (ev.action?.includes('Duelo') && ev.action?.includes('ganho'))   s.dG++;
    if (ev.action?.includes('Duelo') && ev.action?.includes('perdido')) s.dP++;
    if (ROUBADAS.includes(ev.action))     s.roubadas++;
    if (ev.action === 'Finalização')      s.fin++;
    if (ev.action === 'Passe-chave')      s.passesChave++;
    if (ev.action === 'Gol Pró')          s.gols++;
    if (ev.action === 'Assistência')      s.assist++;
    if (ev.action === 'Erro NF' || ev.action === 'Erro pressão') s.erros++;
  });
  const rank = (metric, n=3) => Object.entries(perAtleta)
    .filter(([,v]) => v[metric] > 0)
    .map(([id,v]) => ({ nome: athMap[id]?.nome||id, posicao: athMap[id]?.posicao||'—', val: v[metric] }))
    .sort((a,b) => b.val-a.val).slice(0,n);

  // Minutagem (para gráficos)
  const durSec = p.duracaoSegundos || 0;
  const athMapMin = Object.fromEntries(athletes.map(a => [a.id, a]));
  const minutagem = [];
  if (p.playedSeconds) {
    Object.entries(p.playedSeconds).forEach(([id, val]) => {
      const raw = typeof val === 'object' ? (val.seconds ?? 0) : (typeof val === 'number' ? val : 0);
      const secs = durSec > 0 ? Math.min(raw, durSec) : raw;
      if (secs <= 0) return;
      const nomeSnap = typeof val === 'object' ? (val.athleteName || null) : null;
      const athLocal = athMapMin[id];
      minutagem.push({ nome: nomeSnap || athLocal?.nome || id, posicao: athLocal?.posicao || p.perfSnapshot?.[id]?.posicao || '—', min: Math.round(secs / 60) });
    });
    minutagem.sort((a, b) => b.min - a.min);
  }

  return {
    adversario: p.adversario||'Adversário',
    data: fmtDate(p.data||''), local: p.local||'—',
    placar: `${p.placar?.pro??0}×${p.placar?.contra??0}`,
    confiancaBaixa: events.filter(e=>e.athleteId).length < 30,
    totalEventos: events.length,
    _events: events, _partida: p, minutagem,
    posse: { am: pctAm, adv: pctAdv, zona: posseZona },
    acoesZona: acoesPorSetor,
    duelos: {
      g: dG.length, p: dP.length,
      gAlto: dG.filter(e=>e.action.includes('alto')).length,
      pAlto: dP.filter(e=>e.action.includes('alto')).length,
      gChao: dG.filter(e=>e.action.includes('Chão')||e.action.includes('chão')).length,
      pChao: dP.filter(e=>e.action.includes('Chão')||e.action.includes('chão')).length,
      porSetor: {
        defesa: { g: setorDuelo('defesa','ganho'), p: setorDuelo('defesa','perdido') },
        meio:   { g: setorDuelo('meio','ganho'),   p: setorDuelo('meio','perdido') },
        ataque: { g: setorDuelo('ataque','ganho'), p: setorDuelo('ataque','perdido') },
      },
      periodo: dueloPeriodo,
      comTiming: evDuelos.filter(e=>e.seconds!=null).length,
    },
    roubadas: evRoubadas.length,
    roubadasPorSetor,
    finalizacoes: { pro: evFin.length, adv: evFinAdv.length },
    entradasUltimoTerco,
    chancesClaras: totalChancasClaras,
    cartoes: { amarelos, vermelhos },
    rankDuelosG:  rank('dG'),
    rankRoubadas: rank('roubadas'),
    rankFin:      rank('fin'),
    rankGols:     rank('gols'),
    rankAssist:   rank('assist'),
    rankErros:    rank('erros', 5),
  };
}

function detectIntent(text) {
  const t = text.toLowerCase();
  if (/como est[aá] o grupo|resumo do dia|grupo hoje|elenco hoje|como o elenco/.test(t)) return 'resumo_dia';
  if (/precisa de aten[çc][aã]o|minutagem|intensidade|carga mec[aâ]nica/.test(t)) return 'atencao_carga';
  if (/em aten[çc][aã]o/.test(t)) return 'atletas_atencao';
  if (/adaptando|adapta[çc][aã]o.*carga|pior.*carga|se adaptando/.test(t)) return 'adaptacao_carga';
  if (/duelos.*jogo|estat.*jogo|desempenho.*equipe.*jogo|como foi.*equipe.*jogo/.test(t)) return 'desempenho_jogo';
  if (/como foi o jogo|desempenho.*jogo|resultado do jogo|desempenho.*equipe/.test(t)) return 'resumo_jogo';
  if (/recuperado|recupera[çc][aã]o|p[oó]s.?jogo/.test(t)) return 'recuperacao';
  if (/semana.*evolui|resumo.*semana|como o grupo.*semana|evolu[iu].*semana/.test(t)) return 'resumo_semana';
  if (/melhorando|quem melhora/.test(t)) return 'melhora';
  if (/disponibilidade.*posi[çc][aã]o|posi[çc][aã]o.*disponib/.test(t)) return 'disponibilidade_posicao';
  if (/estado.*jogo|apto.*jogo|jogo de hoje/.test(t)) return 'aptidao_jogo';
  if (/jogar|escalar|titular|banco|apto|pode jogar/.test(t)) return 'aptidao_jogo';
  if (/departamento m[eé]dico|situa[çc][aã]o.*m[eé]dic|lesionado|afastado|transi[çc][aã]o/.test(t)) return 'dept_medico';
  if (/atendimento.*rotina|procurou atendimento|rotina.*dias/.test(t)) return 'atendimento_rotina';
  if (/queixas|reclama[çc][oõ]e|dor.*elenco|desconforto/.test(t)) return 'queixas';
  if (/carga reduzida|menor carga/.test(t)) return 'carga_reduzida';
  if (/treinar completo|treino completo/.test(t)) return 'aptidao_treino';
  if (/carga.*treino|treino de hoje|como foi.*treino/.test(t)) return 'resumo_treino';
  if (/evolu[çc][aã]o.*atleta|histórico.*atleta|desde.*primeira coleta/.test(t)) return 'atleta_evolucao';
  if (/les[aã]o|les[oõ]e|antes.*les|padr[aã]o.*risco/.test(t)) return 'atleta_lesoes';
  if (/for[çc]a|INM|CMJ|neuromuscular.*evolu/.test(t)) return 'atleta_inm';
  if (/responde.*carga|resposta.*carga|recupera.*carga/.test(t)) return 'atleta_carga';
  if (/minutagem.*jogo|jogo.*minutos|performance.*jogo/.test(t)) return 'atleta_jogos';
  return 'free';
}

async function buildContext(intent) {
  _chartData = null;
  const today = getRefDate();
  const dados = [];
  let alertas = [];

  // Mapeamento de briefing intents para intents base + contexto extra
  let _briefingExtra = null;
  if (intent === 'briefing_pretreino') { _briefingExtra = 'adaptacao_carga'; intent = 'resumo_dia'; }
  else if (intent === 'briefing_postreino') { intent = 'resumo_treino'; }
  else if (intent === 'briefing_prejogo')   { intent = 'aptidao_jogo'; }
  else if (intent === 'briefing_posjogo')   { _briefingExtra = 'recuperacao'; intent = 'resumo_jogo'; }
  else if (intent === 'briefing_semana')    { _briefingExtra = 'adaptacao_carga'; intent = 'resumo_semana'; }
  else if (intent === 'briefing_medico')    { _briefingExtra = 'queixas'; intent = 'dept_medico'; }
  else if (intent === 'briefing_atleta')    { intent = 'atleta_evolucao'; }

  // Build filter summary header
  const cat = getFilterCategoria(), pos = getFilterPosicao(), athId = getFilterAtleta();
  const athName = athId ? (_athletesAll||[]).find(a=>a.id===athId)?.nome || '' : '';
  const filtroInfo = [
    `Data de referência: ${fmtDate(today)}`,
    cat ? `Categoria: ${cat}` : 'Categoria: Todas',
    pos ? `Posição: ${pos}` : 'Posição: Todas',
    athName ? `Atleta: ${athName}` : 'Atleta: Todos'
  ].join(' | ');
  let ctx = `=== ESCOPO DA CONSULTA ===\n${filtroInfo}\n\n`;

  // Atenção por carga, minutagem e ACWR (combina resumo dia + adaptação + aptidão)
  if (intent === 'atencao_carga') {
    const [r, adapt, aptidao] = await Promise.all([
      getResumoDia(today), getAdaptacaoCarga(7), getAptidaoJogoGrupo(7)
    ]);
    dados.push(`getResumoDia(${today})`, 'getAdaptacaoCarga(7d)', 'getAptidaoJogoGrupo(7d)');
    ctx += `=== ATLETAS EM ATENÇÃO — CARGA, MINUTAGEM E RECUPERAÇÃO (${fmtDate(today)}) ===\n`;
    ctx += `Contexto: atletas que precisam de redução de minutagem, intensidade ou carga mecânica.\n\n`;
    const emAtencao = r.atletas.filter(a => (a.igp != null && a.igp < 70) || a.dor?.length);
    if (!emAtencao.length) {
      ctx += 'Nenhum atleta em atenção hoje com coleta registrada.\n';
    } else {
      const _fmtIndsLocal = a => {
        const parts = [];
        if (a.IH  != null) parts.push(`IH(Hooper)=${a.IH}(${classifyIGP(a.IH)})`);
        if (a.IA  != null) parts.push(`IA(HRV)=${a.IA}(${classifyIGP(a.IA)})`);
        if (a.INM != null) parts.push(`INM(CMJ)=${a.INM}(${a.INM>=60?'Estável':a.INM>=50?'At.Leve':a.INM>=40?'Atenção':'Crítico'})`);
        if (a.IC  != null) parts.push(`IC(Neuro)=${a.IC}(${classifyIGP(a.IC)})`);
        return parts.length ? parts.join(' | ') : 'indicadores: sem dados';
      };
      emAtencao.sort((a,b) => (a.igp??99) - (b.igp??99)).forEach(a => {
        const adap = adapt.find(x => x.id === a.id);
        const apt  = aptidao.find(x => x.id === a.id);
        ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp ?? 'sem coleta'} — ${a.status}\n`;
        ctx += `  ${_fmtIndsLocal(a)}\n`;
        if (adap && !adap.semDados) ctx += `  ACWR: ${adap.acwr ?? '—'} | Tendência: ${adap.tendencia} | Carga 7d: ${adap.cargaTotal} UA\n`;
        if (apt) { ctx += `  Minutagem 7d: ${apt.min7d} min`; if (apt.obs.length) ctx += ` | ${apt.obs.join('; ')}`; ctx += '\n'; }
        if (a.dor?.length) ctx += `  ⚠ Queixa de dor: ${a.dor.join(', ')}\n`;

    ctx += `\nSEM COLETA HOJE (${r.atletas.filter(a=>a.igp==null).length} atletas): ${r.atletas.filter(a=>a.igp==null).map(a=>a.nome).join(', ') || 'nenhum'}\n`;

  // Disponibilidade por posição
  if (intent === 'disponibilidade_posicao') {

        ctx += `  • ${a.nome} | IGP ${a.igp ?? '—'} — ${a.status} | ${a.score}`;

    const inapt = lista.filter(a=>a.score==='Afastado'||a.score==='RTP').length;
    ctx += `\nRESUMO: ${aptos} aptos | ${lista.filter(a=>a.score==='Atenção').length} atenção | ${inapt} indisponíveis\n`;
  }

  // Atendimentos de rotina (últimos 7 dias)
  if (intent === 'atendimento_rotina') {
    const q = await getQueixasMedicas(7);
    dados.push('getQueixasMedicas(7 dias)');
    ctx += `=== ATENDIMENTOS DE ROTINA — ÚLTIMOS 7 DIAS ===\n`;
    ctx += `DORES RELATADAS (pré-coleta):\n`;
    q.queixas.forEach(a => { ctx += `• ${a.nome} | Regiões: ${a.regioes} | ${a.dias} dia(s)${a.recorrente ? ' — RECORRENTE ⚠' : ''}\n`; });
    if (!q.queixas.length) ctx += `Nenhuma queixa de dor registrada\n`;
    ctx += `\nATENDIMENTOS MÉDICOS:\n`;

    if (!q.atendimentos.length) ctx += `Nenhum atendimento registrado\n`;
  }

  // Intents pré-treino
  if (['resumo_dia','atletas_atencao','aptidao_treino','carga_reduzida'].includes(intent)) {
    const [r, adapt] = await Promise.all([
      getResumoDia(today),
      getAdaptacaoCarga(7)
    ]);
    dados.push(`getResumoDia(${today})`, 'getAdaptacaoCarga(7d)');

    // Métricas do grupo para card visual (só para intents de briefing de grupo)
    if (['resumo_dia','atletas_atencao'].includes(intent)) {
      try {
        const _igpValidos = r.atletas.filter(a => a.igp != null && a.statusMed !== 'afastado');
        const _igpMedio = _igpValidos.length
          ? Math.round(_igpValidos.reduce((s, a) => s + a.igp, 0) / _igpValidos.length)
          : null;
        // Médias por posição (IH/IA/INM/IC)
        const _POS_GRUPOS = {
          'Goleiro':        ['GOLEIRO','GR','GOL'],
          'Zagueiro':       ['ZAGUEIRO','ZAG','ZAGUEIRO CENTRAL'],
          'Lateral':        ['LATERAL','LAT','LATERAL DIR','LATERAL ESQ','LATERAL DIREITO','LATERAL ESQUERDO'],
          'Volante':        ['VOLANTE','VOL','PRIMEIRO VOLANTE','SEGUNDO VOLANTE'],
          'Meia':           ['MEIA','MEI','MEIA DIR','MEIA ESQ','MEIA CENTRAL','MEIA-ATACANTE','ARMADOR','TREQUARTISTA'],
          'Ponta':          ['PONTA','EXTREMO','ALA','PONTA DIR','PONTA ESQ','SEGUNDO ATACANTE','SEGUNDA PONTA'],
          'Centro-avante':  ['CENTROAVANTE','ATACANTE','ATA','CA','CENTRO AVANTE','CENTRO-AVANTE','CENTRO AVANTE','CENTROAVANTE'],
        };
        const _posMedia = (grupo) => {
          const atlPos = r.atletas.filter(a => {
            const pos = (a.posicao||'').toUpperCase().trim();
            return grupo.some(g => pos === g || pos.includes(g));
          });
          const avg = (key) => {
            const vals = atlPos.map(a => a[key]).filter(v => v != null);
            return vals.length ? Math.round(vals.reduce((s,v)=>s+v,0)/vals.length) : null;
          };
          const igpVals = atlPos.map(a=>a.igp).filter(v=>v!=null);
          // Per-indicator reference: athletes missing that indicator today but having it from earlier this week
          const avgRef = (key) => {
            const vals = atlPos
              .filter(a => a[key] == null && a.refSemana?.[key] != null)
              .map(a => a.refSemana[key]);
            return vals.length ? Math.round(vals.reduce((s,v)=>s+v,0)/vals.length) : null;
          };
          const refDateFor = (key) => {
            const dates = atlPos
              .filter(a => a[key] == null && a.refSemana?.[key] != null)
              .map(a => a.refSemana.date).filter(Boolean);
            return dates.length ? dates.sort().reverse()[0] : null;
          };
          const refIH = avgRef('IH'), refIA = avgRef('IA'), refINM = avgRef('INM'), refIC = avgRef('IC');
          const ref = (refIH != null || refIA != null || refINM != null || refIC != null)
            ? { IH: refIH, dateIH: refDateFor('IH'), IA: refIA, dateIA: refDateFor('IA'), INM: refINM, dateINM: refDateFor('INM'), IC: refIC, dateIC: refDateFor('IC') }
            : null;
          return atlPos.length ? { n: atlPos.length, igp: igpVals.length ? Math.round(igpVals.reduce((s,v)=>s+v,0)/igpVals.length) : null, IH: avg('IH'), IA: avg('IA'), INM: avg('INM'), IC: avg('IC'), ref } : null;
        };
        const _porPosicao = {};
        for (const [nome, abrevs] of Object.entries(_POS_GRUPOS)) _porPosicao[nome] = _posMedia(abrevs);

        _metricasGrupoCache = await getMediasGrupo(today, r.atletas);
        if (_metricasGrupoCache) {
          _metricasGrupoCache.igpMedioHoje = _igpMedio;
          _metricasGrupoCache.dist = r.dist;
          _metricasGrupoCache.totalAtletas = r.total;
          _metricasGrupoCache.porPosicao = _porPosicao;
          _metricasGrupoCache.atletasDor = r.atletas.filter(a => a.dorNumerico != null);
        }
      } catch(e) {
        console.warn('[getMediasGrupo] erro:', e.message);
        _metricasGrupoCache = null;
      }
    }

    // Índice de carga por atleta
    const cargaMap = {};
    adapt.forEach(a => { if (!a.semDados) cargaMap[a.id] = a; });

    // Cobertura de dados por indicador (para bloco de confiança)
    const comColeta = r.atletas.filter(a => a.igp != null);
    const comIH  = comColeta.filter(a => a.IH  != null).length;
    const comIA  = comColeta.filter(a => a.IA  != null).length;
    const comINM = comColeta.filter(a => a.INM != null).length;
    const comIC  = comColeta.filter(a => a.IC  != null).length;

    ctx += `=== RESUMO PRÉ-TREINO (${fmtDate(today)}) ===\n`;
    ctx += `Elenco: ${r.total} atletas | Com coleta hoje: ${r.comColeta} | Sem coleta: ${r.dist.semColeta}\n`;
    ctx += `Cobertura de indicadores (atletas com dado hoje): Hooper/Subjetivo=${comIH} | HRV/Autonômico=${comIA} | CMJ/Neuromuscular=${comINM} | NeuroScore/Cognitivo=${comIC}\n`;
    ctx += `INSTRUÇÃO: Esta análise é sobre TREINO, não jogo. Use linguagem de prontidão para treino (ex: "treino completo", "carga reduzida", "preservar", "proteger"). Não mencione disponibilidade para partida.\n\n`;

    // Helper: formata todos os indicadores disponíveis de um atleta
    const fmtInds = a => {
      const parts = [];
      if (a.IH  != null) parts.push(`IH(Hooper)=${a.IH}(${classifyIGP(a.IH)})`);
      if (a.IA  != null) parts.push(`IA(HRV)=${a.IA}(${classifyIGP(a.IA)})`);
      if (a.INM != null) parts.push(`INM(CMJ)=${a.INM}(${a.INM>=60?'Estável':a.INM>=50?'At.Leve':a.INM>=40?'Atenção':'Crítico'})`);
      if (a.IC  != null) parts.push(`IC(Neuro)=${a.IC}(${classifyIGP(a.IC)})`);
      return parts.length ? parts.join(' | ') : 'indicadores: sem dados';
    };

    // Tier 1: CRÍTICO (IGP < 50, disponíveis)
    const _fmtDor = (a) => {
      if (!a.dor?.length && a.dorNumerico == null) return '';
      const regioes = (a.dor || []).filter(r => r && !r.includes('acompanhamento'));
      const semLocal = a.dorNumerico != null && !regioes.length;
      const regiaoStr = regioes.length ? regioes.join(', ') : 'sem localização definida';
      const numStr = a.dorNumerico != null ? ` | intensidade ${a.dorNumerico}/7` : '';
      return `Dor: ${regiaoStr}${numStr}`;
    };

    const criticos = r.atletas.filter(a => a.igp != null && a.igp < 50 && a.statusMed === 'livre');
    if (criticos.length) {
      ctx += `--- CRÍTICO (${criticos.length}) ---\n`;
      criticos.sort((a,b)=>a.igp-b.igp).forEach(a => {
        const c = cargaMap[a.id];
        ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp}\n`;
        ctx += `  ${fmtInds(a)}\n`;
        const dorStr = _fmtDor(a); if (dorStr) ctx += `  ${dorStr}\n`;
        if (c) ctx += `  Carga 7d: ${c.cargaTotal}UA | ACWR: ${c.acwr??'—'} | Tendência IGP: ${c.tendencia}\n`;
      });
    }

    // Tier 2: ATENÇÃO (IGP 50-59, disponíveis)
    const atencao = r.atletas.filter(a => a.igp != null && a.igp >= 50 && a.igp < 60 && a.statusMed === 'livre');
    if (atencao.length) {
      ctx += `\n--- ATENÇÃO (${atencao.length}) ---\n`;
      atencao.sort((a,b)=>a.igp-b.igp).forEach(a => {
        const c = cargaMap[a.id];
        ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp}\n`;
        ctx += `  ${fmtInds(a)}\n`;
        const dorStr = _fmtDor(a); if (dorStr) ctx += `  ${dorStr}\n`;
        if (c?.acwr) ctx += `  ACWR: ${c.acwr} | Tendência: ${c.tendencia}\n`;
      });
    }

    // Tier 3: ATENÇÃO LEVE (IGP 60-69, disponíveis)
    const atLeve = r.atletas.filter(a => a.igp != null && a.igp >= 60 && a.igp < 70 && a.statusMed === 'livre');
    if (atLeve.length) {
      ctx += `\n--- ATENÇÃO LEVE (${atLeve.length}) ---\n`;
      atLeve.forEach(a => {
        ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp}`;

        const dorStr = _fmtDor(a); if (dorStr) ctx += ` | ${dorStr}`;
        ctx += '\n';
      });
    }

    // ISP em queda: estáveis mas com tendência de queda semanal
    const ispQueda = r.atletas.filter(a => a.igp != null && a.igp >= 70 && a.statusMed === 'livre' && cargaMap[a.id]?.tendencia === 'Queda');
    if (ispQueda.length) {
      ctx += `\n--- ISP EM QUEDA (${ispQueda.length}) — IGP ainda ok mas tendência negativa ---\n`;
      ispQueda.forEach(a => {
        const c = cargaMap[a.id];
        ctx += `• ${a.nome} (${a.posicao}) | IGP ${a.igp} | ACWR: ${c?.acwr??'—'} | Carga 7d: ${c?.cargaTotal??'—'}UA\n`;
        const dorStr = _fmtDor(a); if (dorStr) ctx += `  ${dorStr}\n`;

    }

    // Tier 4: TRANSIÇÃO
    const transicao = r.atletas.filter(a => a.statusMed === 'transicao');

    // Tier 5: AFASTADO

    if (afastados.length) {
      ctx += `\n--- AFASTADOS (${afastados.length}) ---\n`;

    // Tier 6: ESTÁVEL (breve — sem detalhes individuais para não poluir contexto)
    const estaveis = r.atletas.filter(a => a.igp != null && a.igp >= 70 && a.statusMed === 'livre');
