<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Suspensões / Cartões • Ciente IE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; }
    .input-field {
      background: #f8fafc; border: 1px solid #e2e8f0; color: #1e293b;
      border-radius: 8px; padding: 8px 12px; width: 100%; outline: none; font-size: 14px;
    }
    .input-field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .btn-primary { background: #2563eb; color: #fff; border-radius: 10px; padding: 9px 18px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; transition: background .15s; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-sm { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: background .15s; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid #e2e8f0; background: #f8fafc; }
    td { padding: 12px 14px; font-size: 13px; color: #334155; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr.expandable:hover td { background: #f8fafc; cursor: pointer; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .tab-btn { padding: 8px 20px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
    .tab-btn.active { background: #2563eb; color: #fff; }
    .tab-btn:not(.active) { background: #e2e8f0; color: #64748b; }
    .tab-btn:not(.active):hover { background: #cbd5e1; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: #fff; border-radius: 16px; padding: 28px; width: 90%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,.25); }
    .modal-box label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 4px; margin-top: 14px; }
    .modal-box label:first-of-type { margin-top: 0; }
    .expand-row td { background: #f8fafc; }
    .expand-row td table th { background: #f1f5f9; font-size: 10px; padding: 6px 10px; }
    .expand-row td table td { padding: 6px 10px; font-size: 12px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #f1f5f9; padding: 12px 24px; border-radius: 12px; font-weight: 600; box-shadow: 0 8px 32px rgba(0,0,0,.25); z-index: 9999; transition: opacity .3s; }
  </style>
</head>
<body class="text-slate-800 min-h-screen">

<script type="module" src="../core/authGuard.js"></script>
<script src="/components/layout.js"></script>

<div class="flex min-h-screen">
  <!-- SIDEBAR -->
  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col min-w-0">
    <!-- HEADER -->
    <div class="bg-white border-b border-slate-200 px-6 py-5 flex items-center justify-between gap-4 sticky top-0 z-30">
      <div class="flex items-center gap-4">
        <button onclick="history.back()" class="text-slate-400 hover:text-slate-700 transition-colors" title="Voltar">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <div>
          <h1 class="text-xl font-bold text-slate-900">🟨 Suspensões / Controle de Cartões</h1>
          <p class="text-xs text-slate-400 mt-0.5">Gerencie cartões acumulados e suspensões disciplinares</p>
        </div>
      </div>
      <button onclick="openJulgamentoModal(null)" class="btn-primary flex items-center gap-2">
        <span>+</span> Nova Suspensão
      </button>
    </div>

    <div class="p-6 flex-1">

      <!-- FILTERS -->
      <div class="flex flex-wrap gap-3 mb-5">
        <select id="filterCompeticao" class="input-field" style="width:auto;min-width:180px;" onchange="applyFilters()">
          <option value="">Todas as competições</option>
        </select>
        <input id="filterAthlete" type="search" placeholder="Buscar atleta..." class="input-field" style="width:auto;min-width:200px;" oninput="applyFilters()" />
      </div>

      <!-- TABS -->
      <div class="flex gap-2 mb-5">
        <button id="tabAtletas" class="tab-btn active" onclick="switchTab('atletas')">Atletas</button>
        <button id="tabComissao" class="tab-btn" onclick="switchTab('comissao')">Comissão Técnica</button>
      </div>

      <!-- TAB ATLETAS -->
      <div id="panelAtletas">

        <!-- CARD SUMMARY -->
        <div class="card mb-5 overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-bold text-slate-700 text-sm">Resumo de Cartões</h2>
            <span id="cardSummaryCount" class="text-xs text-slate-400"></span>
          </div>
          <div id="cardSummaryTable">
            <div class="p-8 text-center text-slate-400 text-sm">Carregando dados...</div>
          </div>
        </div>

        <!-- JULGAMENTOS ATLETAS -->
        <div class="card overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100">
            <h2 class="font-bold text-slate-700 text-sm">Julgamentos Registrados</h2>
          </div>
          <div id="julgamentosAtletasTable">
            <div class="p-6 text-center text-slate-400 text-sm">Carregando...</div>
          </div>
        </div>
      </div>

      <!-- TAB COMISSÃO -->
      <div id="panelComissao" class="hidden">
        <div class="card overflow-hidden">
          <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-bold text-slate-700 text-sm">Suspensões da Comissão Técnica</h2>
            <button onclick="openJulgamentoModal('comissao')" class="btn-sm bg-slate-800 text-white hover:bg-slate-700">+ Adicionar</button>
          </div>
          <div id="julgamentosComissaoTable">
            <div class="p-6 text-center text-slate-400 text-sm">Carregando...</div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- MODAL: REGISTRAR JULGAMENTO -->
<div id="julgamentoModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-5">
      <h3 class="font-bold text-slate-900 text-lg">Registrar Julgamento</h3>
      <button onclick="closeJulgamentoModal()" class="text-slate-400 hover:text-slate-700 text-xl leading-none">✕</button>
    </div>

    <label>Tipo</label>
    <div class="flex gap-3 mt-1">
      <label class="flex items-center gap-2 cursor-pointer font-normal text-sm text-slate-700">
        <input type="radio" name="jTipo" value="atleta" checked onchange="updateJTipo()" class="accent-blue-600"> Atleta
      </label>
      <label class="flex items-center gap-2 cursor-pointer font-normal text-sm text-slate-700">
        <input type="radio" name="jTipo" value="comissao" onchange="updateJTipo()" class="accent-blue-600"> Comissão Técnica
      </label>
    </div>

    <div id="jPessoaAtletaRow">
      <label>Atleta</label>
      <select id="jPessoaSelect" class="input-field"></select>
    </div>

    <div id="jPessoaComissaoRow" class="hidden">
      <label>Nome (Comissão)</label>
      <input id="jPessoaText" type="text" class="input-field" placeholder="Nome do membro da comissão" />
    </div>

    <label>Competição</label>
    <input id="jCompeticao" type="text" class="input-field" placeholder="Ex: Campeonato Estadual" />

    <label>Jogo — Adversário</label>
    <input id="jJogoAdversario" type="text" class="input-field" placeholder="Ex: Flamengo" />

    <label>Jogo — Data</label>
    <input id="jJogoData" type="date" class="input-field" />

    <label>Motivo</label>
    <select id="jMotivo" class="input-field">
      <option value="Expulsão">Expulsão</option>
      <option value="3 Amarelos Acumulados">3 Amarelos Acumulados</option>
      <option value="Decisão de Tribunal">Decisão de Tribunal</option>
      <option value="Outro">Outro</option>
    </select>

    <label>Descrição (opcional)</label>
    <textarea id="jDescricao" class="input-field" rows="2" placeholder="Detalhes adicionais..."></textarea>

    <label>Jogos de suspensão adicional além do automático</label>
    <input id="jJogosAdicionais" type="number" min="0" value="0" class="input-field" />

    <div class="flex gap-3 mt-6">
      <button onclick="closeJulgamentoModal()" class="flex-1 py-2.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-sm font-semibold text-slate-700">Cancelar</button>
      <button onclick="saveJulgamento()" class="flex-1 btn-primary py-2.5 text-sm">Salvar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toastEl" class="toast hidden"></div>

<script type="module">
import { db, auth } from '../core/firebase.js';
import {
  collection, doc, addDoc, getDocs, updateDoc, deleteDoc,
  query, where, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';

let CLUB_ID = '';
let USER_ID = '';
let allAthletes = [];
let allPartidas = [];
let allJulgamentos = [];
let currentTab = 'atletas';
let filterComp = '';
let filterAthleteName = '';

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function toast(msg, bg = '#1e293b') {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.style.background = bg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3500);
}

function fmt(dateStr) {
  if (!dateStr) return '–';
  const [y, m, d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

// ─── FILTERS ─────────────────────────────────────────────────────────────────
window.applyFilters = function() {
  filterComp = document.getElementById('filterCompeticao').value;
  filterAthleteName = document.getElementById('filterAthlete').value.toLowerCase();
  renderCardSummary();
  renderJulgamentosAtletas();
  renderJulgamentosComissao();
};

// ─── TAB ─────────────────────────────────────────────────────────────────────
window.switchTab = function(tab) {
  currentTab = tab;
  document.getElementById('panelAtletas').classList.toggle('hidden', tab !== 'atletas');
  document.getElementById('panelComissao').classList.toggle('hidden', tab !== 'comissao');
  document.getElementById('tabAtletas').className = 'tab-btn' + (tab === 'atletas' ? ' active' : '');
  document.getElementById('tabComissao').className = 'tab-btn' + (tab === 'comissao' ? ' active' : '');
};

// ─── CARD SUMMARY ────────────────────────────────────────────────────────────
function buildCardStats() {
  // Per athlete per competition: count amarelos, vermelhos
  const stats = {}; // key: `${athleteId}__${competicao}`

  allPartidas.forEach(p => {
    const comp = p.competicao || '–';
    if (filterComp && comp !== filterComp) return;
    if (!p.perfSnapshot) return;
    Object.values(p.perfSnapshot).forEach(perf => {
      const key = `${perf.athleteId}__${comp}`;
      if (!stats[key]) stats[key] = { athleteId: perf.athleteId, athleteName: perf.athleteName || perf.athleteId, competicao: comp, amarelos: 0, vermelhos: 0, jogos: [] };
      stats[key].amarelos += (perf.cartoes_amarelos || 0);
      stats[key].vermelhos += (perf.cartoes_vermelhos || 0);
      stats[key].jogos.push({ data: p.data, adversario: p.adversario, amarelos: perf.cartoes_amarelos || 0, vermelhos: perf.cartoes_vermelhos || 0 });
    });
  });

  // Determina dados do último cartão e posição na sequência
  Object.values(stats).forEach(entry => {
    entry.jogos.sort((a, b) => (a.data || '').localeCompare(b.data || ''));
    const lastGame = entry.jogos[entry.jogos.length - 1];
    entry.lastGame = lastGame;

    // Último jogo que teve algum cartão (para exibir data/adversário)
    entry.lastCardGame = [...entry.jogos].reverse().find(j => j.amarelos > 0 || j.vermelhos > 0) || null;

    // ── RESETS IMPLÍCITOS ─────────────────────────────────────────────────────
    // Quando o atleta cruzou o múltiplo de 3 num jogo X e apareceu num jogo Y
    // posterior, assume-se que a suspensão foi cumprida entre X e Y.
    let cumul = 0;
    let implicitResets = 0;
    let lastRedIdx = -1;

    entry.jogos.forEach((j, i) => {
      const prevCumul = cumul;
      cumul += j.amarelos;
      const novosThresholds = Math.floor(cumul / 3) - Math.floor(prevCumul / 3);
      // Cada threshold cruzado com jogo posterior = suspensão cumprida
      if (novosThresholds > 0 && i < entry.jogos.length - 1) {
        implicitResets += novosThresholds;
      }
      if (j.vermelhos > 0) lastRedIdx = i;
    });

    // Vermelho: suspensão cumprida se o atleta jogou depois
    entry.playedAfterLastRed = lastRedIdx >= 0 && lastRedIdx < entry.jogos.length - 1;

    // ── RESETS EXPLÍCITOS (julgamentos cumpridos) ─────────────────────────────
    const explicitResets = allJulgamentos.filter(j =>
      j.tipo === 'atleta' && j.pessoaId === entry.athleteId &&
      j.competicao === entry.competicao &&
      j.motivo === '3 Amarelos Acumulados' && j.status === 'cumprido'
    ).length;

    // Bolinhas = amarelos restantes após todos os resets, ciclando 1→2→3
    const totalResets = implicitResets + explicitResets;
    const amarelBase = Math.max(0, entry.amarelos - totalResets * 3);
    entry.amarelCircles = amarelBase > 0 ? ((amarelBase - 1) % 3) + 1 : 0;

    // ── ALERTAS DO ÚLTIMO JOGO ────────────────────────────────────────────────
    entry.lastGameTriggeredRed = (lastGame?.vermelhos || 0) > 0;

    const amarelAntesUltimo = entry.jogos.slice(0, -1).reduce((sum, j) => sum + j.amarelos, 0);
    const amarelComUltimo = amarelAntesUltimo + (lastGame?.amarelos || 0);
    entry.lastGameTriggeredYellow =
      (lastGame?.amarelos || 0) > 0 &&
      Math.floor(amarelComUltimo / 3) > Math.floor(amarelAntesUltimo / 3);
  });

  return Object.values(stats);
}

function getSituacao(entry, julgamentos) {
  // Suspensão ativa registrada manualmente → sempre prioridade máxima
  const activeJulg = julgamentos.find(j =>
    j.tipo === 'atleta' && j.pessoaId === entry.athleteId &&
    (filterComp ? j.competicao === entry.competicao : true) &&
    j.status === 'ativo'
  );
  if (activeJulg) return { label: '🚨 SUSPENSO', cls: 'bg-red-100 text-red-700', priority: 3 };

  // Vermelho: alerta apenas se o atleta NÃO jogou depois e não tem julgamento
  if (entry.lastGameTriggeredRed && !entry.playedAfterLastRed) {
    const hasJulg = julgamentos.find(j =>
      j.tipo === 'atleta' && j.pessoaId === entry.athleteId &&
      j.competicao === entry.competicao && j.motivo === 'Expulsão'
    );
    if (!hasJulg) return { label: '⚠️ Expulsão', cls: 'bg-orange-100 text-orange-700', priority: 2 };
  }
  // 3° amarelo: alerta apenas se amarelCircles > 0 (suspensão ainda não cumprida)
  if (entry.lastGameTriggeredYellow && entry.amarelCircles > 0) {
    return { label: '⚠️ 3° Amarelo', cls: 'bg-amber-100 text-amber-700', priority: 1 };
  }
  return { label: '✅ OK', cls: 'bg-slate-100 text-slate-500', priority: 0 };
}

function atletaAvatarCartao(athleteId, nome) {
  const a = allAthletes.find(x => x.id === athleteId);
  const fotoUrl = a?.fotoUrl || '';
  if (fotoUrl) return `<img src="${fotoUrl}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="" />`;
  const ini = (nome||'?').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase();
  return `<div style="width:32px;height:32px;border-radius:50%;background:#1e40af;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;">${ini}</div>`;
}

function renderCardSummary() {
  const container = document.getElementById('cardSummaryTable');
  let stats = buildCardStats();

  // Exibe apenas atletas com ao menos 1 cartão registrado
  stats = stats.filter(s => s.amarelos > 0 || s.vermelhos > 0);

  if (filterAthleteName) {
    stats = stats.filter(s => s.athleteName.toLowerCase().includes(filterAthleteName));
  }

  document.getElementById('cardSummaryCount').textContent = `${stats.length} atleta(s)`;

  if (stats.length === 0) {
    container.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">Nenhum dado de cartões encontrado.</div>';
    return;
  }

  let html = `<table>
    <thead><tr>
      <th>Atleta</th><th>Competição</th><th style="text-align:center">🟡</th><th style="text-align:center">🔴</th><th>Último Cartão</th><th>Situação</th><th>Ações</th>
    </tr></thead><tbody>`;

  stats.sort((a, b) => {
    const sa = getSituacao(a, allJulgamentos).priority;
    const sb = getSituacao(b, allJulgamentos).priority;
    // 1. Suspensos (prioridade 3) primeiro
    const aSusp = sa === 3 ? 1 : 0;
    const bSusp = sb === 3 ? 1 : 0;
    if (bSusp !== aSusp) return bSusp - aSusp;
    // 2. Posição no ciclo atual (2 bolinhas = pendurado, antes de 1 bolinha)
    if (b.amarelCircles !== a.amarelCircles) return b.amarelCircles - a.amarelCircles;
    // 3. Data do último cartão (mais recente primeiro)
    const aDate = a.lastCardGame?.data || '';
    const bDate = b.lastCardGame?.data || '';
    if (bDate !== aDate) return bDate.localeCompare(aDate);
    return a.athleteName.localeCompare(b.athleteName);
  });

  stats.forEach((entry, idx) => {
    const sit = getSituacao(entry, allJulgamentos);

    // Bolinhas: ponto vermelho só se suspenso, senão amarelos do ciclo atual
    const circlesHtml = (() => {
      if (sit.priority === 3) {
        return '<span style="color:#dc2626;font-size:16px;letter-spacing:2px">●</span>';
      }
      if (entry.amarelCircles === 0) return '<span class="text-slate-300 text-xs">–</span>';
      return '<span style="color:#fbbf24;font-size:16px;letter-spacing:2px">' + '●'.repeat(entry.amarelCircles) + '</span>';
    })();

    const lastCardInfo = entry.lastCardGame
      ? `<div class="flex flex-col gap-0.5">
           <span class="text-xs text-slate-700 font-medium">${fmt(entry.lastCardGame.data)}</span>
           <span class="text-xs text-slate-400">${entry.lastCardGame.adversario || '–'}</span>
           <div>${circlesHtml}</div>
         </div>`
      : '<span class="text-xs text-slate-300">–</span>';

    html += `<tr class="expandable" onclick="toggleExpand(${idx})">
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          ${atletaAvatarCartao(entry.athleteId, entry.athleteName)}
          <span class="font-semibold text-slate-900">${entry.athleteName}</span>
        </div>
      </td>
      <td class="text-slate-500">${entry.competicao}</td>
      <td class="text-center font-bold ${entry.amarelos > 0 ? 'text-amber-600' : 'text-slate-300'}">${entry.amarelos}</td>
      <td class="text-center font-bold ${entry.vermelhos > 0 ? 'text-red-600' : 'text-slate-300'}">${entry.vermelhos}</td>
      <td>${lastCardInfo}</td>
      <td><span class="badge ${sit.cls}">${sit.label}</span></td>
      <td class="flex gap-2 flex-wrap">
        <button class="btn-sm bg-blue-50 text-blue-700 hover:bg-blue-100" onclick="event.stopPropagation(); openJulgamentoModal('atleta','${entry.athleteId}','${entry.competicao.replace(/'/g,"\\'")}')">+ Julgamento</button>
        ${(sit.priority === 1 || sit.priority === 2) ? `<button class="btn-sm bg-slate-100 text-slate-500 hover:bg-slate-200" onclick="event.stopPropagation(); dispensar('${entry.athleteId}','${entry.athleteName.replace(/'/g,"\\'")}','${entry.competicao.replace(/'/g,"\\'")}','${sit.priority === 2 ? 'Expulsão' : '3 Amarelos Acumulados'}')">Dispensar</button>` : ''}
      </td>
    </tr>
    <tr id="expand_${idx}" class="expand-row hidden">
      <td colspan="7" style="padding:12px 24px;">
        <table>
          <thead><tr><th>Data</th><th>Adversário</th><th>🟡</th><th>🔴</th></tr></thead>
          <tbody>${entry.jogos.map(j => `<tr><td>${fmt(j.data)}</td><td>${j.adversario||'–'}</td><td class="font-bold ${j.amarelos>0?'text-amber-600':'text-slate-300'}">${j.amarelos}</td><td class="font-bold ${j.vermelhos>0?'text-red-600':'text-slate-300'}">${j.vermelhos}</td></tr>`).join('')}</tbody>
        </table>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

window.toggleExpand = function(idx) {
  const row = document.getElementById(`expand_${idx}`);
  row.classList.toggle('hidden');
};

// ─── JULGAMENTOS ATLETAS ──────────────────────────────────────────────────────
function renderJulgamentosAtletas() {
  const container = document.getElementById('julgamentosAtletasTable');
  let items = allJulgamentos.filter(j => j.tipo === 'atleta');
  if (filterComp) items = items.filter(j => j.competicao === filterComp);
  if (filterAthleteName) items = items.filter(j => (j.pessoaNome||'').toLowerCase().includes(filterAthleteName));

  if (items.length === 0) {
    container.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">Nenhum julgamento registrado.</div>';
    return;
  }

  let html = `<table><thead><tr>
    <th>Atleta</th><th>Competição</th><th>Motivo</th><th>Jogo</th><th>Jogos Adicionais</th><th>Status</th><th>Ações</th>
  </tr></thead><tbody>`;

  items.forEach(j => {
    const statusCls = j.status === 'ativo' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';
    const statusLabel = j.status === 'ativo' ? '🔴 Ativo' : '✅ Cumprido';
    html += `<tr>
      <td class="font-semibold text-slate-900">${j.pessoaNome||'–'}</td>
      <td class="text-slate-500">${j.competicao||'–'}</td>
      <td>${j.motivo||'–'}</td>
      <td class="text-xs">${j.jogoAdversario ? `${j.jogoAdversario} ${fmt(j.jogoData)}` : '–'}</td>
      <td class="text-center font-bold">${j.jogosAdicionais||0}</td>
      <td><span class="badge ${statusCls}">${statusLabel}</span></td>
      <td class="flex gap-2 flex-wrap">
        ${j.status === 'ativo' ? `<button class="btn-sm bg-green-50 text-green-700 hover:bg-green-100" onclick="marcarCumprido('${j._id}')">✅ Cumprida</button>` : ''}
        <button class="btn-sm bg-red-50 text-red-600 hover:bg-red-100" onclick="excluirJulgamento('${j._id}')">🗑 Excluir</button>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

// ─── JULGAMENTOS COMISSÃO ─────────────────────────────────────────────────────
function renderJulgamentosComissao() {
  const container = document.getElementById('julgamentosComissaoTable');
  let items = allJulgamentos.filter(j => j.tipo === 'comissao');
  if (filterComp) items = items.filter(j => j.competicao === filterComp);

  if (items.length === 0) {
    container.innerHTML = '<div class="p-6 text-center text-slate-400 text-sm">Nenhuma suspensão de comissão registrada.</div>';
    return;
  }

  let html = `<table><thead><tr>
    <th>Pessoa</th><th>Competição</th><th>Motivo</th><th>Jogo</th><th>Jogos Adicionais</th><th>Status</th><th>Ações</th>
  </tr></thead><tbody>`;

  items.forEach(j => {
    const statusCls = j.status === 'ativo' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700';
    const statusLabel = j.status === 'ativo' ? '🔴 Ativo' : '✅ Cumprido';
    html += `<tr>
      <td class="font-semibold text-slate-900">${j.pessoaNome||'–'}</td>
      <td class="text-slate-500">${j.competicao||'–'}</td>
      <td>${j.motivo||'–'}</td>
      <td class="text-xs">${j.jogoAdversario ? `${j.jogoAdversario} ${fmt(j.jogoData)}` : '–'}</td>
      <td class="text-center font-bold">${j.jogosAdicionais||0}</td>
      <td><span class="badge ${statusCls}">${statusLabel}</span></td>
      <td class="flex gap-2">
        ${j.status === 'ativo' ? `<button class="btn-sm bg-green-50 text-green-700 hover:bg-green-100" onclick="marcarCumprido('${j._id}')">✅ Cumprida</button>` : ''}
        <button class="btn-sm bg-red-50 text-red-600 hover:bg-red-100" onclick="excluirJulgamento('${j._id}')">🗑 Excluir</button>
      </td>
    </tr>`;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

// ─── MODAL JULGAMENTO ─────────────────────────────────────────────────────────
let prefillAthleteId = null;
let prefillComp = null;

window.openJulgamentoModal = function(tipo, athleteId, comp) {
  prefillAthleteId = athleteId || null;
  prefillComp = comp || null;

  if (tipo === 'comissao') {
    document.querySelector('input[name="jTipo"][value="comissao"]').checked = true;
  } else {
    document.querySelector('input[name="jTipo"][value="atleta"]').checked = true;
  }
  updateJTipo();

  // Populate athlete select
  const sel = document.getElementById('jPessoaSelect');
  sel.innerHTML = allAthletes.map(a => `<option value="${a.id}" data-nome="${a.nome}">${a.nome}${a.posicao ? ' · ' + a.posicao : ''}</option>`).join('');
  if (prefillAthleteId) sel.value = prefillAthleteId;

  if (prefillComp) document.getElementById('jCompeticao').value = prefillComp;
  else document.getElementById('jCompeticao').value = '';

  document.getElementById('jJogoAdversario').value = '';
  document.getElementById('jJogoData').value = '';
  document.getElementById('jMotivo').value = 'Expulsão';
  document.getElementById('jDescricao').value = '';
  document.getElementById('jJogosAdicionais').value = '0';
  document.getElementById('julgamentoModal').classList.remove('hidden');
};

window.closeJulgamentoModal = function() {
  document.getElementById('julgamentoModal').classList.add('hidden');
};

window.updateJTipo = function() {
  const tipo = document.querySelector('input[name="jTipo"]:checked').value;
  document.getElementById('jPessoaAtletaRow').classList.toggle('hidden', tipo !== 'atleta');
  document.getElementById('jPessoaComissaoRow').classList.toggle('hidden', tipo !== 'comissao');
};

window.saveJulgamento = async function() {
  const tipo = document.querySelector('input[name="jTipo"]:checked').value;
  let pessoaId = '', pessoaNome = '';

  if (tipo === 'atleta') {
    const sel = document.getElementById('jPessoaSelect');
    pessoaId = sel.value;
    pessoaNome = sel.options[sel.selectedIndex]?.dataset.nome || pessoaId;
  } else {
    pessoaNome = document.getElementById('jPessoaText').value.trim();
    pessoaId = pessoaNome;
  }

  const comp = document.getElementById('jCompeticao').value.trim();
  if (!pessoaNome || !comp) { toast('Preencha todos os campos obrigatórios.', '#7f1d1d'); return; }

  const data = {
    clubId: CLUB_ID,
    tipo,
    pessoaId,
    pessoaNome,
    competicao: comp,
    jogoData: document.getElementById('jJogoData').value,
    jogoAdversario: document.getElementById('jJogoAdversario').value.trim(),
    motivo: document.getElementById('jMotivo').value,
    descricao: document.getElementById('jDescricao').value.trim(),
    jogosAdicionais: parseInt(document.getElementById('jJogosAdicionais').value) || 0,
    status: 'ativo',
    criadoEm: serverTimestamp(),
    criadoPor: USER_ID,
  };

  try {
    await addDoc(collection(db, 'julgamentos'), data);
    closeJulgamentoModal();
    toast('✅ Julgamento salvo!', '#064e3b');
    await loadAllData();
  } catch (err) {
    toast('Erro: ' + err.message, '#7f1d1d');
  }
};

window.marcarCumprido = async function(id) {
  try {
    await updateDoc(doc(db, 'julgamentos', id), { status: 'cumprido' });
    toast('✅ Suspensão marcada como cumprida.', '#064e3b');
    await loadAllData();
  } catch (err) { toast('Erro: ' + err.message, '#7f1d1d'); }
};

window.excluirJulgamento = async function(id) {
  if (!confirm('Excluir este julgamento?')) return;
  try {
    await deleteDoc(doc(db, 'julgamentos', id));
    toast('Julgamento excluído.', '#374151');
    await loadAllData();
  } catch (err) { toast('Erro: ' + err.message, '#7f1d1d'); }
};

// ─── DISPENSAR (marca suspensão como já cumprida sem abrir modal) ─────────────
window.dispensar = async function(athleteId, athleteName, comp, motivo) {
  if (!confirm(`Marcar a ${motivo === 'Expulsão' ? 'expulsão' : '3ª suspensão por amarelos'} de ${athleteName} como já cumprida?`)) return;
  try {
    await addDoc(collection(db, 'julgamentos'), {
      clubId: CLUB_ID,
      tipo: 'atleta',
      pessoaId: athleteId,
      pessoaNome: athleteName,
      competicao: comp,
      motivo,
      descricao: 'Suspensão dispensada manualmente (já cumprida)',
      jogosAdicionais: 0,
      status: 'cumprido',
      criadoEm: serverTimestamp(),
      criadoPor: USER_ID,
    });
    toast('✅ Alerta dispensado.', '#064e3b');
    await loadAllData();
  } catch (err) { toast('Erro: ' + err.message, '#7f1d1d'); }
};

// ─── LOAD DATA ────────────────────────────────────────────────────────────────
async function loadAllData() {
  // Load athletes
  const athSnap = await getDocs(query(collection(db, 'athletes'), where('clubId', '==', CLUB_ID), where('ativo', '==', true)));
  allAthletes = athSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  allAthletes.sort((a, b) => (a.nome||'').localeCompare(b.nome||''));

  // Load partidas
  const partidasSnap = await getDocs(query(collection(db, 'scout_partidas'), where('clubId', '==', CLUB_ID)));
  allPartidas = partidasSnap.docs.map(d => ({ _id: d.id, ...d.data() }));

  // Load julgamentos
  const julSnap = await getDocs(query(collection(db, 'julgamentos'), where('clubId', '==', CLUB_ID)));
  allJulgamentos = julSnap.docs.map(d => ({ _id: d.id, ...d.data() }));

  // Build competicao filter options
  const comps = new Set();
  allPartidas.forEach(p => { if (p.competicao) comps.add(p.competicao); });
  allJulgamentos.forEach(j => { if (j.competicao) comps.add(j.competicao); });
  const sel = document.getElementById('filterCompeticao');
  const current = sel.value;
  sel.innerHTML = '<option value="">Todas as competições</option>' +
    [...comps].sort().map(c => `<option value="${c}" ${c === current ? 'selected' : ''}>${c}</option>`).join('');

  console.log('[cartoes] Carregado:', allAthletes.length, 'atletas,', allPartidas.length, 'partidas,', allJulgamentos.length, 'julgamentos');
  renderCardSummary();
  renderJulgamentosAtletas();
  renderJulgamentosComissao();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
onAuthStateChanged(auth, async user => {
  if (!user) return;
  USER_ID = user.uid;
  const ctx = JSON.parse(localStorage.getItem('userContext') || '{}');
  CLUB_ID = ctx.clubId || '';
  if (!CLUB_ID) {
    const { getDoc } = await import('https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js');
    const uDoc = await getDoc(doc(db, 'users', user.uid));
    if (uDoc.exists()) CLUB_ID = uDoc.data().clubId || '';
  }
  console.log('[cartoes] CLUB_ID:', CLUB_ID);
  if (!CLUB_ID) {
    const errMsg = 'clubId não encontrado. Faça logout e entre novamente.';
    document.getElementById('cardSummaryTable').innerHTML = `<div class="p-8 text-center text-red-500 text-sm font-semibold">${errMsg}</div>`;
    document.getElementById('julgamentosAtletasTable').innerHTML = `<div class="p-6 text-center text-red-500 text-sm">${errMsg}</div>`;
    return;
  }
  try {
    await loadAllData();
  } catch (err) {
    console.error('[cartoes] Erro ao carregar dados:', err);
    const errMsg = `Erro ao carregar dados: ${err.message}`;
    document.getElementById('cardSummaryTable').innerHTML = `<div class="p-8 text-center text-red-500 text-sm font-semibold">${errMsg}</div>`;
    document.getElementById('julgamentosAtletasTable').innerHTML = `<div class="p-6 text-center text-red-500 text-sm">${errMsg}</div>`;
    toast(errMsg, '#7f1d1d');
  }
});
</script>
