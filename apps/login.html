<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <title>Ciente IE · Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-6">Ciente IE</h1>

    <form id="loginForm" class="flex flex-col gap-4">
      <input id="email" type="email" placeholder="Email"
        class="p-3 border rounded-lg" required />

      <input id="senha" type="password" placeholder="Senha"
        class="p-3 border rounded-lg" required />

      <button class="bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
        Entrar
      </button>
    </form>

    <div class="flex items-center gap-3 my-4">
      <hr class="flex-1 border-gray-200" />
      <span class="text-xs text-gray-400">ou</span>
      <hr class="flex-1 border-gray-200" />
    </div>

    <button id="btnGoogle" class="w-full flex items-center justify-center gap-3 border border-gray-300 py-3 rounded-lg hover:bg-gray-50 text-sm font-medium text-gray-700">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 29.8 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>
      Entrar com Google
    </button>

    <p id="erro" class="text-red-600 text-sm text-center mt-4 hidden"></p>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
