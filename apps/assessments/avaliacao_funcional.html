<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Avaliação Funcional – Ciente IE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .aba { display:none; }
  .ativa { display:block; }
</style>
</head>

<body class="bg-gray-100 min-h-screen flex">
  <div id="sidebar-container"></div>
  <div class="flex-1 p-6">

<header class="bg-blue-700 text-white text-center py-4 pl-14 md:pl-0 text-xl font-semibold">
  Avaliação Funcional – Ciente IE
</header>

<main class="p-4 max-w-4xl mx-auto">

<section id="inicio" class="aba ativa">
  <h2 class="text-lg font-bold mb-3">Lista de Atletas</h2>
  <div id="status" class="text-sm text-gray-600 mb-3"></div>
  <div id="listaAtletas" class="space-y-2"></div>
</section>

<section id="avaliacao" class="aba">
  <button id="btnVoltar" class="mb-3 text-blue-600">← Voltar</button>
  <h2 id="tituloAvaliacao" class="text-lg font-bold mb-4"></h2>

  <form id="formAvaliacao" class="space-y-4">

    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold text-blue-700 mb-2">Força Muscular</h3>
      <div class="grid grid-cols-2 gap-2">
        <input id="quadDir" type="number" step="0.1" placeholder="Quadríceps Dir (kg)" class="border p-2 rounded">
        <input id="quadEsq" type="number" step="0.1" placeholder="Quadríceps Esq (kg)" class="border p-2 rounded">
        <input id="isqDir"  type="number" step="0.1" placeholder="Isquiotibiais Dir (kg)" class="border p-2 rounded">
        <input id="isqEsq"  type="number" step="0.1" placeholder="Isquiotibiais Esq (kg)" class="border p-2 rounded">
      </div>
    </div>

    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold text-yellow-700 mb-2">Flexibilidade</h3>
      <div class="grid grid-cols-2 gap-2">
        <select id="encurtQuadDir" class="border p-2 rounded">
          <option value="">Quadríceps Dir</option>
          <option>Normal</option><option>Moderada</option><option>Alta</option>
        </select>
        <select id="encurtQuadEsq" class="border p-2 rounded">
          <option value="">Quadríceps Esq</option>
          <option>Normal</option><option>Moderada</option><option>Alta</option>
        </select>
        <select id="encurtIlioDir" class="border p-2 rounded">
          <option value="">Iliopsoas Dir</option>
          <option>Normal</option><option>Moderada</option><option>Alta</option>
        </select>
        <select id="encurtIlioEsq" class="border p-2 rounded">
          <option value="">Iliopsoas Esq</option>
          <option>Normal</option><option>Moderada</option><option>Alta</option>
        </select>
      </div>
    </div>

    <div class="bg-white p-4 rounded shadow">
      <h3 class="font-semibold text-green-700 mb-2">Mobilidade</h3>
      <div class="grid grid-cols-2 gap-2">
        <input id="mobQuadDir"  type="number" step="0.1" placeholder="Quadril Dir (°)" class="border p-2 rounded">
        <input id="mobQuadEsq"  type="number" step="0.1" placeholder="Quadril Esq (°)" class="border p-2 rounded">
        <input id="mobTornoDir" type="number" step="0.1" placeholder="Tornozelo Dir (°)" class="border p-2 rounded">
        <input id="mobTornoEsq" type="number" step="0.1" placeholder="Tornozelo Esq (°)" class="border p-2 rounded">
        <input id="mobPostDir"  type="number" step="0.1" placeholder="Posteriores Dir (°)" class="border p-2 rounded">
        <input id="mobPostEsq"  type="number" step="0.1" placeholder="Posteriores Esq (°)" class="border p-2 rounded">
      </div>
    </div>

    <button class="bg-blue-600 text-white w-full py-2 rounded">
      Salvar Avaliação
    </button>
  </form>
</section>

</main>

<script type="module">
import { db, auth } from "/core/firebase.js";
import {
  collection, getDocs, addDoc, query, where,
  doc, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const $ = id => document.getElementById(id);
let atletaSelecionado = null;
let currentUserData = null;

function trocarAba(id){
  document.querySelectorAll(".aba").forEach(a=>a.classList.remove("ativa"));
  $(id).classList.add("ativa");
}
$("btnVoltar").onclick = ()=>trocarAba("inicio");

async function resolveUserData() {
  // 1. Tenta localStorage (salvo no login — mais rápido e confiável)
  try {
    const ctx = JSON.parse(localStorage.getItem("userContext"));
    if (ctx?.clubId) return ctx;
  } catch(e) {}

  // 2. Fallback: aguarda Auth e busca no Firestore
  return new Promise((resolve, reject) => {
    const unsub = onAuthStateChanged(auth, async u => {
      unsub();
      if (!u) { reject(new Error("não autenticado")); return; }
      const snap = await getDoc(doc(db, "users", u.uid));
      if (!snap.exists()) { reject(new Error("sem perfil")); return; }
      resolve(snap.data());
    });
  }).catch(() => {
    window.location.href = "/login.html";
    return null;
  });
}

function getAthleteName(data){
  return (data?.nome ?? data?.name ?? data?.atleta ?? "").toString().trim();
}

function getAthleteClubId(data){
  // ✅ aceita variações comuns de campo
  return (data?.clubId ?? data?.club_id ?? data?.clubeId ?? data?.club ?? null);
}

async function carregarAtletas(){
  $("status").innerText = "Carregando atletas…";
  $("listaAtletas").innerHTML = "";

  try{
    const snap = await getDocs(query(
      collection(db,"athletes"),
      where("clubId","==",currentUserData.clubId),
      where("ativo","!=",false)
    ));
    const atletas = [];

    snap.forEach(d=>{
      const data = d.data();
      const nome = getAthleteName(data);
      if(!nome) return;
      const clubId = getAthleteClubId(data);
      atletas.push({ id:d.id, nome, clubId, fotoUrl: data.fotoUrl || null });
    });

    atletas.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));

    if(atletas.length === 0){
      $("status").innerText = "Nenhum atleta encontrado (verifique a coleção athletes).";
      return;
    }

    const total = atletas.length;
    const semClube = atletas.filter(a=>!a.clubId).length;
    $("status").innerText = semClube
      ? `Atletas: ${total} (⚠️ ${semClube} sem clubId)`
      : `Atletas: ${total}`;

    $("listaAtletas").innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${atletas.map(a=>{
      const ok = a.clubId && currentUserData?.clubId && a.clubId === currentUserData.clubId;
      const disabled = !ok ? "disabled" : "";
      const avatarHtml = a.fotoUrl
        ? `<img src="${a.fotoUrl}" class="w-16 h-16 rounded-full object-cover mx-auto mb-2 border-2 border-white shadow" alt="" />`
        : `<div class="w-16 h-16 rounded-full bg-blue-700 text-white flex items-center justify-center text-xl font-bold mx-auto mb-2 shadow">${a.nome.charAt(0).toUpperCase()}</div>`;
      const badge = !a.clubId
        ? `<span class="text-xs text-orange-500">sem clubId</span>`
        : (a.clubId !== currentUserData.clubId ? `<span class="text-xs text-red-500">outro clube</span>` : "");

      return `
        <button class="bg-white rounded-xl shadow p-4 flex flex-col items-center text-center transition hover:shadow-md hover:bg-blue-50 disabled:opacity-50 disabled:cursor-not-allowed"
          ${disabled}
          data-id="${a.id}"
          data-nome="${a.nome}"
          data-clubid="${a.clubId ?? ""}">
          ${avatarHtml}
          <span class="text-sm font-semibold text-gray-800 leading-tight">${a.nome}</span>
          ${badge}
          ${ok ? `<span class="mt-2 text-xs font-bold text-blue-600 bg-blue-50 border border-blue-200 rounded-full px-3 py-0.5">Avaliar</span>` : ''}
        </button>`;
    }).join("")}</div>`;

    document.querySelectorAll("button[data-id]").forEach(b=>{
      b.onclick=()=>{
        atletaSelecionado = {
          id: b.dataset.id,
          nome: b.dataset.nome,
          clubId: b.dataset.clubid || null
        };
        $("tituloAvaliacao").innerText = "Avaliação de " + atletaSelecionado.nome;
        trocarAba("avaliacao");
      };
    });

  }catch(err){
    console.error(err);
    $("status").innerText = "Erro ao carregar atletas (ver console).";
    alert("Erro ao carregar atletas. Veja o console para detalhes.");
  }
}

async function init(){
  $("status").innerText = "Autenticando…";
  currentUserData = await resolveUserData();
  if (!currentUserData?.clubId) { $("status").innerText = "Erro: usuário sem clubId."; return; }
  await carregarAtletas();
}

await init();

$("formAvaliacao").onsubmit = async e=>{
  e.preventDefault();
  if(!atletaSelecionado) return alert("Selecione um atleta.");

  // trava de segurança (mesmo que o botão já esteja desabilitado)
  if(!atletaSelecionado.clubId){
    alert("Esse atleta está sem clubId no cadastro. Corrija no cadastro do atleta.");
    return;
  }
  if(atletaSelecionado.clubId !== currentUserData.clubId){
    alert("Atleta não pertence ao seu clube.");
    return;
  }

  try{
    await addDoc(collection(db,"assessments_functional"),{
      athleteId: atletaSelecionado.id,
      clubId: currentUserData.clubId,
      date: new Date().toLocaleDateString('en-CA'),

      setores:{
        forca:{
          quad_dir:+$("quadDir").value||null,
          quad_esq:+$("quadEsq").value||null,
          isq_dir:+$("isqDir").value||null,
          isq_esq:+$("isqEsq").value||null
        },
        flexibilidade:{
          quad_dir:$("encurtQuadDir").value,
          quad_esq:$("encurtQuadEsq").value,
          ilio_dir:$("encurtIlioDir").value,
          ilio_esq:$("encurtIlioEsq").value
        },
        mobilidade:{
          quadril_dir:+$("mobQuadDir").value||null,
          quadril_esq:+$("mobQuadEsq").value||null,
          tornozelo_dir:+$("mobTornoDir").value||null,
          tornozelo_esq:+$("mobTornoEsq").value||null,
          posteriores_dir:+$("mobPostDir").value||null,
          posteriores_esq:+$("mobPostEsq").value||null
        }
      },

      meta:{ createdAt: serverTimestamp(), origem:"avaliacao_funcional" }
    });

    alert("✅ Avaliação salva com sucesso!");
    location.reload();
  }catch(err){
    console.error(err);
    alert("Não foi possível salvar (permissão). Veja o console.");
  }
};
</script>

</div>
  <script src="/components/layout.js"></script>

</body>
</html>
