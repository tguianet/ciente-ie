<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://cdn.tailwindcss.com">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <title>NeuroScore – Ciente IE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<header class="bg-blue-700 text-white p-4">
  <div style="display:flex;align-items:center;gap:12px;">
    <div id="atletaFotoNeuro" style="width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.2);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;"></div>
    <div>
      <h1 id="atletaNomeNeuro" class="text-xl font-bold leading-tight">NeuroScore · Ciente IE</h1>
      <p class="text-sm opacity-90">Teste Cognitivo Sequencial 1–25</p>
    </div>
  </div>
</header>

<main class="max-w-4xl mx-auto mt-6 bg-white p-6 rounded shadow">

  <!-- SELEÇÃO DE ATLETA (aparece quando não há athleteContext) -->
  <div id="painelSelecao" class="hidden mb-6 pb-6 border-b border-gray-200">
    <h2 class="text-base font-bold text-gray-800 mb-1">Selecionar Atleta</h2>
    <p class="text-sm text-gray-500 mb-4">Escolha o atleta antes de iniciar o teste.</p>
    <div class="flex gap-3 items-end">
      <div class="flex-1">
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1">Atleta</label>
        <select id="selectAtleta"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">Carregando atletas...</option>
        </select>
      </div>
      <button id="btnConfirmarAtleta"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg text-sm transition-colors">
        Confirmar
      </button>
    </div>
    <div id="atletaSelecionado" class="hidden mt-3 text-sm text-green-700 font-semibold bg-green-50 border border-green-200 rounded-lg px-3 py-2"></div>
  </div>

  <div id="instrucoes" class="mb-4 text-sm text-gray-700">
    <strong>Instruções:</strong>
    <ul class="list-disc ml-5">
      <li>Clique nos números de <strong>1 a 25</strong> na ordem correta.</li>
      <li>O tempo inicia no clique do número 1.</li>
      <li>Faça no menor tempo possível.</li>
      <li>Dois níveis: livre e sob pressão.</li>
    </ul>

    <button id="startBtn" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded w-full">
      Iniciar Teste
    </button>
  </div>

  <div id="status" class="mb-2 text-sm font-semibold"></div>
  <div id="timer" class="mb-4 text-lg font-bold text-red-600 hidden"></div>
  <div id="grid" class="grid grid-cols-5 gap-2 max-w-sm mx-auto hidden"></div>

  <div id="saveStatus" class="hidden mt-4 text-center text-sm font-semibold py-3 px-4 rounded"></div>

</main>

<script type="module">
import { db, auth } from "./core/firebase.js";
import {
  collection, getDocs, query, where, getDoc, doc
} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import { upsertDailyMetrics } from "./core/dailyMetrics.service.js";
import { calcularNeuroFeatures } from "./core/neuroFeatures.service.js";

/* ===========================
   CONTEXTO
=========================== */
const userCtx    = JSON.parse(localStorage.getItem("userContext")   || "{}");
const athleteCtx = JSON.parse(localStorage.getItem("athleteContext") || "{}");

let athleteId = athleteCtx.athleteId || null;
let clubId    = athleteCtx.clubId || userCtx.clubId || null;

// Popula header com foto do atleta (se tiver athleteContext)
if (athleteId && athleteCtx.nome) {
  const fotoEl = document.getElementById("atletaFotoNeuro");
  const nomeEl = document.getElementById("atletaNomeNeuro");
  if (athleteCtx.fotoUrl) {
    fotoEl.innerHTML = `<img src="${athleteCtx.fotoUrl}" style="width:100%;height:100%;object-fit:cover;">`;
  } else {
    const p = athleteCtx.nome.trim().split(" ");
    fotoEl.textContent = ((p[0]?.[0]||"")+(p[p.length-1]?.[0]||p[0]?.[1]||"")).toUpperCase();
  }
  nomeEl.textContent = athleteCtx.nome;
}

// Se veio do fluxo de atleta, redireciona de volta para seleção;
// se veio do staff, redireciona para prontidão.
const isStaff = ["staff", "admin"].includes(userCtx.role);
const redirectAposTeste = isStaff ? "/staff/prontidao.html" : "selecionar_atleta.html";

/* ===========================
   DOM
=========================== */
const painelSelecao     = document.getElementById("painelSelecao");
const selectAtleta      = document.getElementById("selectAtleta");
const btnConfirmar      = document.getElementById("btnConfirmarAtleta");
const atletaSelecionado = document.getElementById("atletaSelecionado");
const instrucoes        = document.getElementById("instrucoes");
const startBtn          = document.getElementById("startBtn");
const grid              = document.getElementById("grid");
const statusEl          = document.getElementById("status");
const timerEl           = document.getElementById("timer");
const saveStatusEl      = document.getElementById("saveStatus");

/* ===========================
   FLUXO: COM OU SEM ATLETA
=========================== */
if (!athleteId) {
  // Sem athleteContext — exibe seletor e aguarda escolha antes de liberar o teste
  instrucoes.classList.add("hidden");
  painelSelecao.classList.remove("hidden");

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = "/login.html"; return; }

    // Garante clubId via Firestore se necessário
    if (!clubId) {
      const snap = await getDoc(doc(db, "users", user.uid));
      clubId = snap.exists() ? snap.data().clubId : null;
    }
    if (!clubId) {
      selectAtleta.innerHTML = '<option value="">Clube não identificado.</option>';
      return;
    }

    // Carrega lista de atletas
    const snap = await getDocs(query(
      collection(db, "athletes"),
      where("clubId", "==", clubId)
    ));
    const atletas = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .filter(a => a.ativo !== false && a.status !== "inativo" && a.status !== "desligado")
      .sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));

    selectAtleta.innerHTML = '<option value="">Selecione...</option>' +
      atletas.map(a =>
        `<option value="${a.id}">${a.nome}${a.posicao ? " — " + a.posicao : ""}</option>`
      ).join("");
  });

  btnConfirmar.onclick = () => {
    const id   = selectAtleta.value;
    const nome = selectAtleta.options[selectAtleta.selectedIndex]?.text;
    if (!id) { alert("Selecione um atleta."); return; }

    athleteId = id;
    atletaSelecionado.textContent = `Atleta: ${nome}`;
    atletaSelecionado.classList.remove("hidden");
    btnConfirmar.disabled    = true;
    selectAtleta.disabled    = true;
    instrucoes.classList.remove("hidden");
  };

} else if (!clubId) {
  alert("Clube não identificado. Faça login novamente.");
  throw new Error("clubId ausente");
}

/* ===========================
   DATA
=========================== */
const d = new Date();
const dataHoje = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ===========================
   ESTADO DO TESTE
=========================== */
let fase = "livre";
let ordem = 1;
let inicioTempo = null;
let erros = 0;
let cliques = [];
let intervaloTimer = null;
let tempoRestante = 30;
let completouPressao = true;

const dados = { livre: {}, pressao: {} };

/* ===========================
   START
=========================== */
startBtn.onclick = () => {
  instrucoes.classList.add("hidden");
  painelSelecao.classList.add("hidden");
  iniciarFase("livre");
};

/* ===========================
   FUNÇÕES DO TESTE
=========================== */
function iniciarFase(tipo) {
  fase = tipo;
  ordem = 1;
  erros = 0;
  cliques = [];
  inicioTempo = null;
  completouPressao = true;

  statusEl.textContent = tipo === "livre" ? "Nível Livre" : "Nível Sob Pressão (30s)";

  grid.innerHTML = "";
  grid.classList.remove("hidden");
  timerEl.classList.add("hidden");
  saveStatusEl.classList.add("hidden");

  const nums = Array.from({ length: 25 }, (_, i) => i + 1).sort(() => Math.random() - 0.5);
  nums.forEach(n => {
    const btn = document.createElement("button");
    btn.textContent = n;
    btn.className = "border p-3 font-bold bg-gray-100";
    btn.onclick = () => clique(n, btn);
    grid.appendChild(btn);
  });
}

function clique(n, btn) {
  const agora = performance.now();
  if (n === ordem) {
    if (ordem === 1) {
      inicioTempo = agora;
      if (fase === "pressao") iniciarTempoPressao();
    }
    cliques.push(agora);
    btn.classList.add("bg-green-300");
    ordem++;
    if (ordem === 26) finalizarFase(false);
  } else {
    erros++;
    btn.classList.add("bg-red-300");
    setTimeout(() => btn.classList.remove("bg-red-300"), 200);
  }
}

function iniciarTempoPressao() {
  tempoRestante = 30;
  timerEl.textContent = `Tempo restante: ${tempoRestante}s`;
  timerEl.classList.remove("hidden");
  intervaloTimer = setInterval(() => {
    tempoRestante--;
    timerEl.textContent = `Tempo restante: ${tempoRestante}s`;
    if (tempoRestante <= 0) { clearInterval(intervaloTimer); finalizarFase(true); }
  }, 1000);
}

function finalizarFase(tempoEsgotado) {
  if (intervaloTimer) clearInterval(intervaloTimer);
  if (fase === "pressao" && tempoEsgotado) completouPressao = false;

  const tempo = inicioTempo ? ((performance.now() - inicioTempo) / 1000) : 30;
  const intervalos = cliques.slice(1).map((t, i) => t - cliques[i]);
  const media  = intervalos.reduce((a, b) => a + b, 0) / intervalos.length || 0;
  const desvio = Math.sqrt(
    intervalos.reduce((s, x) => s + (x - media) ** 2, 0) / intervalos.length || 0
  );

  dados[fase] = {
    tempo_total:  Number(tempo.toFixed(2)),
    erros,
    acuracia:     Number((25 / (25 + erros)).toFixed(2)),
    estabilidade: Number((desvio / tempo).toFixed(3))
  };

  if (fase === "livre") iniciarFase("pressao");
  else finalizarTeste();
}

/* ===========================
   HELPERS DE FEEDBACK
=========================== */
function mostrarSaveStatus(msg, tipo = "info") {
  const cores = { info: "bg-blue-100 text-blue-800", sucesso: "bg-green-100 text-green-800", erro: "bg-red-100 text-red-800" };
  saveStatusEl.className = `mt-4 text-center text-sm font-semibold py-3 px-4 rounded ${cores[tipo]}`;
  saveStatusEl.textContent = msg;
  saveStatusEl.classList.remove("hidden");
}

/* ===========================
   SALVAR E REDIRECIONAR
=========================== */
async function finalizarTeste() {
  grid.classList.add("pointer-events-none", "opacity-50");
  statusEl.textContent = "";
  timerEl.classList.add("hidden");
  mostrarSaveStatus("💾 Salvando resultados...", "info");
  await new Promise(r => setTimeout(r, 50));

  try {
    const deltaPct =
      ((dados.pressao.tempo_total - dados.livre.tempo_total) / dados.livre.tempo_total) * 100;

    let score =
      0.4 * Math.max(0, 100 - deltaPct * 2) +
      0.35 * dados.pressao.acuracia * 100 +
      0.25 * Math.max(0, 100 - dados.pressao.estabilidade * 1000);

    if (!completouPressao) score -= 10;
    score = Math.max(0, Math.round(score));

    const classificacao = score >= 70 ? "estavel" : score >= 60 ? "leve_atencao" : score >= 50 ? "atencao" : "critico";

    await upsertDailyMetrics({
      athleteId,
      date: dataHoje,
      block: "neuro",
      data: {
        protocolo: "neuroscore_v3",
        clubId,
        livre: dados.livre,
        pressao: dados.pressao,
        score,
        classificacao,
        horario: new Date().getHours() < 12 ? "manha" : new Date().getHours() < 18 ? "tarde" : "noite",
        features: { z_neuro: null, tendencia_7d: null, delta_pre: null }
      }
    });

    try { await calcularNeuroFeatures(athleteId); }
    catch (err) { console.warn("Features neuro não calculadas:", err); }

    mostrarSaveStatus("✅ Salvo com sucesso! Redirecionando...", "sucesso");
    setTimeout(() => { window.location.href = redirectAposTeste; }, 1500);

  } catch (err) {
    console.error("Erro ao salvar NeuroScore:", err);
    mostrarSaveStatus(`⚠️ Erro ao salvar: ${err.message}. Tente novamente.`, "erro");
    grid.classList.remove("pointer-events-none", "opacity-50");
  }
}
</script>

</body>
</html>
